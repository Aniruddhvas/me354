/* Module: Torsion (Notes 4.3.2, Eq. 4.12–4.20)
   Lengths in mm, torque in N·mm internally (N·m shown), stresses in MPa, angles in rad internally. */

function torsionModel(S, m) {
  const E = m.E * 1000, G = E / (2 * (1 + m.nu));
  const ro = S.ro, ri = S.sec === 'hollow' ? Math.min(S.ri, 0.98 * S.ro) : 0, L = S.L;
  const J = Math.PI * (ro ** 4 - ri ** 4) / 2;
  const ty = S.crit === 'vm' ? m.sy / Math.sqrt(3) : m.sy / 2;            // shear yield from the uniaxial σy
  const gy = ty / G, n = S.model === 'power' ? S.n : 0;
  // τ(γ): elastic, then perfectly plastic (n = 0) or power-law hardening τ = τy(γ/γy)^n, which is Eq. 4.18 with H set so it meets τy at γy
  const tau = g => { const a = Math.abs(g); const t = a <= gy ? G * a : ty * (a / gy) ** n; return Math.sign(g) * t; };
  const torque = th => {           // T = ∫ 2π r² τ(θr/L) dr  (Eq. 4.17), Simpson's rule
    const N = 600, hstep = (ro - ri) / N; let sum = 0;
    for (let i = 0; i <= N; i++) { const r = ri + i * hstep, w = i === 0 || i === N ? 1 : i % 2 ? 4 : 2; sum += w * 2 * Math.PI * r * r * tau(th * r / L); }
    return sum * hstep / 3;
  };
  const thY = gy * L / ro, Ty = ty * J / ro;
  const Tp = 2 * Math.PI * ty * (ro ** 3 - ri ** 3) / 3;               // fully plastic torque, perfectly plastic
  const thetaFor = T => {          // invert T(θ) by bisection
    if (T <= 0) return 0;
    if (T <= Ty) return T * L / (G * J);
    let hi = thY; for (let k = 0; k < 60 && torque(hi) < T; k++) hi *= 2;
    if (torque(hi) < T) return Infinity;
    let lo = thY; for (let k = 0; k < 80; k++) { const mid = (lo + hi) / 2; if (torque(mid) < T) lo = mid; else hi = mid; }
    return (lo + hi) / 2;
  };
  return { G, ro, ri, L, J, ty, gy, n, tau, torque, thY, Ty, Tp, thetaFor };
}

function drawShaft(el, S, K, th, ry) {
  const W = Math.max(300, el.clientWidth || 600), H = 200, s = Plot.s;
  const C = { ink: cv('--ink'), muted: cv('--muted'), acc: cv('--accent'), surf: cv('--surface'), fill: cv('--surface-2'), pl: cv('--c4'), gold: cv('--c2') };
  const svg = s('svg', { viewBox: `0 0 ${W} ${H}`, width: W, height: H, role: 'img', 'aria-label': 'Twisted shaft and its cross-section', 'font-family': 'IBM Plex Mono, Menlo, monospace' });
  s('rect', { x: 0, y: 0, width: W, height: H, fill: C.surf }, svg);
  const defs = s('defs', {}, svg); const mk = s('marker', { id: 'shA', viewBox: '0 0 10 10', refX: 9, refY: 5, markerWidth: 6, markerHeight: 6, orient: 'auto' }, defs); s('path', { d: 'M0,0 L10,5 L0,10 z', fill: C.gold }, mk);
  const x0 = 40, x1 = W * 0.66, cy = 100, R = Math.min(60, (x1 - x0) * 0.16);
  // fixed end
  s('rect', { x: x0 - 14, y: cy - R - 16, width: 14, height: 2 * R + 32, fill: C.fill, stroke: C.muted }, svg);
  for (let i = 0; i < 8; i++) s('line', { x1: x0 - 14, y1: cy - R - 12 + i * (2 * R + 24) / 7, x2: x0 - 4, y2: cy - R - 22 + i * (2 * R + 24) / 7, stroke: C.muted }, svg);
  s('rect', { x: x0, y: cy - R, width: x1 - x0, height: 2 * R, fill: C.fill, stroke: C.ink, 'stroke-width': 1.3 }, svg);
  // surface lines that were straight before twisting (visible front half only)
  const vis = Math.min(Math.abs(th) * 25, 2.2) * Math.sign(th || 1), k = th ? vis / th : 0;
  for (let i = 0; i < 12; i++) {
    const psi = i * Math.PI / 6; let d = '', pen = false;
    for (let j = 0; j <= 60; j++) {
      const x = j / 60, a = psi + vis * x, front = Math.sin(a) > 0.02;
      if (front) { d += (pen ? 'L' : 'M') + (x0 + x * (x1 - x0)).toFixed(1) + ',' + (cy - R * Math.cos(a)).toFixed(1); pen = true; } else pen = false;
    }
    s('path', { d, fill: 'none', stroke: C.acc, 'stroke-width': 1.2, opacity: 0.8 }, svg);
  }
  // torque arrow at the free end
  const ax = x1 + 8, arc = `M${ax},${cy - R - 10} A ${R * 0.5} ${R + 10} 0 0 1 ${ax},${cy + R + 10}`;
  s('path', { d: arc, fill: 'none', stroke: C.gold, 'stroke-width': 2, 'marker-end': 'url(#shA)' }, svg);
  const tl = s('text', { x: ax + R * 0.5 + 6, y: cy + 4, 'font-size': 12, fill: C.gold }, svg); tl.textContent = 'T';
  // cross-section with the plastic zone
  const cx = W * 0.86, Rc = Math.min(70, W * 0.11);
  s('circle', { cx, cy, r: Rc, fill: ry < K.ro ? C.pl : C.fill, 'fill-opacity': ry < K.ro ? 0.35 : 1, stroke: C.ink, 'stroke-width': 1.3 }, svg);
  if (ry < K.ro) s('circle', { cx, cy, r: Rc * Math.max(ry, K.ri) / K.ro, fill: C.fill, stroke: C.pl, 'stroke-dasharray': '3 2' }, svg);
  if (K.ri > 0) s('circle', { cx, cy, r: Rc * K.ri / K.ro, fill: C.surf, stroke: C.ink }, svg);
  const ct = s('text', { x: W - 6, y: cy + Rc + 18, 'text-anchor': 'end', 'font-size': 11, fill: ry < K.ro ? C.pl : C.muted }, svg);
  ct.textContent = ry < K.ro ? (ry <= K.ri ? 'fully plastic' : `plastic outside ry = ${fmt(ry, 3)} mm`) : 'all elastic';
  const nt = s('text', { x: x0, y: H - 8, 'font-size': 10.5, fill: C.muted }, svg);
  nt.textContent = th ? `twist exaggerated ×${fmt(k, 2)} · lines were straight before loading` : 'no twist';
  el.replaceChildren(svg);
}

defineModule({

  theory: String.raw`
    <div><p>Twisting a circular shaft of length \(L\) by an angle \(\theta\) shears it in proportion to the radius. In the elastic range \(\tau = G\gamma\), and integrating over the section gives the torsion formula:</p>
      <div class="eq">\[ \gamma = \frac{\theta r}{L},\qquad T = \frac{GJ\theta}{L} = \frac{\tau J}{r},\qquad \tau_{max} = \frac{T r_o}{J} \]</div>
      <p class="eqn">Eq. 4.12 – 4.15 · solid \(J = \frac{\pi}{2}r_o^4\), hollow \(J = \frac{\pi}{2}(r_o^4 - r_i^4)\) · angle of twist \(\theta = \frac{TL}{GJ}\)</p>
      <p>A shaft turning at \(f\) revolutions per second transmits power \(P = T\omega = 2\pi f T\).</p></div>

      <div class="eq">\[ T_{el} = \frac{\pi\tau_y r_y^3}{2},\qquad T_{pl} = \frac{2\pi H}{\sqrt3(n+3)}\Big(\frac{\theta}{\sqrt3 L}\Big)^n\big(r_o^{n+3} - r_y^{n+3}\big) \]</div>

/* Fit every model to a library material: power law through the necking point (Considère: εt = n at the UTS),

  const su = Math.max(m.su || sy * 1.05, sy * 1.02), st = su * Math.exp(n);       // true stress at the UTS
  const H = st / n ** n;
  const E2 = Math.max((st - sy) / Math.max(n - sy / E, 1e-6), 0);
  const M = clamp(Math.log(Math.max(n - st / E, 1e-6) / 0.002) / Math.log(st / sy), 2, 60);
  return { E: m.E, sy, E2: E2 / 1000, H, n, m: +M.toFixed(2) };
}

  epp: { name: 'Elastic–perfectly plastic', eq: '4.7', color: 'c6', s: (e, P) => Math.min(P.E * e, P.sy) },

  pow: { name: 'Power law σ = Hεⁿ', eq: '4.9', color: 'c3', s: (e, P) => P.H * Math.max(e, 0) ** P.n },
  ro: { name: 'Ramberg–Osgood', eq: '4.10', color: 'c1', s: (e, P) => {        // invert ε = σ/E + α(σ/E)(σ/σy)^(m−1), α = 0.002E/σy

/* Simulated tensile test of a ductile library material: Ramberg–Osgood hardening to the UTS, a necking drop, then fracture. */
function virtualTensile(m, spec, G) {
  const r = rng(hashStr(m.id + '#' + spec));

  const n = clamp((m.n || 0.15) * (1 + 0.05 * randn(r)), 0.03, 0.55), ef = Math.max((m.ef || 0.2) * (1 + 0.05 * randn(r)), n * 1.1);
  // linear up to a proportional limit σp = 0.8σy, then plastic strain 0.002((σ − σp)/(σy − σp))^M, so the 0.2 % offset yield is σy
  // and the true strain at the UTS is close to n
  const st = su * Math.exp(n), sp = 0.8 * sy, M = clamp(Math.log(Math.max(n - st / E, 1e-6) / 0.002) / Math.log((st - sp) / (sy - sp)), 1.2, 60);
  const A0 = G.shape === 'round' ? Math.PI * G.d * G.d / 4 : G.w * G.t, out = [];
  const epsOf = sg => sg / E + (sg > sp ? 0.002 * ((sg - sp) / (sy - sp)) ** M : 0);    // true strain from true stress
  const sgs = linspace(0, sp, 40).concat(linspace(sp, st, 600).slice(1));
  let last = [0, 0];
  for (const sg of sgs) { const et = epsOf(sg), ee = Math.exp(et) - 1, se = sg * Math.exp(-et); if (se < last[1] && ee > 0.01) break; last = [ee, se]; out.push(last); }
  const [eu, uts] = last, drop = 0.12 + 0.12 * r();
  for (let i = 1; i <= 160; i++) { const x = i / 160; out.push([eu + (ef - eu) * x, uts * (1 - drop * x ** 1.6)]); }
  const noiseF = uts * A0 * 0.0015;
  return out.map(([e, s]) => [Math.max(0, e * G.L0 + 0.0004 * G.L0 * 0.01 * randn(r)), Math.max(0, s * A0 + noiseF * randn(r))]);   // [extension mm, load N]
}

    if (cells.length >= 2 && Number.isFinite(cells[0]) && Number.isFinite(cells[1])) rows.push([cells[0], cells[1]]);

  if (pts.length >= 3) {
    const mx = pts.reduce((a, q) => a + q[0], 0) / pts.length, my = pts.reduce((a, q) => a + q[1], 0) / pts.length;
    let sxx = 0, sxy = 0, syy = 0; for (const [x, y] of pts) { sxx += (x - mx) ** 2; sxy += (x - mx) * (y - my); syy += (y - my) ** 2; }
    E = sxy / sxx; b0 = my - E * mx; R2 = sxy * sxy / (sxx * syy);
  }
  // 0.2 % offset yield: first crossing of σ = E(ε − 0.002) + b0
  let sy = NaN, ey = NaN;
  if (Number.isFinite(E) && E > 0) for (let i = 1; i <= iU; i++) {
    const d0 = sig[i - 1] - (E * (eps[i - 1] - 0.002) + b0), d1 = sig[i] - (E * (eps[i] - 0.002) + b0);
    if (d0 > 0 && d1 <= 0) { const t = d0 / (d0 - d1); ey = eps[i - 1] + t * (eps[i] - eps[i - 1]); sy = sig[i - 1] + t * (sig[i] - sig[i - 1]); break; }
  }
  const ef = eps[N - 1], toughness = curveArea(eps.map((e, i) => [e, sig[i]]));
  // true stress–strain up to the UTS (uniform deformation, constant volume) and a Hollomon fit between yield and UTS
  const tr = []; for (let i = 0; i <= iU; i++) if (eps[i] > 0) tr.push([Math.log(1 + eps[i]), sig[i] * (1 + eps[i])]);
  const fitPts = tr.filter(([e, s]) => Number.isFinite(sy) && s >= sy * (1 + 0.0) && e >= (Number.isFinite(ey) ? Math.log(1 + ey) : 0) && e > 0);
  let K = NaN, nH = NaN, R2h = NaN;
  if (fitPts.length >= 4) {
    const X = fitPts.map(q => Math.log(q[0])), Y = fitPts.map(q => Math.log(q[1])), mx = X.reduce((a, b) => a + b) / X.length, my = Y.reduce((a, b) => a + b) / Y.length;
    let sxx = 0, sxy = 0, syy = 0; X.forEach((x, i) => { sxx += (x - mx) ** 2; sxy += (x - mx) * (Y[i] - my); syy += (Y[i] - my) ** 2; });
    nH = sxy / sxx; K = Math.exp(my - nH * mx); R2h = sxy * sxy / (sxx * syy);
  }
  return { E, b0, R2, sy, ey, uts, eu, ef, toughness, tr, fitPts, K, nH, R2h, iU };
}

/* Module: Plastic Bending (Notes 4.3.3, Eq. 4.21–4.30). Rectangular section, elastic–perfectly plastic. */

const SHAPE_FACTORS = [
  ['Rectangle', 1.5, 'Mo/Mi = 3/2 (Eq. 4.30)'], ['Solid circle', 16 / (3 * Math.PI), '16/3π'], ['Diamond (square on its corner)', 2, ''],
  ['Thin-walled circular tube', 4 / Math.PI, '4/π'], ['Wide-flange I-beam (typical)', 1.14, '≈ 1.10–1.18'],
];
function plasticBendModel(S, m) {
  const E = m.E * 1000, sy = m.sy, c = S.h / 2, b = S.b, I = b * S.h ** 3 / 12;
  const ey = sy / E, Mi = 2 / 3 * b * sy * c * c, Mo = b * sy * c * c;
  const Mof = ec => ec <= ey ? E * ec * I / c : b * sy * c * c * (1 - (ey / ec) ** 2 / 3);     // Eq. 4.23, 4.27
  const ecOf = M => M <= Mi ? M * c / (E * I) : M < Mo ? ey / Math.sqrt(3 * (1 - M / Mo)) : Infinity;
  return { E, sy, c, b, I, ey, Mi, Mo, Mof, ecOf };
}

  theory: String.raw`
    <div><p>Plane sections stay plane, so the strain is linear through the depth even after yield (Eq. 4.21): \(\varepsilon(z) = \varepsilon_c z/c\). For an elastic–perfectly plastic material the stress is \(\sigma_y z/z_y\) inside the elastic core and \(\sigma_y\) outside it, where</p>
      <div class="eq">\[ z_y = \frac{\varepsilon_y}{\varepsilon_c}c = \frac{\sigma_y}{E}\frac{c}{\varepsilon_c} \]</div>
      <p class="eqn">Eq. 4.24</p>
      <p>Integrating \(\sigma b z\,dz\) over the depth (Eq. 4.25–4.26) gives the moment for a rectangle of width \(b\) and depth \(h = 2c\):</p>
      <div class="eq">\[ M = b\sigma_y c^2\Big(1 - \frac{(\sigma_y/E)^2}{3\varepsilon_c^2}\Big) \]</div>
      <p class="eqn">Eq. 4.27</p></div>
    <div><p>At first yield (\(\varepsilon_c = \varepsilon_y\)) and at full plasticity (\(\varepsilon_c \gg \varepsilon_y\)):</p>

/* Module: Factor of Safety (Notes 4.4, Eq. 4.31): design check of a round shaft under axial force, bending and torsion. */

const FOS_TARGETS = { aero: ['Aerospace (1.2–1.5)', 1.25], auto: ['Automotive (≈ 3)', 3], civil: ['Civil, normal loads (5–10)', 5], custom: ['Custom', null] };

function fosAnalysis(S, m, d) {
  const di = S.sec === 'hollow' ? S.ratio * d : 0;
  const A = Math.PI * (d * d - di * di) / 4, I = Math.PI * (d ** 4 - di ** 4) / 64, J = 2 * I, c = d / 2;
  const sN = S.N * 1000 / A, sM = Math.abs(S.M) * 1000 * c / I, tau = Math.abs(S.T) * 1000 * c / J;
  const sig = sN >= 0 ? sN + sM : sN - sM;                     // critical surface point: bending adds to the axial stress
  const C = sig / 2, R = Math.hypot(sig / 2, tau), s1 = C + R, s2 = C - R;
  const Y = { t: m.sy, c: m.syc || m.sy };
  const r = Object.fromEntries(Object.entries(YIELD_CRIT).map(([k, cr]) => [k, cr.f(s1, s2, 0, Y)]));
  return { d, di, A, I, J, sN, sM, tau, sig, s1, s2, r, fos: Object.fromEntries(Object.entries(r).map(([k, v]) => [k, v > 0 ? 1 / v : Infinity])) };
}

    <div><p>The factor of safety compares the strength with a working stress \(\sigma_w\) chosen to match the failure criterion:</p>
      <div class="eq">\[ FoS = \frac{\sigma_y}{\sigma_w},\qquad \sigma_w = \begin{cases} \sigma_{max\ principal} & \text{max normal} \\ 2\tau_{max} = \sigma_1 - \sigma_3 & \text{Tresca} \\ \frac{1}{\sqrt2}\sqrt{(\sigma_1-\sigma_2)^2 + (\sigma_1-\sigma_3)^2 + (\sigma_2-\sigma_3)^2} & \text{von Mises} \end{cases} \]</div>
      <p class="eqn">Eq. 4.31 · typical targets: aerospace 1.2–1.5, automotive about 3, civil 5–10</p></div>
    <div><p>At the surface of a round shaft the loads combine into one plane-stress state:</p>
      <div class="eq">\[ \sigma = \frac{N}{A} \pm \frac{M c}{I},\qquad \tau = \frac{T c}{J},\qquad \sigma_{1,2} = \frac{\sigma}{2} \pm \sqrt{\Big(\frac{\sigma}{2}\Big)^2 + \tau^2},\ \ \sigma_3 = 0 \]</div>
      <p class="eqn">\(I = \frac{\pi}{64}(d^4 - d_i^4)\), \(J = 2I\), \(c = d/2\) · Eq. 2.8, 4.15, 3.13</p>
      <p>A smaller factor of safety saves weight but needs the loads and material to be known more precisely.</p></div>`,

  caseStudy: {

      <p>On the evening of 17 July 1981 the atrium of the Hyatt Regency hotel in Kansas City was crowded with people. Two suspended walkways, one on the fourth floor directly above one on the second, hung from the ceiling on steel rods. The fourth-floor walkway gave way, fell onto the second-floor walkway, and both fell into the lobby. 114 people were killed and 216 injured.</p>
      <p>In the original design, single continuous rods ran from the ceiling through the fourth-floor box beams down to the second-floor walkway, with nuts under each beam, so each connection carried one walkway. Even that design met only 60% of the minimum load the Kansas City building code required. During construction the steel fabricator proposed two offset rods: one from the ceiling to the fourth floor, and a second from the fourth-floor beam down to the second floor. The change was approved without new calculations. Now the nut under each fourth-floor box beam carried both walkways, about twice the load, and the connection had roughly 30% of the required capacity. The box beams were two steel channels welded toe to toe, the rod passed through that weld, and the beam split along it so the nut pulled through. The state licensing board found the engineers of record guilty of gross negligence, and their firm lost its licences.</p>
      <p><b>Why it is a factor-of-safety problem.</b> The factor of safety is capacity divided by load, \(X = \sigma_{fail}/\sigma_{work}\). Codes ask for a margin well above 1 because loads, materials and workmanship are uncertain. The as-designed connection was already short of that margin, and the as-built change doubled the load on the same connection, halving its factor of safety. A change to the load path needs a new check, not just a phone call.</p>

/* ---------- shared field-map helpers (Ch. 5) ---------- */
/* Diverging map for signed values (blue < 0 < red) and a sequential map for magnitudes. t in [−1, 1] or [0, 1]. */
function cmapDiv(t) {
  t = clamp(t, -1, 1);
  const neg = [43, 92, 158], mid = [247, 247, 245], pos = [178, 52, 43];
  const a = Math.abs(t) ** 0.85, c = t < 0 ? neg : pos;
  return [0, 1, 2].map(i => Math.round(mid[i] + (c[i] - mid[i]) * a));
}
function cmapSeq(t) {
  t = clamp(t, 0, 1);
  const stops = [[48, 18, 59], [65, 69, 171], [33, 145, 140], [94, 201, 98], [253, 231, 37]];
  const x = t * (stops.length - 1), i = Math.min(Math.floor(x), stops.length - 2), f = x - i;
  return [0, 1, 2].map(k => Math.round(stops[i][k] + (stops[i + 1][k] - stops[i][k]) * f));
}
/* Colour bar as a small SVG. */
function colorBar(lo, hi, signed, label) {
  const W = 300, s = Plot.s, svg = s('svg', { viewBox: `0 0 ${W} 34`, width: '100%', height: 34, role: 'img', 'aria-label': 'Colour scale', 'font-family': 'IBM Plex Mono, Menlo, monospace', style: 'max-width:360px;display:block' });
  const defs = s('defs', {}, svg), gid = 'cb' + Math.random().toString(36).slice(2, 7), g = s('linearGradient', { id: gid }, defs);
  for (let i = 0; i <= 10; i++) { const t = i / 10, c = signed ? cmapDiv(2 * t - 1) : cmapSeq(t); s('stop', { offset: t, 'stop-color': `rgb(${c})` }, g); }
  s('rect', { x: 0, y: 2, width: W, height: 12, fill: `url(#${gid})`, rx: 2 }, svg);
  const tx = (x, str, anc) => { const e = s('text', { x, y: 30, 'text-anchor': anc, 'font-size': 11, fill: cv('--muted') }, svg); e.textContent = str; };
  tx(0, fmt(lo, 3), 'start'); tx(W / 2, label, 'middle'); tx(W, fmt(hi, 3), 'end');
  return svg;
}

/* Module: Stress Around a Circular Hole (Notes 5.1–5.3, Eq. 5.1–5.20; Kirsch solution) */

/* Kirsch stresses (polar) for a uniaxial far-field stress p acting along direction phi, at (r, θ). */
function kirschPolar(p, phi, a, r, th) {
  const q = a * a / (r * r), t = th - phi, c2 = Math.cos(2 * t), s2 = Math.sin(2 * t);
  return [p / 2 * ((1 - q) + (1 + 3 * q * q - 4 * q) * c2), p / 2 * ((1 + q) - (1 + 3 * q * q) * c2), -p / 2 * (1 - 3 * q * q + 2 * q) * s2];   // Eq. 5.13–5.15
}
/* Any far field (σx, σy, τxy) = two principal uniaxial loads, superposed (Sec. 5.3). Returns polar and Cartesian stresses. */
function holeStress(F, a, x, y) {
  const r0 = Math.hypot(x, y), th = Math.atan2(y, x);
  if (r0 < a * (1 - 1e-9)) return null;
  const r = Math.max(r0, a);   // points on the edge can round to just inside it
  const A = kirschPolar(F.p1, F.phi, a, r, th), B = kirschPolar(F.p2, F.phi + Math.PI / 2, a, r, th);
  const srr = A[0] + B[0], stt = A[1] + B[1], srt = A[2] + B[2], c = Math.cos(th), s = Math.sin(th);
  const sxx = srr * c * c + stt * s * s - 2 * srt * s * c, syy = srr * s * s + stt * c * c + 2 * srt * s * c, txy = (srr - stt) * s * c + srt * (c * c - s * s);
  return { srr, stt, srt, sxx, syy, txy, vm: Math.sqrt(sxx * sxx - sxx * syy + syy * syy + 3 * txy * txy) };
}
function farField(sx, sy, txy) {
  const M = mohrSolve(sx, sy, txy, 0);
  return { p1: M.s1, p2: M.s2, phi: Number.isFinite(M.thp) ? M.thp * Math.PI / 180 : 0 };
}
const HOLE_COMPS = { stt: ['σθθ (hoop)', true], srr: ['σrr (radial)', true], srt: ['σrθ (shear)', true], sxx: ['σxx', true], syy: ['σyy', true], txy: ['τxy', true], vm: ['von Mises', false] };
const HOLE_PRESETS = {
  uni: { label: 'Uniaxial tension (5.2)', sx: 100, sy: 0, txy: 0 }, comp: { label: 'Uniaxial compression (5.3.1)', sx: -100, sy: 0, txy: 0 },
  biax: { label: 'Equal biaxial tension (5.3.2)', sx: 100, sy: 100, txy: 0 }, tc: { label: 'Tension + compression (concept check)', sx: 100, sy: -100, txy: 0 },
  shear: { label: 'Pure shear', sx: 0, sy: 0, txy: 100 }, uniy: { label: 'Uniaxial tension along y', sx: 0, sy: 100, txy: 0 },
};

function drawField(el, opts) {      // opts: { box:[x0,x1,y0,y1], at(x,y) → value|null, lo, hi, signed, res, overlay(ctx, X, Y), hover(x,y) → string }
  const Wd = Math.max(260, el.clientWidth || 520), [x0, x1, y0, y1] = opts.box;
  const pw = Math.min(opts.res || 420, Math.round(Wd)), ph = Math.round(pw * (y1 - y0) / (x1 - x0));
  const cvs = h('canvas', { width: pw, height: ph, class: 'field', style: { width: '100%', height: 'auto', display: 'block', borderRadius: '4px' } });
  const ctx = cvs.getContext('2d'), img = ctx.createImageData(pw, ph), D = img.data, bg = [200, 200, 205];
  const span = Math.max(Math.abs(opts.lo), Math.abs(opts.hi), 1e-12);
  for (let j = 0; j < ph; j++) for (let i = 0; i < pw; i++) {
    const x = x0 + (i + 0.5) / pw * (x1 - x0), y = y1 - (j + 0.5) / ph * (y1 - y0), v = opts.at(x, y), o = 4 * (j * pw + i);
    const c = v == null || !Number.isFinite(v) ? bg : opts.signed ? cmapDiv(v / span) : cmapSeq((v - opts.lo) / ((opts.hi - opts.lo) || 1));
    D[o] = c[0]; D[o + 1] = c[1]; D[o + 2] = c[2]; D[o + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
  const X = x => (x - x0) / (x1 - x0) * pw, Y = y => (y1 - y) / (y1 - y0) * ph;
  if (opts.overlay) opts.overlay(ctx, X, Y, pw, ph);
  const tip = h('div', { class: 'tip', hidden: true }), wrap = h('div', { class: 'plot', style: { position: 'relative' } }, cvs, tip);
  if (opts.hover) {
    cvs.addEventListener('pointermove', e => { const rc = cvs.getBoundingClientRect(), x = x0 + (e.clientX - rc.left) / rc.width * (x1 - x0), y = y1 - (e.clientY - rc.top) / rc.height * (y1 - y0), t = opts.hover(x, y); if (!t) { tip.hidden = true; return; } tip.hidden = false; tip.textContent = t; tip.style.left = (e.clientX - rc.left) + 'px'; tip.style.top = (e.clientY - rc.top) + 'px'; });
    cvs.addEventListener('pointerleave', () => { tip.hidden = true; });
  }
  el.replaceChildren(wrap, colorBar(opts.signed ? -span : opts.lo, opts.signed ? span : opts.hi, opts.signed, opts.label || ''));
}

/* Module: Finite Element Plate (Notes 3.3.5, Ch. 5). Plane-stress 4-node quadrilaterals on a quarter plate with symmetry.

function feHolePlate(o) {
  const t0 = performance.now();

    const ox = j <= Nt1 ? Lx : Lx * (1 - (j - Nt1) / (Nt - Nt1)), oy = j <= Nt1 ? Ly * j / Nt1 : Ly;
    for (let i = 0; i <= Nr; i++) { const s = (i / Nr) ** (o.g || 2.2); X[id(i, j)] = ix + (ox - ix) * s; Y[id(i, j)] = iy + (oy - iy) * s; }
  }

  const g = 1 / Math.sqrt(3), GP = [[-g, -g], [g, -g], [g, g], [-g, g]], NX = [-1, 1, 1, -1], NY = [-1, -1, 1, 1];
  const Bmat = (e, xi, eta) => {     // returns { B (3×8), detJ }
    const dNx = NX.map((a, q) => a * (1 + eta * NY[q]) / 4), dNe = NY.map((b, q) => b * (1 + xi * NX[q]) / 4);
    let J11 = 0, J12 = 0, J21 = 0, J22 = 0;
    for (let q = 0; q < 4; q++) { const n = e[q]; J11 += dNx[q] * X[n]; J12 += dNx[q] * Y[n]; J21 += dNe[q] * X[n]; J22 += dNe[q] * Y[n]; }
    const det = J11 * J22 - J12 * J21, B = [new Float64Array(8), new Float64Array(8), new Float64Array(8)];
    for (let q = 0; q < 4; q++) { const dx = (J22 * dNx[q] - J12 * dNe[q]) / det, dy = (-J21 * dNx[q] + J11 * dNe[q]) / det; B[0][2 * q] = dx; B[1][2 * q + 1] = dy; B[2][2 * q] = dy; B[2][2 * q + 1] = dx; }
    return { B, det };
  };

  const nd = 2 * nn; let hb = 0;
  for (const e of els) { const ds = e.flatMap(n => [2 * n, 2 * n + 1]); hb = Math.max(hb, Math.max(...ds) - Math.min(...ds)); }
  const w = hb + 1, A = new Float64Array(nd * w), F = new Float64Array(nd);
  let bad = false;
  for (const e of els) {
    const Ke = Array.from({ length: 8 }, () => new Float64Array(8));
    for (const [xi, eta] of GP) {
      const { B, det } = Bmat(e, xi, eta); if (det <= 0) bad = true;
      const DB = D.map(row => Array.from({ length: 8 }, (_, c) => row[0] * B[0][c] + row[1] * B[1][c] + row[2] * B[2][c]));
      for (let r = 0; r < 8; r++) for (let c = 0; c < 8; c++) Ke[r][c] += (B[0][r] * DB[0][c] + B[1][r] * DB[1][c] + B[2][r] * DB[2][c]) * det * o.t;
    }
    const ds = e.flatMap(n => [2 * n, 2 * n + 1]);

    let s = Aat(j, j); for (let kk = Math.max(0, j - hb); kk < j; kk++) { const v = Lb[j * w + (j - kk)]; s -= v * v; }

    const Ljj = Math.sqrt(s); Lb[j * w] = Ljj;
    for (let i = j + 1; i <= Math.min(nd - 1, j + hb); i++) {
      let v = Aat(i, j); for (let kk = Math.max(0, i - hb); kk < j; kk++) v -= Lb[i * w + (i - kk)] * Lb[j * w + (j - kk)];
      Lb[i * w + (i - j)] = v / Ljj;
    }
  }
  const z = new Float64Array(nd);
  for (let i = 0; i < nd; i++) { let v = F[i]; for (let kk = Math.max(0, i - hb); kk < i; kk++) v -= Lb[i * w + (i - kk)] * z[kk]; z[i] = v / Lb[i * w]; }
  const U = new Float64Array(nd);
  for (let i = nd - 1; i >= 0; i--) { let v = z[i]; for (let kk = i + 1; kk <= Math.min(nd - 1, i + hb); kk++) v -= Lb[kk * w + (kk - i)] * U[kk]; U[i] = v / Lb[i * w]; }

  const sN = [new Float64Array(nn), new Float64Array(nn), new Float64Array(nn)], cnt = new Float64Array(nn), r3 = Math.sqrt(3);
  for (const e of els) {
    const ue = e.flatMap(n => [U[2 * n], U[2 * n + 1]]);
    const gs = GP.map(([xi, eta]) => { const { B } = Bmat(e, xi, eta); const eps = [0, 1, 2].map(r => B[r].reduce((s, b, c) => s + b * ue[c], 0)); return D.map(row => row[0] * eps[0] + row[1] * eps[1] + row[2] * eps[2]); });
    e.forEach((n, q) => {
      const xi = NX[q] * r3, eta = NY[q] * r3;
      const Nw = GP.map(([gx, gy]) => (1 + xi * Math.sign(gx)) * (1 + eta * Math.sign(gy)) / 4);
      for (let c = 0; c < 3; c++) sN[c][n] += Nw.reduce((s, wq, qq) => s + wq * gs[qq][c], 0);
      cnt[n]++;
    });
  }
  for (let c = 0; c < 3; c++) for (let n = 0; n < nn; n++) sN[c][n] /= cnt[n];
  return { X, Y, U, els, sN, Nr, Nt, id, nn, nd, hb, ms: performance.now() - t0, Lx, Ly };
}
const heywoodKt = dW => (2 + (1 - dW) ** 3) / (1 - dW);       // gross-section Kt for a central circular hole in a finite-width strip

  id: 'fe',
  title: 'Finite Element Plate',
  eq: 'Sec. 3.3.5, Ch. 5',

  theory: String.raw`

/* Module: Fracture Toughness & Factor of Safety (Notes 6.4, 6.6–6.7; Eq. 6.4, 6.6–6.7, 6.12–6.13) */

/* Critical crack length for geometry g at stress s (MPa), toughness K (MPa√m), width w (mm): solves a = (1/π)(K/(Y(a/w)σ))². Returns mm. */
function critCrack(g, K, s, w, Yc) {
  const G = CRACK_GEOMS[g], Y = r => g === 'custom' ? Yc : G.Y(r);
  if (g === 'inf' || g === 'custom') return 1000 / Math.PI * (K / (Y(0) * s)) ** 2;
  let lo = 1e-9, hi = G.max * w;                 // K(a) increases with a, so bisection works
  const Kof = a => Y(a / w) * s * Math.sqrt(Math.PI * a / 1000);
  if (Kof(hi) < K) return NaN;
  for (let i = 0; i < 80; i++) { const mid = (lo + hi) / 2; if (Kof(mid) < K) lo = mid; else hi = mid; }
  return (lo + hi) / 2;
}

/* Leading-order (K-field) stresses at (r, θ) from the tip; the crack lies along θ = ±180°. Mode I (Eq. 6.14–6.16) plus mode II. */
function crackTip(KI, KII, rmm, th) {
  const k = 1 / Math.sqrt(2 * Math.PI * rmm / 1000), c = Math.cos(th / 2), s = Math.sin(th / 2), c3 = Math.cos(3 * th / 2), s3 = Math.sin(3 * th / 2);
  return {
    sxx: k * (KI * c * (1 - s * s3) - KII * s * (2 + c * c3)),
    syy: k * (KI * c * (1 + s * s3) + KII * s * c * c3),
    sxy: k * (KI * c * s * c3 + KII * c * (1 - s * s3)),
  };
}

  hts: { label: 'High-toughness steel: σy 0.35 GPa, KIc 180', sy: 350, K: 180 }, al: { label: 'Aluminum 7075-T6: σy 503 MPa, KIc 26.7', sy: 503, K: 26.7 },
};

    else { const r = rng(hashStr('weibull' + S.seed + '|' + S.n)); data = Array.from({ length: Math.round(S.n) }, () => S.s0 * (-Math.log(1 - r()) / S.V) ** (1 / S.m)).sort((a, b) => a - b); }

    const X = data.map(Math.log), Yv = Fi.map(F => Math.log(Math.log(1 / (1 - F))));
    const mx = X.reduce((a, b) => a + b) / n, my = Yv.reduce((a, b) => a + b) / n;
    let sxx = 0, sxy = 0, syy = 0; X.forEach((x, i) => { sxx += (x - mx) ** 2; sxy += (x - mx) * (Yv[i] - my); syy += (Yv[i] - my) ** 2; });

    const sChar = Math.exp(-b / mFit);                         // stress where F = 63.2 % for these specimens

    const mean = data.reduce((a, c) => a + c) / n, sd = Math.sqrt(data.reduce((a, c) => a + (c - mean) ** 2, 0) / (n - 1));

      { k: 'Fit R²', v: R2 },
      { k: 'Mean strength', v: mean, u: 'MPa' }, { k: 'Coefficient of variation', v: sd / mean * 100, u: '%' },
      { k: `Allowable stress at ${fmt(S.Pf, 3)} % failure`, v: sAt(S.Pf / 100, mFit, sChar, 1), u: 'MPa' },
      { k: 'Median strength', v: sAt(0.5, mFit, sChar, 1), u: 'MPa' },
    ]);
    const xs = linspace(Math.log(data[0]) - 0.2, Math.log(data[n - 1]) + 0.2, 50);
    const wser = [{ name: useUser ? 'Your data' : 'Specimens', type: 'scatter', color: 'accent', r: 3.5, data: X.map((x, i) => [x, Yv[i]]) }, { name: `Fit: m = ${fmt(mFit, 3)}`, color: 'c4', width: 2.2, data: xs.map(x => [x, mFit * x + b]) }];
    if (!useUser) wser.push({ name: `True: m = ${fmt(S.m, 3)}`, color: 'c6', width: 1.5, dash: '5 4', data: xs.map(x => [x, Math.log(S.V) + S.m * (x - Math.log(S.s0))]) });
    Plot.render(p.pW, { h: 280, aria: 'Weibull plot', x: { label: 'ln σ (σ in MPa)', short: 'ln σ' }, y: { label: 'ln ln(1/(1 − F))', short: 'y' }, series: wser, legend: 'tl' });
    const ss = linspace(0, data[n - 1] * 1.25, 200);
    Plot.render(p.pF, {
      h: 280, aria: 'Failure probability versus stress',
      x: { label: 'Stress σ (MPa)', short: 'σ', zero: true }, y: { label: 'Probability of failure F', short: 'F', min: 0, max: 1 },
      series: [{ name: 'Specimens (rank)', type: 'scatter', color: 'accent', r: 3, data: data.map((d, i) => [d, Fi[i]]) }, { name: 'Fitted Weibull', color: 'c4', width: 2.2, data: ss.map(s => [s, 1 - Math.exp(-((s / sChar) ** mFit))]) }],
      marks: [{ t: 'hline', y: S.Pf / 100, color: 'c2', label: `${fmt(S.Pf, 3)} %`, anchor: 'start' }], legend: 'br',

    Plot.render(p.pH, { h: 260, aria: 'Histogram of strengths', x: { label: 'Strength (MPa)', short: 'σ', min: lo - bw, max: hi + bw }, y: { label: 'Count', short: 'n', zero: true }, series: [{ name: 'Weibull fit', color: 'c4', width: 2, data: linspace(Math.max(lo - bw, 1e-6), hi + bw, 150).map(s => [s, pdf(s)]) }], marks: hm, legend: 'tr' });

      marks: useUser ? [] : [{ t: 'pt', x: S.V, y: sAt(0.5, S.m, S.s0, S.V), r: 5, color: 'c4', label: 'this batch', top: true }], legend: 'bl',
    });
  },
});

/* ---------- Ch. 7 shared: Basquin stress–life ---------- */
/* σa = σ'f (2Nf)^b (Eq. 7.5), optionally with an endurance limit σe below which life is infinite. */
const basquinS = (N, F) => Math.max(F.sfp * (2 * N) ** F.b, F.se || 0);
const basquinN = (sa, F) => (F.se && sa <= F.se) ? Infinity : 0.5 * (sa / F.sfp) ** (1 / F.b);
/* Fatigue properties of the selected material, or the user's own. */
function fatigueProps(S, m) {
  if (S.own) return { sfp: S.sfp, b: S.b, su: S.su, sy: S.sy, se: S.endur ? S.se : 0, name: 'Your material' };
  return { sfp: m.sfp, b: m.b, su: m.su, sy: m.sy, se: S.endur ? S.se : 0, name: m.name };
}
function fatigueMaterialControls(p) {
  p.material({ filter: m => m.sfp > 0, help: 'Fatigue constants from Table 7.1.' });
  p.chk('own', { label: 'Use my own fatigue constants', value: false });
  p.num('sfp', { label: 'Fatigue strength coefficient σ′f', unit: 'MPa', min: 50, max: 4000, step: 1, value: 1760 });
  p.num('b', { label: 'Fatigue exponent b', min: -0.3, max: -0.03, step: 0.001, value: -0.098 });
  p.num('su', { label: 'Ultimate strength σult', unit: 'MPa', min: 10, max: 3000, step: 1, value: 1170 });
  p.num('sy', { label: 'Yield strength σy', unit: 'MPa', min: 10, max: 3000, step: 1, value: 1100 });
  p.chk('endur', { label: 'Material has an endurance limit', value: false });
  p.num('se', { label: 'Endurance limit σe', unit: 'MPa', min: 10, max: 1500, step: 1, value: 500, help: 'Steels: roughly half of σult (up to about 700 MPa).' });
}
function fatigueMaterialShow(p) {
  for (const k of ['sfp', 'b', 'su', 'sy']) p.controls[k].wrap.hidden = !p.S.own;
  p.controls.se.wrap.hidden = !p.S.endur;
}

      <p>Two common alternatives bracket it: Gerber’s parabola \(\sigma_a/\sigma_{ar} + (\sigma_m/\sigma_{ult})^2 = 1\), closer to test data for ductile metals, and Soderberg’s line to the yield strength \(\sigma_a/\sigma_{ar} + \sigma_m/\sigma_y = 1\), more conservative still.</p></div>
    <div><p>If the amplitude and mean grow together (a proportional load line through the origin), the factor of safety by Goodman is</p>

      <p>On 17 April 2018 a Boeing 737-700 flying from New York to Dallas lost a fan blade from its left engine. Blade number 13 broke off at its root; pieces of the engine inlet and cowling struck the fuselage and broke a cabin window in row 14, and the cabin lost pressure. One passenger died and eight were injured; the crew landed in Philadelphia 17 minutes later.</p>
      <p>The investigation found a fatigue crack in the blade’s dovetail, the shaped root that slots into the fan disk. It had started because the dovetail stresses under normal operating loads were higher than expected. The blade had flown more than 32,000 engine cycles and had last been overhauled 10,712 cycles before the accident; the fluorescent-penetrant and visual checks used then were unlikely to find such a crack. A similar blade failure had happened on another Southwest 737 in 2016. Afterwards, regulators required ultrasonic inspections of high-cycle fan blades, and the engine cowl was redesigned to survive a blade release.</p>
      <p><b>Why it is a mean-stress problem.</b> A spinning blade pulls outward on its root with a large, steady centrifugal force: a high mean stress \(\sigma_m\). Vibration of the blade and each change in engine speed add an alternating stress \(\sigma_a\) on top. The Goodman relation turns that combination into an equivalent fully reversed amplitude, \(\sigma_{ar} = \sigma_a / (1 - \sigma_m/\sigma_{ult})\), so the same vibration that is harmless on a blade at rest uses up life quickly on one spinning at full speed. If the real stresses are higher than the design assumed, the operating point moves outside the safe region of the diagram.</p>

      // live: Goodman-equivalent amplitude and life for the current point, against the same amplitude with no mean

    cc.append(

  update(p) {

      <div class="eq">\[ d_i = \frac{N_i}{N_{fi}},\qquad D = \sum_{i=1}^{M} \frac{N_i}{N_{fi}} \]</div>

      <p>The <i>Alexander L. Kielland</i> was a semi-submersible drilling rig in the Ekofisk field of the North Sea, used as floating accommodation for oil workers. On the evening of 27 March 1980, in rain, fog, winds gusting to 40 knots and waves up to 12 m, the crew felt a sharp crack. One of the five columns had broken away; the rig heeled over to about 30°, its anchor cables parted one by one, and it capsized. Of the 212 people on board, 123 died.</p>
      <p>The failure began in brace D-6, one of the horizontal tubes tying column D to the rest of the rig. A small flange plate holding a sonar device had been fitted into the brace with a 6 mm fillet weld. The weld had a poor profile, the plate showed lamellar tearing, and the weld beneath it had cold cracks. A fatigue crack grew from there around the brace under the constant working of the waves; paint found on part of the fracture surface suggested the crack dated back to construction. When D-6 broke, the other braces to column D were overloaded and failed in turn, and the design had no spare load path to hold the column.</p>
      <p><b>Why it is a Miner’s-rule problem.</b> Waves load a brace at every size: millions of small waves a year, fewer large ones and a handful of storm waves. Miner’s rule adds up the fraction of life used by each group, \(D = \sum n_i / N_i\), and the brace fails when \(D\) reaches 1. Because \(N \propto \sigma_a^{1/b}\) with \(b \approx -0.1\), the rare large waves do most of the damage, and anything that raises the local stress, like a poor weld at a fitting, shortens the life by orders of magnitude.</p>

/* Module: Paris' Law (Notes 7.4, Eq. 7.12–7.13). C in m/cycle with ΔK in MPa√m; crack sizes in mm. */

const PARIS_PRESETS = { steel: { label: 'Steel (C 0.1×10⁻¹¹, m 4)', C: 1e-12, m: 4 }, al: { label: 'Aluminum (C 4.5×10⁻¹¹, m 2.9)', C: 4.5e-11, m: 2.9 }, cu: { label: 'Copper (C 1.3×10⁻¹¹, m 3.9)', C: 1.3e-11, m: 3.9 }, ti: { label: 'Titanium (C 68×10⁻¹¹, m 4.4)', C: 6.8e-10, m: 4.4 } };

  title: "Paris' Law",
  eq: 'Eq. 7.12–7.13',
  lede: 'Fatigue is crack growth. Integrate Paris’ law from the crack you might miss in an inspection to the crack that fractures the part, and use the result to set inspection intervals.',
  theory: String.raw`
    <div><p>Each cycle grows a crack by an amount set by the range of stress intensity, \(\Delta K = Y\Delta\sigma\sqrt{\pi a}\):</p>
      <div class="eq">\[ \frac{da}{dN} = C(\Delta K)^m \]</div>
      <p class="eqn">Eq. 7.12 · Table 7.2: steel C ≈ 0.1×10⁻¹¹, m = 4; Al 4.5×10⁻¹¹, 2.9; Cu 1.3×10⁻¹¹, 3.9; Ti 68×10⁻¹¹, 4.4 (m/cycle, ΔK in MPa√m)</p>
      <p>With a constant geometry factor the cycles to grow from \(a_i\) to \(a_f\) integrate to</p>
      <div class="eq">\[ N_f = \frac{a_f^{\,1-m/2} - a_i^{\,1-m/2}}{C\,(Y\Delta\sigma\sqrt\pi)^m\,(1 - m/2)} \]</div>
      <p class="eqn">Eq. 7.13 (with Y included) · the final crack is where \(K_{max}\) reaches \(K_{Ic}\): \(a_f = \frac1\pi\big(K_{Ic}/(Y\sigma_{max})\big)^2\)</p></div>
    <div><p>Paris’ law holds in the middle region of crack growth. Below a threshold \(\Delta K_{th}\) cracks hardly grow, the crack-growth version of an endurance limit; near \(K_{Ic}\) growth accelerates into fracture.</p>
      <p>Most of the life is spent while the crack is small, so finding cracks early matters far more than the exact final crack size. A common rule sets the inspection interval to half the cycles needed to grow from the smallest detectable crack to failure, so that every crack is seen at least twice.</p></div>`,

  caseStudy: {
    title: 'Aloha Airlines Flight 243 (1988)',
    html: String.raw`
      <p>On 28 April 1988 a Boeing 737-200 flying between Hawaiian islands lost about 18 ft (5.5 m) of the upper fuselage at 24,000 ft. A flight attendant was swept out and killed and 65 people were injured; the crew landed on Maui about 13 minutes later. The aircraft was 19 years old and had made 89,680 flights, the second-highest count of any 737 in the world, because it flew short hops all day.</p>
      <p>The investigation found fatigue cracks along a lap joint, where two skin panels overlap and are riveted together, made worse by corrosion where the bonded joint had come apart. Many small cracks had grown from neighbouring rivet holes in the upper rivet row. Each one was small, but together they linked into one long crack, and the structure was no longer able to stop a running crack as designed. The maintenance programme had not found the cracking and disbonding.</p>
      <p><b>Why it is a Paris’ law problem.</b> Every flight pressurises the cabin once, so the skin sees one load cycle per flight, from zero up to the hoop stress \(pr/t\) and back (\(R \approx 0\)). Each cycle grows a crack by \(da/dN = C(\Delta K)^m\), slowly while it is small and faster as \(\Delta K = Y\Delta\sigma\sqrt{\pi a}\) rises. Safe operation depends on finding cracks between the smallest size an inspection can detect and the critical size where \(K_{max} = K_{Ic}\). Cracks that link up jump straight to a longer length and use up most of that margin at once.</p>
      <div class="facts">

      let d = ''; for (let i = 0; i <= 100; i++) { const t = i / 100; d += (i ? ' L' : 'M') + (x0 + (x1 - x0 - 10) * t).toFixed(1) + ',' + Y(g(t)).toFixed(1); }

      const yc = Y(0.95), yd = Y(0.16), td = Math.pow((0.16 - 0.06) / 0.94, 1 / 6), tc = Math.pow((0.95 - 0.06) / 0.94, 1 / 6), xd = x0 + (x1 - x0 - 10) * td, xc = x0 + (x1 - x0 - 10) * tc;
      s += L(x0, yc, x1, yc, C.bad, 1, '5 3') + T(x0 + 12, yc - 6, 'critical crack: K = KIc', { a: 'start', c: C.bad });
      s += L(x0, yd, x1, yd, C.c3, 1, '5 3') + T(x0 + 12, yd - 6, 'detectable crack', { a: 'start', c: C.c3 });
      s += L(xd, yd, xd, y0, C.mu, 0.8, '2 2') + L(xc, yc, xc, y0, C.mu, 0.8, '2 2') + A(xd + 2, y0 - 14, xc - 2, y0 - 14, 'ink', 1.2, true);
      s += T((xd + xc) / 2, y0 - 20, 'window', { c: C.ink, fs: 10 }) + T(x1 - 4, y0 + 16, 'flights N', { a: 'end' }) + T(x0 - 6, yt + 4, 'a', { a: 'end', c: C.ink });
      // live: integrate Paris' law for the current settings (closed form, m ≠ 2)
      const S = p.S, Cc = S.C11 * 1e-11, m = S.m, ds = S.tens ? S.smax - Math.max(S.smin, 0) : S.smax - S.smin, ai = S.ai / 1000;
      const ac = (S.KIc / (S.Y * S.smax)) ** 2 / Math.PI, k = 1 - m / 2;
      let live;
      if (ai >= ac) live = `In the simulator now: the starting crack (${fmt(S.ai, 3)} mm) is already longer than the critical crack (${fmt(ac * 1000, 3)} mm), so the part fails on the first cycle.`;
      else if (S.Y * ds * Math.sqrt(Math.PI * ai) < S.Kth) live = `In the simulator now: ΔK at the starting crack is below the threshold, so it does not grow.`;
      else {
        const N = (ac ** k - ai ** k) / (Cc * (S.Y * ds * Math.sqrt(Math.PI)) ** m * k);
        live = `In the simulator now: a ${fmt(S.ai, 3)} mm crack grows to the critical ${fmt(ac * 1000, 3)} mm in about ${fmt(N, 3)} cycles, or ${fmt(N / S.freq, 3)} days at ${fmt(S.freq, 3)} cycles a day. Inspections must come well inside that window.`;
      }
      out(el, s, 'Boeing 737 with a section of roof missing; a riveted lap joint with small cracks linking along the upper rivet row; crack length growing with flights between the detectable and critical sizes', live);
    },
  },

  build(p) {

      h('p', { class: 'concept' }, h('b', null, 'Where does the life go? '), 'Look at the crack-length curve. What fraction of the life is spent while the crack is still smaller than twice its initial size?'),
      h('p', { class: 'concept' }, h('b', null, 'Better inspection. '), 'Halve the smallest detectable crack. How much longer is the life? Compare that with doubling KIc.'),
      h('p', { class: 'concept' }, h('b', null, 'Stress matters most. '), 'Life scales as Δσ^−m. With m ≈ 4, what happens to the life if the stress range is cut by 20 %?'),
      h('p', { class: 'concept' }, h('b', null, 'Threshold. '), 'Lower the stress range until the starting ΔK falls below ΔKth. What does the model predict, and how does that relate to the endurance limit of an S-N curve?'));
  },

  update(p) {
    const S = p.S, f = v => fmt(v, 4), C = S.C11 * 1e-11, m = S.m, Y = S.Y;
    const pm = Object.entries(PARIS_PRESETS).find(([, v]) => Math.abs(v.C * 1e11 - S.C11) < 1e-9 && v.m === S.m);
    if (S.pp !== (pm ? pm[0] : 'custom')) p.controls.pp.set(pm ? pm[0] : 'custom');
    const ds = S.tens ? S.smax - Math.max(S.smin, 0) : S.smax - S.smin;
    const ai = S.ai / 1000, af = (S.KIc / (Y * S.smax)) ** 2 / Math.PI, R = S.smin / S.smax;
    const dK = a => Y * ds * Math.sqrt(Math.PI * a), rate = a => C * dK(a) ** m;
    const Nf = af > ai ? (af ** (1 - m / 2) - ai ** (1 - m / 2)) / (C * (Y * ds * Math.sqrt(Math.PI)) ** m * (1 - m / 2)) : 0;
    const Nto = a => (a ** (1 - m / 2) - ai ** (1 - m / 2)) / (C * (Y * ds * Math.sqrt(Math.PI)) ** m * (1 - m / 2));
    const below = dK(ai) < S.Kth;
    const N2 = af > 2 * ai ? Nto(2 * ai) : Nf;
    p.readouts(p.ro, [
      { k: 'Stress range Δσ', v: ds, u: 'MPa' }, { k: 'R = σmin/σmax', v: R },
      { k: 'ΔK at the start', v: dK(ai), u: 'MPa√m', cls: below ? 'ok' : null, title: below ? 'Below the threshold: little or no growth' : '' },
      { k: 'Final crack af', v: af * 1000, u: 'mm', title: 'Kmax = KIc' },
      { k: 'Cycles to failure Nf', v: below ? '∞ (below ΔKth)' : Nf, eq: '7.13', cls: below ? 'ok' : null },
      { k: 'In service', v: below ? '—' : Nf / S.freq / 365, u: below ? '' : 'years' },
      { k: 'Inspection interval (Nf/2)', v: below ? '—' : Nf / 2, u: below ? '' : 'cycles' },
      { k: 'Life spent before a reaches 2ai', v: below || !(Nf > 0) ? '—' : N2 / Nf * 100, u: below ? '' : '%' },
      { k: 'Growth rate at the start', v: rate(ai), u: 'm/cycle' },
    ]);
    if (!below && af > ai) {
      const as = linspace(Math.log10(ai), Math.log10(af), 200).map(v => 10 ** v);
      // numerical check of Eq. 7.13 by integrating dN = da / C(ΔK)^m
      let Nnum = 0; for (let i = 1; i < as.length; i++) Nnum += (as[i] - as[i - 1]) * (1 / rate(as[i]) + 1 / rate(as[i - 1])) / 2;
      Plot.render(p.pA, {
        h: 280, aria: 'Crack length versus cycles',
        x: { label: 'Cycles N', short: 'N', zero: true }, y: { label: 'Crack length a (mm)', short: 'a', zero: true },
        series: [{ name: 'a(N)', color: 'accent', width: 2.6, data: as.map(a => [Nto(a), a * 1000]) }],
        marks: [{ t: 'hline', y: af * 1000, color: 'c4', label: 'af (fracture)', anchor: 'start' }, { t: 'vline', x: Nf / 2, color: 'c2', label: 'inspect' }, { t: 'pt', x: N2, y: 2 * ai * 1000, r: 4, color: 'c3', label: 'a = 2ai', top: true }],
        legend: false,
      });
      p.steps.replaceChildren(...[
        `Δσ = ${f(ds)} MPa, Y = ${f(Y)};  af = (1/π)(KIc/(Yσmax))² = (1/π)(${f(S.KIc)}/(${f(Y)} × ${f(S.smax)}))² = ${f(af * 1000)} mm`,
        `Nf = (af^(1−m/2) − ai^(1−m/2)) / (C(YΔσ√π)^m (1 − m/2)) = ${fmt(Nf, 5)} cycles   (Eq. 7.13)`,
        `Check by numerical integration of dN = da / C(ΔK)^m: ${fmt(Nnum, 5)} cycles`,
      ].map(t => h('div', { class: 'mrow' }, t)));
    } else {
      p.pA.replaceChildren(h('p', { class: 'note' }, below ? 'The starting ΔK is below the threshold, so the crack is not expected to grow.' : 'The initial crack is already larger than the critical crack: the part fractures on the first peak.'));
      p.steps.replaceChildren();
    }
    // da/dN vs ΔK with the three regions (schematic outside region II)
    const Kc = S.KIc * (1 - Math.max(R, 0)), Ks = linspace(Math.log10(S.Kth * 0.6), Math.log10(Kc * 0.999), 200).map(v => 10 ** v);
    const full = K => K <= S.Kth ? NaN : C * K ** m * (1 - (S.Kth / K) ** 2) / (1 - K / Kc);
    Plot.render(p.pR, {
      h: 280, aria: 'Crack growth rate versus stress intensity range',
      x: { label: 'ΔK (MPa√m)', short: 'ΔK', log: true }, y: { label: 'da/dN (m/cycle)', short: 'rate', log: true, min: 1e-12, max: 1e-2 },
      series: [{ name: 'Paris’ law (region II)', color: 'accent', width: 2.4, data: Ks.map(K => [K, C * K ** m]) }, { name: 'With threshold and fracture (I, III)', color: 'c4', width: 1.6, dash: '5 4', data: Ks.map(K => [K, full(K)]) }],
      marks: [{ t: 'vline', x: S.Kth, color: 'c6', label: 'ΔKth' }, { t: 'vline', x: Kc, color: 'c4', label: 'KIc limit' }].concat(below ? [] : [{ t: 'pt', x: dK(ai), y: rate(ai), r: 4.5, color: 'c2', label: 'start', top: true }, { t: 'pt', x: dK(af), y: rate(af), r: 4.5, color: 'c4', label: 'end', top: true }]),
      legend: 'tl',
    });
  },
});

/* Module: Rigid-Rod Buckling (Notes 8, 8.2.1; Eq. 8.5–8.7). Large rotations kept; θ in radians internally. */

/* Two springs: lateral spring k at the top (the notes' model) or rotational spring K at the base. Load in units of Pcr. */
const RR = {
  lateral: { name: 'Lateral spring at the top (notes)', Pcr: S => S.k * S.L,                       // N
    energy: (S, P, t) => 0.5 * S.k * (S.L * Math.sin(t) - S.L * Math.sin(S.t0)) ** 2 - P * S.L * (1 - Math.cos(t)),
    path: (S, t) => S.k * S.L * (1 - Math.sin(S.t0) / Math.sin(t)) * Math.cos(t) },                  // P on the equilibrium path
  rotational: { name: 'Rotational spring at the base', Pcr: S => S.K / S.L,
    energy: (S, P, t) => 0.5 * S.K * (t - S.t0) ** 2 - P * S.L * (1 - Math.cos(t)),
    path: (S, t) => S.K * (t - S.t0) / (S.L * Math.sin(t)) },
};

defineModule({
  id: 'rigidrod',
  title: 'Rigid-Rod Buckling',
  eq: 'Eq. 8.5–8.7',
  lede: 'The simplest model of buckling: a rigid rod held upright by a spring. Below a critical load the straight position is stable; above it the rod snaps sideways. Follow the energy landscape and the equilibrium paths, and see how a tiny initial tilt changes everything.',
  theory: String.raw`
    <div><p>A rigid rod of length \(L\), pinned at the base and held by a spring of stiffness \(k\) at the top, carries a vertical load \(P\). Taking moments about the base for a tilt \(\theta\):</p>
      <div class="eq">\[ \sum M_O = PL\sin\theta - kL^2\sin\theta\cos\theta = 0 \]</div>
      <p class="eqn">Eq. 8.5</p>
      <p>For small tilts this is \(L\theta(P - kL) = 0\): either the rod stays straight, or \(P\) equals the critical load</p>
      <div class="eq">\[ P_{cr} = kL \]</div>
      <p class="eqn">Eq. 8.6 – 8.7 · stable for P &lt; kL, unstable for P ≥ kL</p></div>
    <div><p>Keeping the full \(\sin\theta\) and \(\cos\theta\) shows what happens after buckling. The total potential energy is spring energy minus the work done by the load as it drops:</p>
      <div class="eq">\[ \Pi(\theta) = \tfrac12 k L^2(\sin\theta - \sin\theta_0)^2 - PL(1 - \cos\theta) \]</div>
      <p>Equilibria are where \(d\Pi/d\theta = 0\); they are stable at a minimum. With the spring at the top the load the rod can hold falls after buckling (\(P = kL\cos\theta\)), so it snaps. With a rotational spring \(K\) at the base it rises (\(P = K\theta/L\sin\theta\), with \(P_{cr} = K/L\)), so it buckles gently. A small initial tilt \(\theta_0\) removes the sharp bifurcation altogether.</p></div>`,
  caseStudy: {

      <p>The bell tower in Pisa, Italy, is about 56 m tall and weighs about 14,500 tonnes. Its foundation, only about 3 m deep, sits on soft, wet clay, silt and sand, with the water table 1–2 m below the ground. Building started in 1173; by 1178, at the second floor, it had begun to sink and lean. Wars then stopped work for most of a century, which gave the clay time to consolidate and stiffen. Without that pause the tower would almost certainly have toppled. It was finished in 1372.</p>
      <p>The lean kept growing for centuries, and the rate was speeding up by the 20th century. By 1990 the tilt was about 5.5°, and the tower was closed on 7 January 1990, after a medieval tower in Pavia had collapsed the year before. Lead counterweights were placed on the north side, and from 1999 engineers drilled out soil from under the north edge. The tilt fell by about half a degree (about 45 cm at the top), back to where it was in 1838. The tower reopened on 15 December 2001, and in 2008 it was reported to have stopped moving.</p>
      <p><b>Why it is a rigid-rod problem.</b> The masonry tower hardly bends; it rotates as a rigid body on the soil, which acts as a rotational spring \(K\) at the base. That is this module’s rotational model with the tower’s weight as the load: the straight position is lost when \(P = K/L\). Engineers modelling the tower as an inverted pendulum on a soil spring found that it was close to this “leaning instability”. The tilt was never just a strength problem: the initial lean from the uneven soil acted like the initial tilt \(\theta_0\), and near the critical load a small \(\theta_0\) grows a lot. The fixes worked on both sides of \(P = K/L\): the long pause made \(K\) larger, the counterweights cut the overturning moment, and the soil extraction reduced the tilt itself. Soft soil also loses stiffness as it rotates, so unlike the stable rotational spring here, a real foundation can tip over once the lean gets large.</p>

/* Module: Euler Buckling (Notes 8.1–8.2, Eq. 8.1–8.4, 8.10–8.19). Lengths mm, forces N, stresses MPa. */

const EULER_ENDS = {
  pp: { name: 'Pinned–pinned', k: 1, shape: (x, n) => Math.sin(n * Math.PI * x) },
  fp: { name: 'Fixed–pinned', k: null, shape: null },
  ff: { name: 'Fixed–fixed', k: 0.5, shape: (x, n) => 1 - Math.cos(2 * n * Math.PI * x) },
  fr: { name: 'Fixed–free', k: 2, shape: (x, n) => 1 - Math.cos((2 * n - 1) * Math.PI * x / 2) },
};
/* Smallest positive root of tan(z) = z (fixed–pinned, Eq. 8.18), found by bisection on (π, 3π/2). */
const fixedPinnedRoot = (() => { let a = Math.PI + 1e-9, b = 1.5 * Math.PI - 1e-9; for (let i = 0; i < 100; i++) { const m = (a + b) / 2; if (Math.tan(m) - m < 0) a = m; else b = m; } return (a + b) / 2; })();
EULER_ENDS.fp.k = Math.PI / fixedPinnedRoot;
EULER_ENDS.fp.shape = x => { const z = fixedPinnedRoot, C2 = -(Math.sin(z) - z) / (Math.cos(z) - 1); return (Math.sin(z * x) - z * x) + C2 * (Math.cos(z * x) - 1); };   // fixed at x = 0, pinned at x = 1
function columnSection(S) {
  if (S.sec === 'rect') { const b = Math.max(S.b, S.h), t = Math.min(S.b, S.h); return { A: S.b * S.h, I: b * t ** 3 / 12, c: t / 2, label: `${fmt(S.b, 3)} × ${fmt(S.h, 3)} mm rectangle (weak axis)` }; }
  if (S.sec === 'circ') return { A: Math.PI * S.d ** 2 / 4, I: Math.PI * S.d ** 4 / 64, c: S.d / 2, label: `${fmt(S.d, 3)} mm solid round` };
  const di = Math.min(S.di, S.d * 0.98); return { A: Math.PI * (S.d ** 2 - di ** 2) / 4, I: Math.PI * (S.d ** 4 - di ** 4) / 64, c: S.d / 2, label: `${fmt(S.d, 3)} × ${fmt(di, 3)} mm tube` };
}

  theory: String.raw`
    <div><p>A compressed beam with a small sideways deflection \(w(x)\) satisfies \(EI\,w'' + Pw = 0\) (Eq. 8.10). For pinned ends the only non-zero solutions need \(\sqrt{P/EI}\,L = n\pi\), so the lowest load is Euler’s</p>
      <div class="eq">\[ P_{cr} = \frac{\pi^2 EI}{(kL)^2} \]</div>
      <p class="eqn">Eq. 8.1, 8.13 – 8.14 · effective length factor k: pinned–pinned 1, fixed–pinned 0.699, fixed–fixed 0.5, fixed–free 2</p>
      <p>Other supports follow from the general solution \(w = C_1\sin Dx + C_2\cos Dx + C_3x + C_4\), \(D = \sqrt{P/EI}\) (Eq. 8.15 – 8.16). For fixed–pinned the determinant of the boundary conditions vanishes when \(DL = \tan DL\), giving \(P_{cr} = 20.19\,EI/L^2\) (Eq. 8.18 – 8.19).</p></div>
    <div><p>Buckling governs slender bars and yielding governs stocky ones. With the slenderness \(S = \sqrt{AL^2/I} = L/r\), the critical stress and the transition slenderness are</p>
      <div class="eq">\[ \sigma_{cr} = \frac{\pi^2 E}{k^2 S^2},\qquad S_{trans} = \frac{\pi}{k}\sqrt{\frac{E}{\sigma_y}} \]</div>
      <p class="eqn">Eq. 8.2 – 8.4 · near the transition, real columns fall below both curves; the dashed Johnson parabola is a common design fit there</p>
      <p>A column with an initial bow \(e_0\) bends from the start; for pinned ends the mid-length deflection grows as \(w = e_0/(1 - P/P_{cr})\), so the bending stress \(Pwc/I\) can yield it before \(P_{cr}\) is reached.</p></div>`,
  caseStudy: {
    title: 'the Hartford Civic Center roof (1978)',
    html: String.raw`
      <p>Early on January 18, 1978, a few hours after nearly 5,000 people had left a basketball game, the roof of the Hartford Civic Center Coliseum in Connecticut fell about 83 ft onto the empty seats. It had been carrying wet snow and ice from the largest storm in the arena’s five-year life. No one was killed.</p>
      <p>The roof was a steel space frame, 300 ft × 360 ft, on a 30 ft grid and held up by four pylons set 45 ft in from the edges. Its top-layer members (the top chords) carry compression, so they are columns. The investigation found that compression members in the top layer buckled. Once the first ones gave way, their load moved to neighbours that were already near their limit, and the whole roof came down progressively.</p>
      <p><b>Why they buckled, in this module’s terms.</b> The analysis assumed every top chord was braced sideways at mid-length, every 15 ft. As built, the exterior top chords had no mid-length braces, so their unbraced length was 30 ft. Doubling L divides \(P_{cr} = \pi^2EI/(kL)^2\) by four. The chords were cruciform sections made of four steel angles, which have a small radius of gyration \(r\), so \(L/r\) was already high. The analysis also treated the members as perfectly straight; the diagonals joined the top chords away from their nodes, which bent the chords from the start, and real bows grow as \(e_0/(1 - P/P_{cr})\). The dead load was also more than 20% higher than assumed (about 23 psf against 18 psf). During construction the roof sagged about twice as much as predicted, and that warning was not acted on.</p>

        <span><b>Dead load:</b> ≈ 23 psf actual, 18 psf assumed</span>

/* Stretch module: Bonding & Theoretical Strength. Pair potentials in eV and Å; moduli and strengths in GPa. */
const EV = 1.602176634e-19, ANG = 1e-10;
const POTENTIALS = {
  lj: { label: 'Lennard-Jones (van der Waals)',
    U: (r, P) => P.U0 * ((P.r0 / r) ** 12 - 2 * (P.r0 / r) ** 6) },
  morse: { label: 'Morse (metallic or covalent)',
    U: (r, P) => P.U0 * ((1 - Math.exp(-P.a * (r - P.r0))) ** 2 - 1) },
};
const BOND_PRESETS = {
  argon: { label: 'Weak van der Waals bond (argon-like)', pot: 'lj', U0: 0.0104, r0: 3.76, a: 1.5 },
  copper: { label: 'Metallic bond (copper-like)', pot: 'morse', U0: 0.343, r0: 2.87, a: 1.36 },
  covalent: { label: 'Strong covalent bond (carbon-like)', pot: 'morse', U0: 3.6, r0: 1.54, a: 1.2 },
};
/* Stiffness, peak force and their positions, found numerically so both potentials share one code path. */
function bondProps(P) {
  const U = r => POTENTIALS[P.pot].U(r, P), h = 1e-4 * P.r0;
  const F = r => -(U(r + h) - U(r - h)) / (2 * h);                     // eV/Å; F > 0 repulsive, F < 0 attractive
  const S0 = (U(P.r0 + h) - 2 * U(P.r0) + U(P.r0 - h)) / (h * h);      // eV/Å²
  let rmax = P.r0, Fmin = 0;                                           // most negative F: the largest pull the bond can resist
  for (let r = P.r0; r < 4 * P.r0; r += P.r0 / 4000) { const f = F(r); if (f < Fmin) { Fmin = f; rmax = r; } }
  const S0N = S0 * EV / (ANG * ANG), r0m = P.r0 * ANG, FmaxN = -Fmin * EV / ANG;
  const E = S0N / r0m / 1e9;                                           // GPa
  const sth = FmaxN / (r0m * r0m) / 1e9;                               // GPa
  const gamma = P.U0 * EV / (2 * r0m * r0m);                           // J/m²: one bond per r0² broken makes two surfaces
  return { U, F, S0, E, sth, rmax, Fmax: -Fmin, gamma, epsMax: rmax / P.r0 - 1 };
}

/* Stretch module: Cellular materials (foams and lattices). Gibson–Ashby scaling; moduli GPa, strengths MPa, density kg/m³. */
const CELL_TYPES = {
  open: { label: 'Open-cell foam (bending)', E: r => r * r, s: r => 0.3 * r ** 1.5, n: 2 },
  closed: { label: 'Closed-cell foam', E: (r, phi) => phi * phi * r * r + (1 - phi) * r, s: (r, phi) => 0.3 * (phi * r) ** 1.5 + 0.4 * (1 - phi) * r, n: null },
  lattice: { label: 'Stretch-dominated lattice (octet truss)', E: r => r / 3, s: r => r / 3, n: 1 },
};
function foamProps(S, m) {
  const r = S.rr, T = CELL_TYPES[S.type], phi = S.phi;
  const Er = T.E(r, phi), E = Er * m.E;
  // the plateau depends on how the cell walls fail: yield (metals, polymers), elastic buckling (elastomers), brittle crushing (ceramics, glass)
  let mode, sp;
  if (m.cls === 'Elastomer') { mode = 'elastic buckling'; sp = 0.05 * (S.type === 'lattice' ? r : r * r) * m.E * 1000; }
  else if (m.cls === 'Ceramic' || m.cls === 'Glass') { mode = 'brittle crushing'; sp = (S.type === 'lattice' ? r / 3 : 0.2 * r ** 1.5) * m.su; }
  else { mode = 'plastic collapse'; sp = T.s(r, phi) * m.sy; }
  const eD = Math.max(0.05, 1 - 1.4 * r);
  return { r, Er, E, sp, mode, eD, rho: r * m.rho, W: sp * eD };
}

defineModule({
  id: 'cellular',
  title: 'Cellular & Hierarchical Materials',
  eq: '',
  lede: 'Foams, honeycombs, wood and 3D-printed lattices are mostly empty space. Their stiffness and strength depend on how much solid there is and on whether the cell walls bend or stretch. Change the relative density and cell architecture and see where the foam lands among solid materials.',
  theory: String.raw`
    <div><p>A cellular solid is described by its relative density \(\rho^*/\rho_s\), the fraction of the volume that is solid. In an open-cell foam the cell edges <i>bend</i> under load; beam theory on a unit cell gives</p>
      <div class="eq">\[ \frac{E^*}{E_s} \approx \left(\frac{\rho^*}{\rho_s}\right)^2,\qquad \frac{\sigma_{pl}^*}{\sigma_{ys}} \approx 0.3\left(\frac{\rho^*}{\rho_s}\right)^{3/2} \]</div>
      <p>In a closed-cell foam a fraction \(\phi\) of the solid sits in the edges and the rest in thin faces that stretch, adding terms linear in \(\rho^*/\rho_s\). A lattice designed so that its struts carry only axial load (the octet truss) is <i>stretch</i>-dominated:</p>
      <div class="eq">\[ \frac{E^*}{E_s} \approx \frac{1}{3}\frac{\rho^*}{\rho_s},\qquad \frac{\sigma^*}{\sigma_{ys}} \approx \frac{1}{3}\frac{\rho^*}{\rho_s} \]</div>
      <p class="eqn">at 1% density, a stretch-dominated lattice is about 30 times stiffer than a bending-dominated foam of the same solid</p></div>
    <div><p>In compression a foam shows three stages: a linear elastic region, a long plateau at \(\sigma_{pl}^*\) as the cells collapse, and densification as the walls touch, near</p>
      <div class="eq">\[ \varepsilon_D \approx 1 - 1.4\,\frac{\rho^*}{\rho_s} \]</div>
      <p>The plateau absorbs a large energy per volume, \(W \approx \sigma_{pl}^*\varepsilon_D\), at a low, nearly constant stress, which is why foams are used in packaging and helmets. How the walls fail sets the plateau: plastic yielding in metals and polymers, elastic buckling in elastomers, brittle crushing in ceramics.</p></div>`,

  build(p) {
    p.group('Solid');
    p.material({ filter: m => m.rho > 0 && m.E > 0 && m.cls !== 'Composite' });
    p.group('Architecture');
    p.sel('type', { label: 'Cell type', value: 'open', options: Object.entries(CELL_TYPES).map(([k, v]) => [k, v.label]) });
    p.num('rr', { label: 'Relative density ρ*/ρs', min: 0.001, max: 0.5, step: 0.001, value: 0.05, log: true });
    p.num('phi', { label: 'Solid fraction in the edges φ', min: 0, max: 1, step: 0.01, value: 0.7, help: 'Closed cells only. φ = 1 behaves like an open-cell foam.' });

    const two = h('div', { class: 'two' });
    p.out.append(two);
    p.pS = p.panel('Scaling with relative density', '', two);
    p.pA = p.panel('Where the foam sits among solids', '', two);
    const two2 = h('div', { class: 'two' });
    p.out.append(two2);
    p.pC = p.panel('Compressive stress–strain (schematic)', '', two2);
    p.ro = p.panel('Foam properties', '', two2);
    const cc = p.panel('Concept checks');
    cc.append(
      h('p', { class: 'concept' }, h('b', null, 'Bending vs stretching. '), 'At ρ*/ρs = 0.01, compare an open-cell foam with an octet lattice of the same solid. Why does the slope on the log–log plot matter so much at low density?'),
      h('p', { class: 'concept' }, h('b', null, 'Filling the gaps. '), 'On the modulus–density chart, which empty region do foams of metals and polymers fill?'),
      h('p', { class: 'concept' }, h('b', null, 'Packaging. '), 'A good packaging foam should have a low plateau stress and a long plateau. Which relative density gives the most energy per volume before densification?'),
      h('p', { class: 'concept' }, h('b', null, 'Wood. '), 'Wood is a natural cellular solid with aligned cells. Why is it much stiffer along the grain than across it?'));
  },

  update(p) {
    const S = p.S, m = getMat(S.mat), F = foamProps(S, m);
    p.controls.phi.wrap.hidden = S.type !== 'closed';
    const rs = linspace(-3, Math.log10(0.6), 120).map(e => 10 ** e);
    Plot.render(p.pS, {
      h: 280, aria: 'Relative modulus versus relative density for three architectures',
      x: { label: 'Relative density ρ*/ρs', log: true, short: 'ρ' }, y: { label: 'Relative modulus E*/Es', log: true, short: 'E' },
      series: Object.entries(CELL_TYPES).map(([k, T], i) => ({ name: T.label, color: ['c4', 'c2', 'c3'][i], width: k === S.type ? 2.8 : 1.4, dash: k === S.type ? null : '5 4', data: rs.map(r => [r, Math.min(1, T.E(r, S.phi))]) })),
      marks: [{ t: 'pt', x: F.r, y: F.Er, r: 5.5, color: 'accent', label: 'this foam', top: true }],
      legend: 'br',
    });
    const mats = allMaterials().filter(q => q.rho > 0 && q.E > 0);
    const colors = { Metal: 'c1', Polymer: 'c3', Ceramic: 'c4', Glass: 'c5', Composite: 'c2', Elastomer: 'c6', Natural: 'c2' };
    const path = rs.map(r => { const G = foamProps(Object.assign({}, S, { rr: r }), m); return [G.rho, G.E]; });
    Plot.render(p.pA, {
      h: 280, aria: 'Modulus versus density with the library materials and this foam',
      x: { label: 'Density (kg/m³)', log: true, short: 'ρ', min: 1, max: 3e4 }, y: { label: 'Young’s modulus (GPa)', log: true, short: 'E', min: 1e-6, max: 1e3 },

      marks: [{ t: 'hline', y: F.sp, color: 'c2', label: 'plateau σpl*', anchor: 'start' }, { t: 'vline', x: F.eD, color: 'c4', label: 'εD' }],
      legend: false,
    });
    p.readouts(p.ro, [
      { k: 'Foam density ρ*', v: F.rho, u: 'kg/m³' },
      { k: 'Foam modulus E*', v: F.E * 1000, u: 'MPa' },
      { k: 'Relative modulus E*/Es', v: F.Er },
      { k: `Plateau stress (${F.mode})`, v: F.sp, u: 'MPa' },
      { k: 'Densification strain εD', v: F.eD },
      { k: 'Energy absorbed to εD', v: F.W, u: 'MJ/m³' },
      { k: 'Specific stiffness E*/ρ*', v: F.E * 1e9 / F.rho / 1e6, u: 'MJ/kg', title: 'Compare with the solid: ' + fmt(m.E * 1e9 / m.rho / 1e6, 3) + ' MJ/kg' },

  },
});

/* Stretch module: Flexure testing of brittle materials. Lengths mm, loads N, stresses MPa. */
/* Weibull effective volume of a rectangular beam in 3- or 4-point bending (inner span Li; Li = 0 is 3-point). */
const flexVeff = (V, m, L, Li) => V * (m * Li / L + 1) / (2 * (m + 1) ** 2);

defineModule({
  id: 'flexure',
  title: 'Flexure Testing of Brittle Materials',
  eq: '',
  lede: 'Ceramics and glasses are hard to grip in tension, so their strength is usually measured by bending a bar. Compare three- and four-point bending, see why the same material looks stronger in a smaller or more sharply loaded test, and use a short beam to measure interlaminar shear strength.',
  theory: String.raw`
    <div><p>A bar of width \(b\) and depth \(d\) on supports a span \(L\) apart breaks at load \(F\). In three-point bending the moment peaks under the single load; in four-point bending it is constant over the inner span \(L_i\):</p>
      <div class="eq">\[ \sigma_{3pt} = \frac{3FL}{2bd^2},\qquad \sigma_{4pt} = \frac{3F(L - L_i)}{2bd^2} \]</div>
      <p>Both come from \(\sigma = Mc/I\) with \(I = bd^3/12\). The shear stress in the outer spans, where the shear force is \(F/2\), peaks at the neutral axis at</p>
      <div class="eq">\[ \tau_{max} = \frac{3F}{4bd},\qquad \frac{\tau_{max}}{\sigma_{3pt}} = \frac{d}{2L} \]</div>
      <p class="eqn">a short, deep beam (small L/d) fails in shear between the layers of a laminate: the short-beam shear test</p></div>
    <div><p>Brittle strength is controlled by the largest flaw in the stressed volume, so it follows Weibull statistics with modulus \(m\). Only the highly stressed part of a bend bar counts; its effective volume is</p>
      <div class="eq">\[ V_{eff} = V\,\frac{m L_i/L + 1}{2(m+1)^2} \]</div>
      <p>and two tests on the same material give strengths in the ratio</p>
      <div class="eq">\[ \frac{\sigma_A}{\sigma_B} = \left(\frac{V_{eff,B}}{V_{eff,A}}\right)^{1/m} \]</div>
      <p class="eqn">a three-point test samples the least volume, so it reports the highest strength; uniform tension samples the most</p></div>`,

  build(p) {
    p.group('Test');
    p.seg('test', { label: 'Loading', value: 'four', options: [['three', '3-point'], ['four', '4-point']] });
    p.num('L', { label: 'Support span L', unit: 'mm', min: 5, max: 200, step: 0.5, value: 40 });
    p.num('Lr', { label: 'Inner span Li / L', min: 0.1, max: 0.8, step: 0.01, value: 0.5, help: 'Quarter-point loading is Li/L = 0.5.' });
    p.group('Bar');
    p.num('b', { label: 'Width b', unit: 'mm', min: 1, max: 50, step: 0.1, value: 4 });
    p.num('d', { label: 'Depth d', unit: 'mm', min: 0.5, max: 50, step: 0.1, value: 3 });
    p.num('F', { label: 'Failure load F', unit: 'N', min: 1, max: 20000, step: 1, value: 400, log: true });
    p.group('Material');
    p.num('m', { label: 'Weibull modulus m', min: 2, max: 40, step: 0.5, value: 10 });
    p.num('tauI', { label: 'Interlaminar shear strength', unit: 'MPa', min: 5, max: 200, step: 1, value: 60, help: 'For the short-beam plot: a laminate that can fail in shear.' });
    p.num('sigI', { label: 'Laminate flexural strength', unit: 'MPa', min: 50, max: 2000, step: 10, value: 900 });

    const two = h('div', { class: 'two' });
    p.out.append(two);
    p.schem = h('div', { class: 'schem' });
    p.panel('Test set-up and bending moment', '', two).append(p.schem);
    p.ro = p.panel('Results', '', two);
    const two2 = h('div', { class: 'two' });
    p.out.append(two2);
    p.pW = p.panel('Same material, different tests', '', two2);
    p.pB = p.panel('Short-beam test: bending or shear?', '', two2);
    const cc = p.panel('Concept checks');
    cc.append(
      h('p', { class: 'concept' }, h('b', null, 'Which test reads higher? '), 'With m = 10, how much stronger does the same ceramic look in three-point bending than in uniform tension? What happens as m grows?'),
      h('p', { class: 'concept' }, h('b', null, 'Why four-point? '), 'Standards for ceramics prefer four-point bending. Look at the moment diagram: what does a constant moment over the inner span give you?'),
      h('p', { class: 'concept' }, h('b', null, 'Short beams. '), 'Shorten the span until shear wins. Why must an interlaminar shear test use a small span-to-depth ratio, and a flexural test a large one?'),
      h('p', { class: 'concept' }, h('b', null, 'Design values. '), 'A designer needs the tensile strength of a large ceramic part. Why is the flexural strength from small bars not safe to use directly?'));
  },

  update(p) {
    const S = p.S, four = S.test === 'four', Li = four ? S.Lr * S.L : 0;
    p.controls.Lr.wrap.hidden = !four;
    const sig = 3 * S.F * (S.L - Li) / (2 * S.b * S.d * S.d), tau = 3 * S.F / (4 * S.b * S.d), M = S.F * (S.L - Li) / 4;
    const V = S.b * S.d * S.L, Ve = flexVeff(V, S.m, S.L, Li), Ve3 = flexVeff(V, S.m, S.L, 0), Ve4 = flexVeff(V, S.m, S.L, 0.5 * S.L);
    const sT = sig * (Ve / V) ** (1 / S.m);   // equivalent uniform-tension strength for the same bar volume
    // drawing: bar, supports, loads, and moment diagram
    { const W = Math.max(280, p.schem.clientWidth || 320), H = 230, s = Plot.s, C = { ink: cv('--ink'), mu: cv('--muted'), acc: cv('--accent'), gold: cv('--c2'), red: cv('--c4'), surf: cv('--surface'), s2: cv('--surface-2') };
      const svg = s('svg', { viewBox: `0 0 ${W} ${H}`, width: W, height: H, role: 'img', 'aria-label': 'Bend test set-up and bending moment diagram', 'font-family': 'IBM Plex Mono, Menlo, monospace' });
      s('rect', { x: 0, y: 0, width: W, height: H, fill: C.surf }, svg);
      const defs = s('defs', {}, svg), mk = s('marker', { id: 'flA', viewBox: '0 0 10 10', refX: 9, refY: 5, markerWidth: 6, markerHeight: 6, orient: 'auto' }, defs); s('path', { d: 'M0,0 L10,5 L0,10 z', fill: C.gold }, mk);
      const x0 = 30, x1 = W - 30, X = f => x0 + (x1 - x0) * f, by = 70, bh = Math.max(8, Math.min(26, 26 * S.d / 6));
      s('rect', { x: X(-0.06), y: by, width: X(1.06) - X(-0.06), height: bh, fill: C.s2, stroke: C.ink }, svg);
      for (const f of [0, 1]) s('path', { d: `M${X(f)},${by + bh} l-9,14 l18,0 z`, fill: C.surf, stroke: C.ink }, svg);
      const lp = four ? [0.5 - S.Lr / 2, 0.5 + S.Lr / 2] : [0.5];
      for (const f of lp) s('line', { x1: X(f), y1: by - 40, x2: X(f), y2: by - 3, stroke: C.gold, 'stroke-width': 2.5, 'marker-end': 'url(#flA)' }, svg);
      const t = (x, y, str, col = C.mu, anc = 'middle') => { const e = s('text', { x, y, 'text-anchor': anc, 'font-size': 11, fill: col }, svg); e.textContent = str; };
      t(X(0.5), by - 46, four ? `F/2 each` : 'F', C.gold);
      // moment diagram
      const my = 200, mh = 70, pts = [[0, 0]].concat(lp.map(f => [f, 1])).concat([[1, 0]]);
      s('path', { d: pts.map((q, i) => (i ? 'L' : 'M') + X(q[0]) + ',' + (my - mh * q[1])).join(' ') + ` L${X(1)},${my} L${X(0)},${my} Z`, fill: C.acc, 'fill-opacity': 0.15, stroke: C.acc, 'stroke-width': 2 }, svg);
      s('line', { x1: X(0), y1: my, x2: X(1), y2: my, stroke: C.mu }, svg);
      t(X(0.5), my - mh - 6, `Mmax = ${fmt(M, 3)} N·mm`, C.acc);
      t(X(0.5), H - 8, four ? 'constant moment over the inner span' : 'peak moment only under the load', C.mu);
      p.schem.replaceChildren(svg); }
    p.readouts(p.ro, [
      { k: four ? 'Flexural strength σ4pt' : 'Flexural strength σ3pt', v: sig, u: 'MPa' },
      { k: 'Max shear stress τ = 3F/4bd', v: tau, u: 'MPa' },
      { k: 'Span-to-depth ratio L/d', v: S.L / S.d },
      { k: 'Bar volume in the span', v: V, u: 'mm³' },
      { k: 'Effective volume Veff', v: Ve, u: 'mm³', title: 'Volume of a tensile bar that would have the same chance of failing' },
      { k: 'Veff / V', v: Ve / V },
      { k: 'Predicted uniform-tension strength', v: sT, u: 'MPa', title: 'Same material, tested in tension over the whole span volume' },
    ]);
    // strength reported by each test for the same material, relative to this test
    const tests = [['3-point', Ve3], ['4-point (Li = L/2)', Ve4], ['this test', Ve], ['tension, same volume', V], ['tension, 10× volume', 10 * V]];
    const rel = tests.map(([lab, v]) => [lab, sig * (Ve / v) ** (1 / S.m)]);
    Plot.render(p.pW, {
      h: 260, aria: 'Strength reported by different tests on the same material',
      x: { label: 'Effective volume (mm³)', log: true, short: 'V' }, y: { label: 'Strength it reports (MPa)', short: 'σ' },
      series: [{ name: `Weibull m = ${fmt(S.m, 3)}`, color: 'accent', width: 2, data: linspace(Math.log10(Ve3) - 0.5, Math.log10(10 * V) + 0.3, 60).map(e => [10 ** e, sig * (Ve / 10 ** e) ** (1 / S.m)]) }],
      marks: rel.map(([lab, sv], i) => ({ t: 'pt', x: tests[i][1], y: sv, r: 5, color: lab === 'this test' ? 'c4' : 'c3', label: lab, top: true, dy: i % 2 ? 14 : -8 })),
      legend: 'tr',
    });
    // short-beam: failure load for bending vs interlaminar shear as the span changes (3-point)
    const LdR = linspace(2, 40, 160), Fb = r => 2 * S.sigI * S.b * S.d / (3 * r), Fs = 4 * S.tauI * S.b * S.d / 3, cross = S.sigI / (2 * S.tauI);
    Plot.render(p.pB, {
      h: 260, aria: 'Failure load in bending and in interlaminar shear versus span to depth ratio',
      x: { label: 'Span-to-depth ratio L/d', short: 'L/d' }, y: { label: 'Failure load (N)', log: true, short: 'F' },
      series: [{ name: 'bending failure', color: 'c4', width: 2.4, data: LdR.map(r => [r, Fb(r)]) }, { name: 'interlaminar shear failure', color: 'c3', width: 2.4, data: LdR.map(r => [r, Fs]) }],
      marks: [{ t: 'vline', x: cross, color: 'c2', label: `L/d = ${fmt(cross, 3)}` }, { t: 'band', x0: 2, x1: cross, color: 'c3', opacity: 0.08 }],
      legend: 'tr',
    });

/* Stretch module: Composite elastic constants of a unidirectional lamina. Moduli GPa. Typical teaching values. */
const FIBERS = {
  carbon: { label: 'Carbon (standard modulus)', Ef: 230, Ef2: 15, Gf: 27, nuf: 0.2 },
  hm: { label: 'Carbon (high modulus)', Ef: 390, Ef2: 6, Gf: 20, nuf: 0.2 },
  glass: { label: 'E-glass', Ef: 72, Ef2: 72, Gf: 30, nuf: 0.22 },
  aramid: { label: 'Aramid', Ef: 125, Ef2: 5, Gf: 3, nuf: 0.35 },
};
const MATRICES = {
  epoxy: { label: 'Epoxy', Em: 3.5, num: 0.35 },
  polyester: { label: 'Polyester', Em: 3.0, num: 0.38 },
  peek: { label: 'PEEK', Em: 3.6, num: 0.4 },
};
/* Halpin–Tsai estimate for a transverse or shear property: P = Pm (1 + ξηVf) / (1 − ηVf). */
const halpinTsai = (Pf, Pm, Vf, xi) => { const eta = (Pf / Pm - 1) / (Pf / Pm + xi); return Pm * (1 + xi * eta * Vf) / (1 - eta * Vf); };
function laminaProps(S) {
  const Vf = S.Vf, Vm = 1 - Vf, Gm = S.Em / (2 * (1 + S.num));
  const E1 = S.Ef * Vf + S.Em * Vm, nu12 = S.nuf * Vf + S.num * Vm;
  const E2r = 1 / (Vf / S.Ef2 + Vm / S.Em), G12r = 1 / (Vf / S.Gf + Vm / Gm);
  const E2 = halpinTsai(S.Ef2, S.Em, Vf, S.xi), G12 = halpinTsai(S.Gf, Gm, Vf, 1);
  return { E1, nu12, E2r, G12r, E2, G12, Gm };
}
/* Modulus along a direction at θ from the fibres (in-plane stress transformation of the compliance). */
const offAxisE = (L, th) => { const c = Math.cos(th), s = Math.sin(th); return 1 / (c ** 4 / L.E1 + (1 / L.G12 - 2 * L.nu12 / L.E1) * s * s * c * c + s ** 4 / L.E2); };

/* Stretch module: Polycrystal elastic bounds from cubic single-crystal constants (GPa). Uses CUBIC and cubicCompliance. */
function vrhBounds(C11, C12, C44) {
  const K = (C11 + 2 * C12) / 3;                                        // the same for both bounds in a cubic crystal
  const GV = (C11 - C12 + 3 * C44) / 5, GR = 5 * (C11 - C12) * C44 / (4 * C44 + 3 * (C11 - C12));
  const E = (k, g) => 9 * k * g / (3 * k + g), nu = (k, g) => (3 * k - 2 * g) / (2 * (3 * k + g));
  const GH = (GV + GR) / 2;
  return { K, GV, GR, GH, EV: E(K, GV), ER: E(K, GR), EH: E(K, GH), nuH: nu(K, GH), A: 2 * C44 / (C11 - C12) };
}
/* Young's modulus of the single crystal along direction (l, m, n). */
const cubicEdir = (Sc, l, m, n) => 1 / (Sc.S11 - 2 * (Sc.S11 - Sc.S12 - Sc.S44 / 2) * (l * l * m * m + m * m * n * n + n * n * l * l));

    <div><p>If every grain had the same strain, the polycrystal stiffness would be the orientation average of the stiffness tensor (Voigt, an upper bound). If every grain had the same stress, it would be the average of the compliance (Reuss, a lower bound). For a cubic crystal the bulk modulus is the same in both:</p>

/* Stretch module: Linear viscoelasticity. Springs MPa, dashpots MPa·s, time s, frequency rad/s. */
/* Each model returns creep strain, relaxation stress and the complex modulus. SLS = spring E∞ in parallel with a Maxwell arm (E1, η). */
const VISCO = {
  maxwell: { label: 'Maxwell (spring + dashpot in series)',
    creep: (P, s0, t) => s0 / P.E1 + s0 * t / P.eta,
    relax: (P, e0, t) => P.E1 * e0 * Math.exp(-t * P.E1 / P.eta),
    dyn: (P, w) => { const wt = w * P.eta / P.E1; return [P.E1 * wt * wt / (1 + wt * wt), P.E1 * wt / (1 + wt * wt)]; } },
  kv: { label: 'Kelvin–Voigt (spring + dashpot in parallel)',
    creep: (P, s0, t) => s0 / P.E1 * (1 - Math.exp(-t * P.E1 / P.eta)),
    relax: (P, e0, t) => P.E1 * e0,                                           // after the (infinite) initial spike
    dyn: (P, w) => [P.E1, P.eta * w] },
  sls: { label: 'Standard linear solid (Zener)',
    creep: (P, s0, t) => { const E0 = P.Einf + P.E1, tc = P.eta / P.E1 * E0 / P.Einf; return s0 / P.Einf - s0 * (1 / P.Einf - 1 / E0) * Math.exp(-t / tc); },
    relax: (P, e0, t) => e0 * (P.Einf + P.E1 * Math.exp(-t * P.E1 / P.eta)),
    dyn: (P, w) => { const wt = w * P.eta / P.E1; return [P.Einf + P.E1 * wt * wt / (1 + wt * wt), P.E1 * wt / (1 + wt * wt)]; } },
};

defineModule({
  id: 'visco',
  title: 'Viscoelasticity',
  eq: '',
  lede: 'Polymers, tissue and asphalt are partly spring and partly fluid. Build a material from springs and dashpots, hold it at constant stress to watch it creep, at constant strain to watch it relax, and shake it to see how stiffness and damping change with frequency.',
  theory: String.raw`
    <div><p>A spring obeys \(\sigma = E\varepsilon\) and a dashpot \(\sigma = \eta\,\dot\varepsilon\). Their ratio sets a time scale \(\tau = \eta/E\). Combining them gives the classic models:</p>
      <ul>
        <li><b>Maxwell</b> (series): relaxes fully, \(\sigma(t) = E\varepsilon_0 e^{-t/\tau}\), but creeps without limit: \(\varepsilon(t) = \sigma_0/E + \sigma_0 t/\eta\). A fluid at long times.</li>
        <li><b>Kelvin–Voigt</b> (parallel): creeps to a limit, \(\varepsilon(t) = \tfrac{\sigma_0}{E}(1 - e^{-t/\tau})\), but cannot relax.</li>
        <li><b>Standard linear solid</b>: a spring \(E_\infty\) in parallel with a Maxwell arm \((E_1, \eta)\). It does both, from the instantaneous modulus \(E_0 = E_\infty + E_1\) to the relaxed modulus \(E_\infty\).</li>
      </ul>
      <div class="eq">\[ \sigma_{SLS}(t) = \varepsilon_0\left(E_\infty + E_1e^{-t/\tau}\right),\qquad \tau = \frac{\eta}{E_1} \]</div></div>
    <div><p>Under a sinusoidal strain \(\varepsilon = \varepsilon_0\sin\omega t\) the stress leads by a phase angle \(\delta\). The part in phase is the storage modulus \(E'\) (stored and returned), the part out of phase the loss modulus \(E''\) (dissipated as heat):</p>
      <div class="eq">\[ E'_{SLS} = E_\infty + E_1\frac{\omega^2\tau^2}{1 + \omega^2\tau^2},\qquad E''_{SLS} = E_1\frac{\omega\tau}{1 + \omega^2\tau^2},\qquad \tan\delta = \frac{E''}{E'} \]</div>
      <p>The energy lost per cycle is the area of the stress–strain loop, \(\pi E''\varepsilon_0^2\). Damping peaks near \(\omega\tau \approx 1\): this is why a rubber ball bounces differently when it is cold, and why polymers are used to damp vibration.</p></div>`,
