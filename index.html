/* Module: Strain Gauge Rosette (Notes 3.2.3 and App. A, Eq. A2.1–A2.9)
   Three gauges at angles θA, θB, θC (counterclockwise from gauge A = x) each read ε(θ) = εx cos²θ + εy sin²θ + γxy sinθ cosθ.
   Three readings give three equations for εx, εy, γxy. */

const ROSETTES = { rect: [0, 45, 90], delta: [0, 120, 240] };
const ROSETTE_PRESETS = {
  uni: { label: 'Steel bar, 100 MPa tension along A', type: 'rect', eA: 500, eB: 177.5, eC: -145, mat: 'st4130' },
  shaft: { label: 'Shaft in torsion, A along the axis', type: 'rect', eA: 0, eB: 500, eC: 0 },
  general: { label: 'General state', type: 'rect', eA: 600, eB: 600, eC: -200 },
  deltaEx: { label: 'Delta rosette example', type: 'delta', eA: 400, eB: -150, eC: 250 },
};

function rosetteSolve(angs, eps) {
  const rows = angs.map(a => { const t = a * Math.PI / 180, c = Math.cos(t), s = Math.sin(t); return [c * c, s * s, s * c]; });
  const det3 = m => m[0][0] * (m[1][1] * m[2][2] - m[1][2] * m[2][1]) - m[0][1] * (m[1][0] * m[2][2] - m[1][2] * m[2][0]) + m[0][2] * (m[1][0] * m[2][1] - m[1][1] * m[2][0]);
  const D = det3(rows);
  if (Math.abs(D) < 1e-9) return null;                      // gauges too close together (or 180° apart)
  const col = (k) => rows.map((r, i) => r.map((v, j) => j === k ? eps[i] : v));
  const out = { ex: det3(col(0)) / D, ey: det3(col(1)) / D, g: det3(col(2)) / D };
  const tol = 1e-9 * Math.max(...eps.map(Math.abs), 1e-12);      // clear round-off so exact cases read exactly
  for (const k in out) if (Math.abs(out[k]) < tol) out[k] = 0;
  return out;
}

/* Quarter Wheatstone bridge with equal arms (Eq. A2.2): exact output and the linear approximation, in volts. */
const bridgeOut = (eps, GF, V) => { const x = GF * eps * 1e-6; return { dRR: x, exact: V * x / (2 * (2 + x)), lin: V * x / 4 }; };
const bridgeToStrain = (vG, GF, V) => { const v = vG / V; return 4 * v / (1 - 2 * v) / GF * 1e6; };

function drawRosette(el, angs, eps, M, mat) {
  const W = Math.max(280, el.clientWidth || 500), H = 340, s = Plot.s;
  const C = { ink: cv('--ink'), muted: cv('--muted'), acc: cv('--accent'), surf: cv('--surface'), foil: cv('--c2'), base: cv('--surface-2'), g: cv('--c5'), p1: cv('--c4'), p2: cv('--c3') };
  const svg = s('svg', { viewBox: `0 0 ${W} ${H}`, width: W, height: H, role: 'img', 'aria-label': 'Strain gauge rosette with principal directions', 'font-family': 'IBM Plex Mono, Menlo, monospace' });
  s('rect', { x: 0, y: 0, width: W, height: H, fill: C.surf }, svg);
  const defs = s('defs', {}, svg);
  for (const [id, col] of [['rsA', C.p1], ['rsB', C.p2]]) { const m = s('marker', { id, viewBox: '0 0 10 10', refX: 9, refY: 5, markerWidth: 6, markerHeight: 6, orient: 'auto-start-reverse' }, defs); s('path', { d: 'M0,0 L10,5 L0,10 z', fill: col }, m); }
  const cx = W / 2, cy = H / 2, Rb = Math.min(W / 2 - 80, H / 2 - 58);
  const P = (r, a) => [cx + r * Math.cos(a), cy - r * Math.sin(a)];
  s('circle', { cx, cy, r: Rb, fill: C.base, stroke: C.muted, 'stroke-width': 1 }, svg);
  // principal directions
  if (!M.hydro) {
    for (const [ang, col, id, lab] of [[M.thp, C.p1, 'rsA', 'ε1'], [M.thp + 90, C.p2, 'rsB', 'ε2']]) {
      const a = ang * Math.PI / 180, r = Rb + 18, p0 = P(-r, a), p1 = P(r, a);
      s('line', { x1: p0[0].toFixed(1), y1: p0[1].toFixed(1), x2: p1[0].toFixed(1), y2: p1[1].toFixed(1), stroke: col, 'stroke-width': 1.6, 'stroke-dasharray': '6 4', 'marker-start': `url(#${id})`, 'marker-end': `url(#${id})` }, svg);
      const l = P(Rb * 0.9, a), off = [-Math.sin(a) * 12, -Math.cos(a) * 12];   // inside the base, nudged off the line
      const t = s('text', { x: (l[0] + off[0]).toFixed(1), y: (l[1] + off[1] + 4).toFixed(1), 'text-anchor': 'middle', 'font-size': 12, fill: col, 'font-weight': 600 }, svg); t.textContent = lab;
    }
  }
  // gauges: serpentine foil grids radiating from the centre
  ['A', 'B', 'C'].forEach((lab, i) => {
    const a = angs[i] * Math.PI / 180, u = [Math.cos(a), -Math.sin(a)], v = [Math.sin(a), Math.cos(a)];   // screen axes along/across the gauge
    const r0 = Rb * 0.22, r1 = Rb * 0.78, wdt = Rb * 0.16, n = 7;
    let d = '';
    for (let j = 0; j < n; j++) {
      const off = -wdt / 2 + wdt * j / (n - 1);
      const a0 = [cx + u[0] * r0 + v[0] * off, cy + u[1] * r0 + v[1] * off], a1 = [cx + u[0] * r1 + v[0] * off, cy + u[1] * r1 + v[1] * off];
      d += (j ? 'L' : 'M') + (j % 2 ? a1 : a0).map(q => q.toFixed(1)).join(',') + 'L' + (j % 2 ? a0 : a1).map(q => q.toFixed(1)).join(',');
    }
    s('path', { d, fill: 'none', stroke: C.foil, 'stroke-width': 1.4, 'stroke-linejoin': 'round' }, svg);
    const l = P(Rb + 30, a);
    const t = s('text', { x: l[0].toFixed(1), y: (l[1] - 2).toFixed(1), 'text-anchor': 'middle', 'font-size': 12.5, fill: C.ink, 'font-weight': 600 }, svg); t.textContent = `${lab} ${fmt(angs[i], 3)}°`;
    const t2 = s('text', { x: l[0].toFixed(1), y: (l[1] + 12).toFixed(1), 'text-anchor': 'middle', 'font-size': 11, fill: C.g }, svg); t2.textContent = `${fmt(eps[i], 4)} µε`;
  });
  el.replaceChildren(svg);
}

defineModule({
  id: 'rosette',
  title: 'Strain Gauge Rosette',
  eq: 'Eq. 3.22, A2.1–A2.9',
  lede: 'Three strain gauges at known angles pin down the full in-plane strain state. Enter gauge readings, or the bridge voltages from the lab, and get the principal strains, their directions and the stresses that caused them.',
  theory: String.raw`
    <div><p>A gauge changes resistance in proportion to the strain along its grid (gauge factor \(GF\), typically about 2). In a quarter Wheatstone bridge with equal arms the small change is read as a voltage:</p>
      <div class="eq">\[ GF = \frac{\Delta R}{\varepsilon R_o}, \qquad V_G = \Big(\frac{R_2}{R_1+R_2} - \frac{R_x}{R_x+R_3}\Big)V_{app} \approx \frac{V_{app}}{4}\frac{\Delta R}{R} \]</div>
      <p class="eqn">Eq. A2.1 – A2.2 · the exact output is \(V_{app}\,x/[2(2+x)]\) with \(x = \Delta R/R\), slightly below the linear estimate</p>
      <p>Each gauge at angle \(\theta_i\) reads the rotated strain (Eq. 3.22): \(\varepsilon_i = \varepsilon_x\cos^2\theta_i + \varepsilon_y\sin^2\theta_i + \gamma_{xy}\sin\theta_i\cos\theta_i\). Three gauges give three equations for \(\varepsilon_x, \varepsilon_y, \gamma_{xy}\).</p></div>
    <div><p>For a 0–45–90 rosette this solves directly to the centre and radius of Mohr’s strain circle:</p>
      <div class="eq">\[ C = \frac{\varepsilon_A + \varepsilon_C}{2}, \qquad R = \sqrt{\tfrac12(\varepsilon_A-\varepsilon_B)^2 + \tfrac12(\varepsilon_B-\varepsilon_C)^2} \]</div>
      <div class="eq">\[ \varepsilon_{1,2} = C \pm R, \qquad \phi = \tfrac12\tan^{-1}\!\Big(\frac{\varepsilon_A - 2\varepsilon_B + \varepsilon_C}{\varepsilon_A - \varepsilon_C}\Big) \]</div>
      <p class="eqn">Eq. A2.3 – A2.9 · \(\phi\) is measured from the principal axis to gauge A, so \(\theta_p = -\phi\) measured from A</p>
      <p>With the principal strains known, plane-stress Hooke’s law gives the stresses: \(\sigma_1 = \frac{E}{1-\nu^2}(\varepsilon_1 + \nu\varepsilon_2)\), \(\sigma_2 = \frac{E}{1-\nu^2}(\varepsilon_2 + \nu\varepsilon_1)\) (Sec. 3.3.2).</p></div>`,

  build(p) {
    p.group('Rosette');
    p.sel('preset', {
      label: 'Example', value: 'general', options: [['custom', 'Custom']].concat(Object.entries(ROSETTE_PRESETS).map(([k, v]) => [k, v.label])),
      onset: v => { const pr = ROSETTE_PRESETS[v]; if (!pr) return; if (!p.locked.has('type')) p.controls.type.set(pr.type); if (!p.locked.has('input')) p.controls.input.set('strain'); for (const k of ['eA', 'eB', 'eC']) if (!p.locked.has(k)) p.controls[k].set(pr[k]); if (pr.mat && !p.locked.has('mat')) { p.controls.mat.set(pr.mat); App.setMaterial(pr.mat); } },
    });
    p.seg('type', { label: 'Type', value: 'rect', options: [['rect', '0–45–90'], ['delta', '0–120–240'], ['custom', 'Custom']] });
    p.num('aB', { label: 'Angle of gauge B', unit: 'deg', min: 1, max: 179, step: 1, value: 60 });
    p.num('aC', { label: 'Angle of gauge C', unit: 'deg', min: 1, max: 179, step: 1, value: 120 });
    p.group('Readings');
    p.seg('input', { label: 'Enter', value: 'strain', options: [['strain', 'Strains (µε)'], ['bridge', 'Bridge voltages (mV)']] });
    p.num('eA', { label: 'εA', unit: 'µε', min: -3000, max: 3000, step: 0.5, value: 600 });
    p.num('eB', { label: 'εB', unit: 'µε', min: -3000, max: 3000, step: 0.5, value: 600 });
    p.num('eC', { label: 'εC', unit: 'µε', min: -3000, max: 3000, step: 0.5, value: -200 });
    p.num('vA', { label: 'VG, gauge A', unit: 'mV', min: -10, max: 10, step: 0.001, value: 1.5 });
    p.num('vB', { label: 'VG, gauge B', unit: 'mV', min: -10, max: 10, step: 0.001, value: 1.5 });
    p.num('vC', { label: 'VG, gauge C', unit: 'mV', min: -10, max: 10, step: 0.001, value: -0.5 });
    p.group('Wheatstone bridge (App. A)');
    p.num('GF', { label: 'Gauge factor GF', min: 1, max: 6, step: 0.01, value: 2.1 });
    p.num('V', { label: 'Excitation voltage Vapp', unit: 'V', min: 0.5, max: 15, step: 0.1, value: 5 });
    p.num('R0', { label: 'Gauge resistance Ro', unit: 'Ω', min: 60, max: 1000, step: 1, value: 350 });
    p.group('Material (for stresses)');
    p.material({ help: 'Plane stress, linear elastic: valid while the stresses stay below yield.' });

    const top = h('div', { class: 'two' });
    p.out.append(top);
    p.schem = p.panel('Rosette and principal directions', 'App. A, Fig. A2', top);
    p.ro = p.panel('Results', 'Eq. A2.3–A2.9', top);
    const two = h('div', { class: 'two' });
    p.out.append(two);
    p.pC = p.panel("Mohr's strain circle with the gauges", 'Fig. A2', two);
    p.pA = p.panel('Strain vs gauge angle', 'Eq. 3.22', two);
    p.steps = p.panel('Worked solution', 'Eq. A2.3–A2.9');
    p.br = p.panel('Bridge signals', 'Eq. A2.1–A2.2');
    const cc = p.panel('Concept checks');
    cc.append(
      h('p', { class: 'concept' }, h('b', null, 'Why three gauges? '), 'A 2D strain state has three unknowns (εx, εy, γxy). Choose Custom and set gauges B and C to the same angle. What happens to the solution, and why?'),
      h('p', { class: 'concept' }, h('b', null, 'Uniaxial check. '), 'Load the steel-bar example (it selects 4130 steel, E = 200 GPa, ν = 0.29). The principal strains should be ε1 = σ/E and ε2 = −νσ/E. Does σ1 come back as 100 MPa, and σ2 as zero?'),
      h('p', { class: 'concept' }, h('b', null, 'Bridge sensitivity. '), 'A 500 µε reading gives only about a millivolt. How would a half or full bridge (two or four active gauges) change that?'));
  },

  update(p) {
    const S = p.S, mat = getMat(S.mat);
    const angs = S.type === 'custom' ? [0, S.aB, S.aC] : ROSETTES[S.type];
    const isBridge = S.input === 'bridge';
    p.controls.aB.wrap.hidden = p.controls.aC.wrap.hidden = S.type !== 'custom';
    for (const k of ['eA', 'eB', 'eC']) p.controls[k].wrap.hidden = isBridge;
    for (const k of ['vA', 'vB', 'vC']) p.controls[k].wrap.hidden = !isBridge;
    const eps = isBridge ? [S.vA, S.vB, S.vC].map(v => bridgeToStrain(v * 1e-3, S.GF, S.V)) : [S.eA, S.eB, S.eC];
    if (!isBridge) {
      const match = Object.entries(ROSETTE_PRESETS).find(([, v]) => v.type === S.type && v.eA === S.eA && v.eB === S.eB && v.eC === S.eC);
      if (S.preset !== (match ? match[0] : 'custom')) p.controls.preset.set(match ? match[0] : 'custom');
    } else if (S.preset !== 'custom') p.controls.preset.set('custom');

    const sol = rosetteSolve(angs, eps);
    if (!sol) {
      p.readouts(p.ro, [{ k: 'Cannot solve', v: 'gauges are parallel', cls: 'bad' }]);
      p.schem.replaceChildren(h('p', { class: 'note' }, 'Two of the gauges point along the same line (0° and 180° are the same direction), so they measure the same strain. Spread the angles out.'));
      for (const el of [p.pC, p.pA, p.steps, p.br]) el.replaceChildren();
      return;
    }
    const exy = sol.g / 2, M = mohrSolve(sol.ex, sol.ey, exy, 0);
    const Ep = mat.E * 1000, nu = mat.nu, k = Ep / (1 - nu * nu) * 1e-6;     // MPa per µε
    const big = k * Math.max(Math.abs(M.s1), Math.abs(M.s2), 1e-12), z = v => Math.abs(v) < 1e-9 * big ? 0 : v;
    const s1 = z(k * (M.s1 + nu * M.s2)), s2 = z(k * (M.s2 + nu * M.s1));
    const sx = z(k * (sol.ex + nu * sol.ey)), sy = z(k * (sol.ey + nu * sol.ex)), txy = z(Ep / (2 * (1 + nu)) * sol.g * 1e-6);
    const ez = -nu / (1 - nu) * (M.s1 + M.s2);
    const ylim = mat.sy;
    const vm = Math.sqrt(s1 * s1 - s1 * s2 + s2 * s2);

    drawRosette(p.schem, angs, eps, M, mat);
    p.readouts(p.ro, [
      { k: 'εx (gauge A)', v: sol.ex, u: 'µε' },
      { k: 'εy', v: sol.ey, u: 'µε' },
      { k: 'γxy', v: sol.g, u: 'µε' },
      { k: 'ε1', v: M.s1, u: 'µε', eq: 'A2.8' },
      { k: 'ε2', v: M.s2, u: 'µε', eq: 'A2.8' },
      { k: 'θp, A to ε1', v: M.hydro ? 'any' : fmt(M.thp, 4), u: M.hydro ? '' : '°' },
      { k: 'γmax', v: 2 * M.R, u: 'µε' },
      { k: 'εz (plane stress)', v: ez, u: 'µε', title: 'εz = −ν/(1−ν)(ε1 + ε2)' },
      { k: 'σ1', v: s1, u: 'MPa' },
      { k: 'σ2', v: s2, u: 'MPa' },
      { k: 'τmax in-plane', v: (s1 - s2) / 2, u: 'MPa' },
      { k: 'Elastic check', v: vm < ylim ? 'below yield' : 'above yield', cls: vm < ylim ? 'ok' : 'bad', title: `von Mises ${fmt(vm, 3)} MPa vs σy ${fmt(ylim, 3)} MPa of ${mat.name} (Ch. 4)` },
    ]);
    const gauges = angs.map((a, i) => ({ lab: 'ABC'[i], ang: a }));
    mohrCirclePlot(p.pC, { x: sol.ex, y: sol.ey, xy: exy, th: 0, M, down: true, gauges, ...MOHR_STRAIN });
    mohrAnglePlot(p.pA, { x: sol.ex, y: sol.ey, xy: exy, M, gauges, ...MOHR_STRAIN });

    // worked solution
    const [eA, eB, eC] = eps, f = v => fmt(v, 4);
    const rows = [];
    if (S.type === 'rect') {
      const C0 = (eA + eC) / 2, R0 = Math.sqrt(0.5 * (eA - eB) ** 2 + 0.5 * (eB - eC) ** 2);
      const den = eA - eC, phi = den !== 0 ? 0.5 * Math.atan((eA - 2 * eB + eC) / den) * 180 / Math.PI : 45 * Math.sign(eA - 2 * eB + eC || 1);
      const atPhi = mohrSolve(sol.ex, sol.ey, exy, -phi).sxp;
      const toE1 = Math.abs(atPhi - M.s1) <= Math.abs(atPhi - M.s2);
      rows.push(
        `C = (εA + εC)/2 = (${f(eA)}${signTerm(eC, '')})/2 = ${f(C0)} µε   (A2.3)`,
        `R = √[½(εA − εB)² + ½(εB − εC)²] = √[½(${f(eA - eB)})² + ½(${f(eB - eC)})²] = ${f(R0)} µε   (A2.4)`,
        `ε1,2 = C ± R = ${f(C0 + R0)}, ${f(C0 - R0)} µε   (A2.8)`,
        `φ = ½ atan[(εA − 2εB + εC)/(εA − εC)] = ½ atan[${f(eA - 2 * eB + eC)}/${f(den)}] = ${f(phi)}°   (A2.9)`,
        `atan only returns −90° to 90°, so check which axis φ refers to: rotating −φ from gauge A reads ${f(atPhi)} µε, which is ${toE1 ? 'ε1' : 'ε2'}.` + (toE1 ? ` So ε1 is at θp = ${f(-phi)}° from A.` : ` So ε1 is 90° away, at θp = ${f(wrap90(-phi + 90))}° from A.`));
    } else if (S.type === 'delta') {
      const C0 = (eA + eB + eC) / 3, R0 = Math.sqrt((eA - C0) ** 2 + (eC - eB) ** 2 / 3);
      rows.push(
        `C = (εA + εB + εC)/3 = ${f(C0)} µε`,
        `R = √[(εA − C)² + (εC − εB)²/3] = ${f(R0)} µε`,
        `ε1,2 = C ± R = ${f(C0 + R0)}, ${f(C0 - R0)} µε`,
        `θp = ½ atan2[√3(εC − εB), 2εA − εB − εC] = ${f(M.thp)}° from gauge A`,
        'The notes give the 0–45–90 form (A2.3–A2.9). The delta formulas follow from the same three equations with θ = 0°, 120°, 240°.');
    } else {
      rows.push('Custom angles: the three gauge equations are solved together (Cramer’s rule), then Mohr’s circle gives the principal strains.',
        `εx = ${f(sol.ex)}, εy = ${f(sol.ey)}, γxy = ${f(sol.g)} µε → C = ${f(M.C)}, R = ${f(M.R)}, ε1,2 = ${f(M.s1)}, ${f(M.s2)} µε, θp = ${f(M.thp)}°`);
    }
    rows.push(`Hooke (plane stress): σ1 = E/(1−ν²)(ε1 + νε2) = ${f(s1)} MPa, σ2 = ${f(s2)} MPa with E = ${fmt(mat.E, 3)} GPa, ν = ${fmt(nu, 2)} (${mat.name})`,
      `On the gauge axes: σx = ${f(sx)}, σy = ${f(sy)}, τxy = Gγxy = ${f(txy)} MPa`);
    p.steps.replaceChildren(...rows.map(r => h('div', { class: 'mrow' }, r)));

    // bridge table
    p.br.replaceChildren(h('div', { class: 'tscroll' }, h('table', { class: 't' },
      h('thead', null, h('tr', null, ['Gauge', 'ε (µε)', 'ΔR (mΩ)', 'ΔR/R', 'VG exact (mV)', 'VG ≈ V/4·ΔR/R (mV)', 'Linear error'].map((x, i) => h('th', { class: i ? 'num' : null, style: { textTransform: 'none', letterSpacing: '0' } }, x)))),
      h('tbody', null, eps.map((e, i) => {
        const b = bridgeOut(e, S.GF, S.V);
        const err = b.exact !== 0 ? (b.lin - b.exact) / Math.abs(b.exact) * 100 : 0;
        return h('tr', null, h('td', null, 'ABC'[i]), h('td', { class: 'num' }, fmt(e, 4)), h('td', { class: 'num' }, fmt(b.dRR * S.R0 * 1000, 4)),
          h('td', { class: 'num' }, fmt(b.dRR, 3)), h('td', { class: 'num' }, fmt(b.exact * 1000, 4)), h('td', { class: 'num' }, fmt(b.lin * 1000, 4)), h('td', { class: 'num' }, fmt(err, 2) + ' %'));
      })))),
      h('p', { class: 'note' }, `Quarter bridge with equal arms. ${isBridge ? 'Strains above were converted from your voltages with the exact bridge equation.' : 'Switch “Enter” to bridge voltages to type in the lab readings directly.'}`));
  },
});

/* Module: Hooke's Law, Plane Stress & Plane Strain (Notes 3.3.1–3.3.3, Eq. 3.25–3.44)
   Voigt order from the notes (Eq. 3.37–3.38): 1 = xx, 2 = yy, 3 = zz, 4 = yz, 5 = xz, 6 = xy; shear strains are engineering γ. */

const HK_KEYS = ['sx', 'sy', 'sz', 'tyz', 'txz', 'txy', 'ex', 'ey', 'ez', 'gyz', 'gxz', 'gxy'];
const HOOKE_PRESETS = {
  uniS: { label: 'Uniaxial stress (3.3.3)', mode: 'stress', cond: '3d', sx: 100 },
  uniE: { label: 'Uniaxial strain (3.3.3)', mode: 'strain', cond: '3d', ex: 1000 },
  biax: { label: 'Equal biaxial stress (3.3.3)', mode: 'stress', cond: '3d', sx: 100, sy: 100 },
  hydro: { label: 'Hydrostatic pressure, 100 MPa', mode: 'stress', cond: '3d', sx: -100, sy: -100, sz: -100 },
  shear: { label: 'Pure shear', mode: 'stress', cond: '3d', txy: 50 },
  plate: { label: 'Thin plate (plane stress)', mode: 'stress', cond: 'pstress', sx: 100, sy: 40, txy: 20 },
  thick: { label: 'Thick body (plane strain)', mode: 'strain', cond: 'pstrain', ex: 500, ey: -100 },
};
const hookePreset = k => Object.assign({ mode: 'stress', cond: '3d' }, Object.fromEntries(HK_KEYS.map(x => [x, 0])), HOOKE_PRESETS[k]);

function isoConstants(E, nu) {          // E in MPa
  const G = E / (2 * (1 + nu)), lam = E * nu / ((1 + nu) * (1 - 2 * nu)), K = E / (3 * (1 - 2 * nu));
  return { E, nu, G, lam, K, M: lam + 2 * G };
}
/* Full 6-vectors of stress (MPa) and strain (µε, engineering shear) for the chosen mode and condition. */
function hookeSolve(S, c) {
  const { E, nu, G, lam } = c, Z = HK_KEYS.reduce((o, k) => (o[k] = S[k] || 0, o), {});
  const strainFrom = s => {         // ε = S σ (Eq. 3.25–3.30), σ in MPa → µε
    const [s1, s2, s3, s4, s5, s6] = s;
    return [(s1 - nu * (s2 + s3)) / E, (s2 - nu * (s1 + s3)) / E, (s3 - nu * (s1 + s2)) / E, s4 / G, s5 / G, s6 / G].map(v => v * 1e6);
  };
  const stressFrom = e => {         // σ = C ε (Eq. 3.31–3.36), µε → MPa
    const [e1, e2, e3, e4, e5, e6] = e.map(v => v * 1e-6), tr = e1 + e2 + e3;
    return [2 * G * e1 + lam * tr, 2 * G * e2 + lam * tr, 2 * G * e3 + lam * tr, G * e4, G * e5, G * e6];
  };
  let sig, eps;
  if (S.mode === 'stress') {
    sig = S.cond === '3d' ? [Z.sx, Z.sy, Z.sz, Z.tyz, Z.txz, Z.txy]
      : S.cond === 'pstress' ? [Z.sx, Z.sy, 0, 0, 0, Z.txy]
        : [Z.sx, Z.sy, nu * (Z.sx + Z.sy), 0, 0, Z.txy];          // plane strain: εz = 0 needs σz = ν(σx + σy)
    eps = strainFrom(sig);
  } else {
    eps = S.cond === '3d' ? [Z.ex, Z.ey, Z.ez, Z.gyz, Z.gxz, Z.gxy]
      : S.cond === 'pstress' ? [Z.ex, Z.ey, -nu / (1 - nu) * (Z.ex + Z.ey), 0, 0, Z.gxy]   // σz = 0 sets εz
        : [Z.ex, Z.ey, 0, 0, 0, Z.gxy];
    sig = stressFrom(eps);
  }
  const big = Math.max(...sig.map(Math.abs), 1e-12), bigE = Math.max(...eps.map(Math.abs), 1e-12);
  sig = sig.map(v => Math.abs(v) < 1e-9 * big ? 0 : v); eps = eps.map(v => Math.abs(v) < 1e-9 * bigE ? 0 : v);
  return { sig, eps };
}

function drawPlateViews(el, R, cond) {
  const W = Math.max(300, el.clientWidth || 600), s = Plot.s, H = 250;
  const C = { ink: cv('--ink'), muted: cv('--muted'), acc: cv('--accent'), surf: cv('--surface'), fill: cv('--accent-soft'), gold: cv('--c2'), red: cv('--c4') };
  const svg = s('svg', { viewBox: `0 0 ${W} ${H}`, width: W, height: H, role: 'img', 'aria-label': 'Deformed block seen from the front and from the edge', 'font-family': 'IBM Plex Mono, Menlo, monospace' });
  s('rect', { x: 0, y: 0, width: W, height: H, fill: C.surf }, svg);
  const [e1, e2, e3, e4, e5, e6] = R.eps, emax = Math.max(...R.eps.map(Math.abs));
  const k = emax > 0 ? 0.14 / (emax * 1e-6) : 0;
  const view = (cx, cy, w, hgt, exx, eyy, gxy, title, xl, yl) => {
    const P = (x, y) => [cx + x, cy - y];
    const E = [[exx * 1e-6 * k, gxy / 2 * 1e-6 * k], [gxy / 2 * 1e-6 * k, eyy * 1e-6 * k]];
    const cs = [[w, hgt], [-w, hgt], [-w, -hgt], [w, -hgt]];
    const path = pts => 'M' + pts.map(([x, y]) => P(x, y).map(v => v.toFixed(1)).join(',')).join('L') + 'Z';
    s('path', { d: path(cs.map(([x, y]) => [x + E[0][0] * x + E[0][1] * y, y + E[1][0] * x + E[1][1] * y])), fill: C.fill, stroke: C.acc, 'stroke-width': 2 }, svg);
    s('path', { d: path(cs), fill: 'none', stroke: C.muted, 'stroke-dasharray': '4 3', 'stroke-width': 1.2 }, svg);
    const t = s('text', { x: cx, y: 18, 'text-anchor': 'middle', 'font-size': 12.5, 'font-weight': 600, fill: C.ink, 'font-family': 'IBM Plex Sans, Segoe UI, Arial, sans-serif' }, svg); t.textContent = title;
    const a = s('text', { x: cx + w + 16, y: cy + 4, 'font-size': 11, fill: C.muted }, svg); a.textContent = xl;
    const b = s('text', { x: cx, y: cy - hgt - 14, 'text-anchor': 'middle', 'font-size': 11, fill: C.muted }, svg); b.textContent = yl;
  };
  const half = Math.min(W / 5, 85);
  view(W * 0.27, 130, half, half, e1, e2, e6, 'Front face (x–y)', 'x', 'y');
  view(W * 0.73, 130, half, half * 0.3, e1, e3, e5, 'Edge (x–z), thickness exaggerated', 'x', 'z');
  const n1 = s('text', { x: W * 0.73, y: 130 + half * 0.3 + 38, 'text-anchor': 'middle', 'font-size': 11.5, fill: cond === 'pstrain' ? C.red : C.acc }, svg);
  n1.textContent = cond === 'pstrain' ? `εz held at 0 → σz = ${fmt(R.sig[2], 4)} MPa` : `εz = ${fmt(e3, 4)} µε${cond === 'pstress' ? ' (free to thin)' : ''}`;
  const n2 = s('text', { x: W / 2, y: H - 8, 'text-anchor': 'middle', 'font-size': 10.5, fill: C.muted }, svg);
  n2.textContent = k ? `dashed: undeformed · deformation exaggerated ×${fmt(k, 2)}` : 'no deformation';
  el.replaceChildren(svg);
}

defineModule({
  id: 'hooke',
  title: "Hooke's Law, Plane Stress & Plane Strain",
  eq: 'Eq. 3.25–3.44',
  lede: 'Apply any stress and get the strain, or apply any strain and get the stress, for an isotropic material. Then switch between full 3D, a thin plate (plane stress) and a thick body (plane strain) to see what the thickness direction does.',
  theory: String.raw`
    <div><p>Summing the strain from each stress component (Tables 3.1–3.2) gives Hooke’s law in 3D, and its inverse:</p>
      <div class="eq">\[ \varepsilon_{xx} = \tfrac1E\big(\sigma_{xx} - \nu(\sigma_{yy}+\sigma_{zz})\big),\qquad \gamma_{xy} = 2\varepsilon_{xy} = \frac{\sigma_{xy}}{G} \]</div>
      <div class="eq">\[ \sigma_{xx} = 2G\varepsilon_{xx} + \lambda\,\mathrm{tr}(\underline{\varepsilon}),\qquad \sigma_{xy} = G\gamma_{xy} \]</div>
      <p class="eqn">Eq. 3.25 – 3.36 · \(G = \frac{E}{2(1+\nu)}\), \(\lambda = \frac{\nu E}{(1+\nu)(1-2\nu)}\), \(K = \frac{E}{3(1-2\nu)}\)</p>
      <p>In Voigt notation (1 = xx, 2 = yy, 3 = zz, 4 = yz, 5 = xz, 6 = xy, engineering shear) these become \(\underline{\varepsilon} = \underline{S}\,\underline{\sigma}\) and \(\underline{\sigma} = \underline{C}\,\underline{\varepsilon}\) with 6×6 compliance and stiffness matrices (Eq. 3.37–3.40).</p></div>
    <div><p><b>Plane stress</b> (thin plate, \(\sigma_{zz} = \sigma_{xz} = \sigma_{yz} = 0\)); the plate thins by \(\varepsilon_{zz} = -\frac{\nu}{E}(\sigma_{xx}+\sigma_{yy})\):</p>
      <div class="eq">\[ \begin{bmatrix}\sigma_{xx}\\ \sigma_{yy}\\ \sigma_{xy}\end{bmatrix} = \frac{E}{1-\nu^2}\begin{bmatrix}1&\nu&0\\ \nu&1&0\\ 0&0&\frac{1-\nu}{2}\end{bmatrix}\begin{bmatrix}\varepsilon_{xx}\\ \varepsilon_{yy}\\ 2\varepsilon_{xy}\end{bmatrix} \]</div>
      <p><b>Plane strain</b> (thick body, \(\varepsilon_{zz} = \varepsilon_{xz} = \varepsilon_{yz} = 0\)); the constraint needs \(\sigma_{zz} = \lambda(\varepsilon_{xx}+\varepsilon_{yy}) = \nu(\sigma_{xx}+\sigma_{yy})\):</p>
      <div class="eq">\[ \begin{bmatrix}\sigma_{xx}\\ \sigma_{yy}\\ \sigma_{xy}\end{bmatrix} = \frac{E}{(1+\nu)(1-2\nu)}\begin{bmatrix}1-\nu&\nu&0\\ \nu&1-\nu&0\\ 0&0&\frac{1-2\nu}{2}\end{bmatrix}\begin{bmatrix}\varepsilon_{xx}\\ \varepsilon_{yy}\\ 2\varepsilon_{xy}\end{bmatrix} \]</div>
      <p class="eqn">Eq. 3.41 – 3.44</p></div>`,

  build(p) {
    p.group('Load case');
    p.sel('preset', {
      label: 'Example', value: 'plate', options: [['custom', 'Custom']].concat(Object.entries(HOOKE_PRESETS).map(([k, v]) => [k, v.label])),
      onset: v => { if (!HOOKE_PRESETS[v]) return; const pr = hookePreset(v); for (const k of ['mode', 'cond', ...HK_KEYS]) if (!p.locked.has(k)) p.controls[k].set(pr[k]); },
    });
    p.seg('cond', { label: 'Condition', value: 'pstress', options: [['3d', 'General 3D'], ['pstress', 'Plane stress'], ['pstrain', 'Plane strain']] });
    p.seg('mode', { label: 'You apply', value: 'stress', options: [['stress', 'Stress → strain'], ['strain', 'Strain → stress']] });
    p.group('Applied stress (MPa)');
    const sl = { sx: 'σx', sy: 'σy', sz: 'σz', tyz: 'τyz', txz: 'τxz', txy: 'τxy' };
    for (const [k, l] of Object.entries(sl)) p.num(k, { label: l, unit: 'MPa', min: -500, max: 500, step: 0.5, value: ({ sx: 100, sy: 40, txy: 20 })[k] || 0 });
    p.sgroup = p._grp;
    p.group('Applied strain (µε)');
    const el = { ex: 'εx', ey: 'εy', ez: 'εz', gyz: 'γyz', gxz: 'γxz', gxy: 'γxy' };
    for (const [k, l] of Object.entries(el)) p.num(k, { label: l, unit: 'µε', min: -5000, max: 5000, step: 1, value: 0 });
    p.egroup = p._grp;
    p.group('Material');
    p.material();
    p.chk('own', { label: 'Use my own E and ν', value: false });
    p.num('E', { label: 'Young’s modulus E', unit: 'GPa', min: 0.001, max: 1200, step: 0.1, value: 70 });
    p.num('nu', { label: 'Poisson’s ratio ν', min: -0.99, max: 0.499, step: 0.001, value: 0.3, help: 'Must be between −1 and 0.5 for a stable isotropic material.' });

    p.schem = h('div', { class: 'schem' });
    p.panel('Deformed block', 'Eq. 3.41–3.44').append(p.schem);
    p.ro = p.panel('Results', 'Eq. 3.25–3.36');
    p.eqn = p.panel('Matrix form', 'Eq. 3.37–3.44');
    const two = h('div', { class: 'two' });
    p.out.append(two);
    p.cmp = p.panel('Plane stress vs plane strain, same input', 'Sec. 3.3.2', two);
    p.pK = p.panel('How lateral constraint stiffens the response', 'Uniaxial strain, 3.3.3', two);
    p.ec = p.panel('Elastic constants and wave speeds', 'Sec. 3.3.1, 3.3.3');
    const cc = p.panel('Concept checks');
    cc.append(
      h('p', { class: 'concept' }, h('b', null, 'Zeros in the matrix (3.3.1). '), 'Why are the upper-right and lower-left 3×3 blocks of S and C all zero for an isotropic material? What would a non-zero term there mean physically?'),
      h('p', { class: 'concept' }, h('b', null, 'Biaxial thinning (3.3.3). '), 'Load equal biaxial stress. Why is the strain in x smaller than for uniaxial stress, and why does the plate thin twice as much?'),
      h('p', { class: 'concept' }, h('b', null, 'Plane stress or plane strain? '), 'A 1 mm sheet and a 300 mm thick forging see the same in-plane load. Which condition fits each, and which one develops a σz?'),
      h('p', { class: 'concept' }, h('b', null, 'Earthquakes (3.3.3). '), 'Deep rock is confined on all sides, so a passing wave sees uniaxial strain and the stiffness M = λ + 2G. Compare Vp with the bar speed √(E/ρ). Now set ν near 0.5 (rubber): what happens to M?'));
  },

  update(p) {
    const S = p.S, mat = getMat(S.mat);
    const own = S.own;
    p.controls.E.wrap.hidden = p.controls.nu.wrap.hidden = !own;
    const Eg = own ? S.E : mat.E, nu = own ? S.nu : mat.nu;
    const c = isoConstants(Eg * 1000, nu);
    const isStress = S.mode === 'stress', d3 = S.cond === '3d';
    p.sgroup.hidden = !isStress; p.egroup.hidden = isStress;
    for (const k of ['sz', 'tyz', 'txz', 'ez', 'gyz', 'gxz']) p.controls[k].wrap.hidden = !d3;
    const match = Object.keys(HOOKE_PRESETS).find(k => { const pr = hookePreset(k); return ['mode', 'cond', ...HK_KEYS].every(x => pr[x] === S[x]); });
    if (S.preset !== (match || 'custom')) p.controls.preset.set(match || 'custom');

    if (!(Eg > 0) || !(nu > -1 && nu < 0.5)) {
      p.readouts(p.ro, [{ k: 'Material', v: 'not physical', cls: 'bad', title: 'Needs E > 0 and −1 < ν < 0.5' }]);
      return;
    }
    const R = hookeSolve(S, c);
    drawPlateViews(p.schem, R, S.cond);
    const [s1, s2, s3, s4, s5, s6] = R.sig, [e1, e2, e3, e4, e5, e6] = R.eps;
    const dV = (e1 + e2 + e3), sm = (s1 + s2 + s3) / 3;
    const outItems = isStress
      ? [['εx', e1, 'µε', '3.25'], ['εy', e2, 'µε', '3.26'], ['εz', e3, 'µε', '3.27'], ['γxy', e6, 'µε', '3.28'], ['γxz', e5, 'µε', '3.29'], ['γyz', e4, 'µε', '3.30']]
      : [['σx', s1, 'MPa', '3.31'], ['σy', s2, 'MPa', '3.32'], ['σz', s3, 'MPa', '3.33'], ['τxy', s6, 'MPa', '3.34'], ['τxz', s5, 'MPa', '3.35'], ['τyz', s4, 'MPa', '3.36']];
    const items = outItems.map(([k, v, u, eq]) => ({ k, v, u, eq }));
    if (S.cond === 'pstrain' && isStress) items.push({ k: 'σz needed for εz = 0', v: s3, u: 'MPa', cls: 'warn' });
    if (S.cond === 'pstress' && !isStress) items.push({ k: 'εz (sheet thins)', v: e3, u: 'µε', cls: 'warn' });
    items.push({ k: 'Volume change ΔV/V', v: dV, u: 'µε', title: 'tr(ε) = σm/K' }, { k: 'Mean stress σm', v: sm, u: 'MPa' });
    const vm = Math.sqrt(((s1 - s2) ** 2 + (s2 - s3) ** 2 + (s3 - s1) ** 2) / 2 + 3 * (s4 * s4 + s5 * s5 + s6 * s6));
    if (!own && mat.sy) items.push({ k: 'Elastic check', v: vm < mat.sy ? 'below yield' : 'above yield', cls: vm < mat.sy ? 'ok' : 'bad', title: `von Mises ${fmt(vm, 3)} MPa vs σy ${fmt(mat.sy, 3)} MPa (Ch. 4)` });
    p.readouts(p.ro, items);

    // matrix form with numbers
    const fS = v => fmt(v, 3), d = 1e6;          // compliance shown in 1/TPa
    let mrows;
    if (d3) {
      const Sm = [[1, -nu, -nu, 0, 0, 0], [-nu, 1, -nu, 0, 0, 0], [-nu, -nu, 1, 0, 0, 0], [0, 0, 0, 2 * (1 + nu), 0, 0], [0, 0, 0, 0, 2 * (1 + nu), 0], [0, 0, 0, 0, 0, 2 * (1 + nu)]].map(r => r.map(v => v / c.E * d));
      const Cm = [[c.M, c.lam, c.lam, 0, 0, 0], [c.lam, c.M, c.lam, 0, 0, 0], [c.lam, c.lam, c.M, 0, 0, 0], [0, 0, 0, c.G, 0, 0], [0, 0, 0, 0, c.G, 0], [0, 0, 0, 0, 0, c.G]].map(r => r.map(v => v / 1000));
      mrows = isStress
        ? [h('div', { class: 'mrow' }, 'ε (µε) =', matEl(R.eps.map(v => [v])), '=', matEl(Sm, fS), h('span', { class: 'note' }, '1/TPa'), '×', matEl(R.sig.map(v => [v])), 'MPa'), h('p', { class: 'note' }, 'ε = S σ, Eq. 3.39. Order: xx, yy, zz, yz, xz, xy.')]
        : [h('div', { class: 'mrow' }, 'σ (MPa) =', matEl(R.sig.map(v => [v])), '=', matEl(Cm, fS), h('span', { class: 'note' }, 'GPa'), '×', matEl(R.eps.map(v => [v / 1000])), '×10⁻³'), h('p', { class: 'note' }, 'σ = C ε, Eq. 3.40, with C₁₁ = λ + 2G, C₁₂ = λ, C₄₄ = G.')];
    } else {
      const ps = S.cond === 'pstress';
      const Sm = ps ? [[1, -nu, 0], [-nu, 1, 0], [0, 0, 2 * (1 + nu)]].map(r => r.map(v => v / c.E * d))
        : [[1 - nu, -nu, 0], [-nu, 1 - nu, 0], [0, 0, 2]].map(r => r.map(v => v * (1 + nu) / c.E * d));
      const Cm = ps ? [[1, nu, 0], [nu, 1, 0], [0, 0, (1 - nu) / 2]].map(r => r.map(v => v * c.E / (1 - nu * nu) / 1000))
        : [[1 - nu, nu, 0], [nu, 1 - nu, 0], [0, 0, (1 - 2 * nu) / 2]].map(r => r.map(v => v * c.E / ((1 + nu) * (1 - 2 * nu)) / 1000));
      const e3v = [e1, e2, e6], s3v = [s1, s2, s6];
      mrows = isStress
        ? [h('div', { class: 'mrow' }, '[εx εy γxy] (µε) =', matEl(e3v.map(v => [v])), '=', matEl(Sm, fS), h('span', { class: 'note' }, '1/TPa'), '×', matEl(s3v.map(v => [v])), 'MPa'), h('p', { class: 'note' }, `${ps ? 'Plane stress, Eq. 3.41' : 'Plane strain, Eq. 3.43'}.`)]
        : [h('div', { class: 'mrow' }, '[σx σy τxy] (MPa) =', matEl(s3v.map(v => [v])), '=', matEl(Cm, fS), h('span', { class: 'note' }, 'GPa'), '×', matEl(e3v.map(v => [v / 1000])), '×10⁻³'), h('p', { class: 'note' }, `${ps ? 'Plane stress, Eq. 3.42' : 'Plane strain, Eq. 3.44'}.`)];
    }
    p.eqn.replaceChildren(h('div', { class: 'tscroll' }, mrows));

    // compare three conditions for the same in-plane input
    const inPlane = isStress ? { sx: S.sx, sy: S.sy, txy: S.txy } : { ex: S.ex, ey: S.ey, gxy: S.gxy };
    const run = cond => hookeSolve(Object.assign({}, Object.fromEntries(HK_KEYS.map(x => [x, 0])), inPlane, { mode: S.mode, cond }), c);
    const rowsT = isStress
      ? [['εx (µε)', 0], ['εy (µε)', 1], ['εz (µε)', 2, 'eps'], ['σz (MPa)', 2, 'sig']]
      : [['σx (MPa)', 0, 'sig'], ['σy (MPa)', 1, 'sig'], ['σz (MPa)', 2, 'sig'], ['εz (µε)', 2, 'eps']];
    const ps = run('pstress'), pe = run('pstrain');
    const val = (Rr, i, w) => (w || (isStress ? 'eps' : 'sig')) === 'eps' ? Rr.eps[i] : Rr.sig[i];
    p.cmp.replaceChildren(h('div', { class: 'tscroll' }, h('table', { class: 't' },
      h('thead', null, h('tr', null, h('th', { style: { textTransform: 'none' } }, isStress ? 'Same σx, σy, τxy' : 'Same εx, εy, γxy'), h('th', { class: 'num', style: { textTransform: 'none' } }, 'Plane stress'), h('th', { class: 'num', style: { textTransform: 'none' } }, 'Plane strain'))),
      h('tbody', null, rowsT.map(([lab, i, w]) => h('tr', null, h('td', null, lab), h('td', { class: 'num' }, fmt(val(ps, i, w), 4)), h('td', { class: 'num' }, fmt(val(pe, i, w), 4))))))),
      h('p', { class: 'note' }, isStress ? 'Under plane strain the thickness cannot shrink, so a σz builds up and the in-plane strains are a little smaller.' : 'Holding εz = 0 makes the material stiffer: the same in-plane strain needs more stress.'));

    // stiffening vs ν
    const nus = linspace(0, 0.495, 120);
    Plot.render(p.pK, {
      h: 260, aria: 'Effective stiffness versus Poisson ratio',
      x: { label: 'Poisson’s ratio ν', short: 'ν', min: 0, max: 0.5 },
      y: { label: 'Stiffness / E', short: 'k/E', log: true, min: 1, max: 100 },
      series: [
        { name: 'Free sides: E', color: 'c6', data: nus.map(v => [v, 1]) },
        { name: 'One side held: E/(1−ν²)', color: 'c3', data: nus.map(v => [v, 1 / (1 - v * v)]) },
        { name: 'All sides held: M = λ + 2G', color: 'c1', width: 2.5, data: nus.map(v => [v, (1 - v) / ((1 + v) * (1 - 2 * v))]) },
      ],
      marks: [{ t: 'vline', x: Math.min(nu, 0.495), color: 'c4', label: `ν = ${fmt(nu, 3)}` }],
      legend: 'tl',
    });

    // constants and wave speeds
    const rho = own ? NaN : mat.rho;
    const sp = m => Number.isFinite(rho) ? Math.sqrt(m * 1e6 / rho) : NaN;
    p.readouts(p.ec, [
      { k: 'E', v: c.E / 1000, u: 'GPa' }, { k: 'ν', v: nu },
      { k: 'G = E/2(1+ν)', v: c.G / 1000, u: 'GPa' }, { k: 'K = E/3(1−2ν)', v: c.K / 1000, u: 'GPa' },
      { k: 'λ', v: c.lam / 1000, u: 'GPa' }, { k: 'M = λ + 2G', v: c.M / 1000, u: 'GPa' },
      { k: 'Bar wave √(E/ρ)', v: sp(c.E), u: 'm/s' }, { k: 'P wave √(M/ρ)', v: sp(c.M), u: 'm/s' }, { k: 'S wave √(G/ρ)', v: sp(c.G), u: 'm/s' },
    ]);
    p.readoutData = items;
  },
});

   Cubic crystals: three constants C11, C12, C44 (GPa). Orthotropic / transversely isotropic lamina in 2D: E1, E2, ν12, G12. */

const CUBIC = {
  cu: { label: 'Copper (FCC)', C11: 168.4, C12: 121.4, C44: 75.4, notesA: 3.2 },

  al: { label: 'Aluminum (FCC)', C11: 108.2, C12: 61.3, C44: 28.5, notesA: 1.2 },

  w: { label: 'Tungsten (BCC)', C11: 501.0, C12: 198.0, C44: 151.4, notesA: 1.0 },
  li: { label: 'Lithium (BCC)', C11: 13.5, C12: 11.4, C44: 8.8, notesA: 9.4 },
  zro2: { label: 'Cubic zirconia (ZrO₂)', C11: 410, C12: 110, C44: 60 },
};
const LAMINA = {
  cfrp: { label: 'Carbon/epoxy, unidirectional', E1: 181, E2: 10.3, nu12: 0.28, G12: 7.17 },
  gfrp: { label: 'Glass/epoxy, unidirectional', E1: 38.6, E2: 8.27, nu12: 0.26, G12: 4.14 },
  kevlar: { label: 'Kevlar/epoxy, unidirectional', E1: 76, E2: 5.5, nu12: 0.34, G12: 2.3 },
  wood: { label: 'Douglas fir (along / across grain)', E1: 13.4, E2: 0.9, nu12: 0.29, G12: 0.86 },
  iso: { label: 'Aluminum (isotropic check)', E1: 70, E2: 70, nu12: 0.33, G12: 26.32 },
};

function cubicCompliance(C11, C12, C44) {
  const den = (C11 - C12) * (C11 + 2 * C12);
  return { S11: (C11 + C12) / den, S12: -C12 / den, S44: 1 / C44 };
}
/* Young's modulus along unit direction n for a cubic crystal. */
function cubicE(Sc, n) {
  const L = Math.hypot(...n), [l, m, k] = n.map(v => v / L);
  return 1 / (Sc.S11 - 2 * (Sc.S11 - Sc.S12 - Sc.S44 / 2) * (l * l * m * m + m * m * k * k + k * k * l * l));
}
/* Off-axis engineering constants of an orthotropic lamina loaded at θ to the 1 axis. */
function laminaOffAxis(L, thDeg) {
  const t = thDeg * Math.PI / 180, c = Math.cos(t), s = Math.sin(t), c2 = c * c, s2 = s * s;
  const invE = c2 * c2 / L.E1 + (1 / L.G12 - 2 * L.nu12 / L.E1) * s2 * c2 + s2 * s2 / L.E2;
  const invG = 2 * (2 / L.E1 + 2 / L.E2 + 4 * L.nu12 / L.E1 - 1 / L.G12) * s2 * c2 + (s2 * s2 + c2 * c2) / L.G12;
  const Ex = 1 / invE;
  const nuxy = Ex * (L.nu12 / L.E1 * (s2 * s2 + c2 * c2) - (1 / L.E1 + 1 / L.E2 - 1 / L.G12) * s2 * c2);
  return { Ex, Gxy: 1 / invG, nuxy };
}

defineModule({
  id: 'aniso',
  title: 'Anisotropic Elasticity',
  eq: 'Eq. 3.45–3.51',
  lede: 'Single crystals and fiber composites are stiffer in some directions than others. See how many constants each symmetry needs, how anisotropic common metals are, and how the modulus changes with direction.',
  theory: String.raw`
    <div><p>In general the stiffness and compliance matrices are full and symmetric, with 21 independent constants (Eq. 3.45–3.46). Symmetry reduces that number: orthotropic 9, transversely isotropic 5, cubic 3, isotropic 2.</p>
      <p>A cubic crystal needs \(C_{11}, C_{12}, C_{44}\). Its anisotropy is measured by the Zener ratio, which is 1 for an isotropic material:</p>
      <div class="eq">\[ A = \frac{2C_{44}}{C_{11} - C_{12}} \]</div>
      <p class="eqn">Eq. 3.47 · Table 3.3</p>
      <p>The modulus along a direction with direction cosines \((l, m, n)\) follows from the compliances:</p>
      <div class="eq">\[ \frac{1}{E_{lmn}} = S_{11} - 2\Big(S_{11} - S_{12} - \tfrac12 S_{44}\Big)(l^2m^2 + m^2n^2 + n^2l^2) \]</div>
      <p class="eqn">\(S_{11} = \frac{C_{11}+C_{12}}{(C_{11}-C_{12})(C_{11}+2C_{12})}\), \(S_{12} = \frac{-C_{12}}{(C_{11}-C_{12})(C_{11}+2C_{12})}\), \(S_{44} = 1/C_{44}\)</p></div>
    <div><p>A transversely isotropic material such as a fiber composite or wood needs, in 2D, four engineering constants:</p>
      <div class="eq">\[ \underline{S} = \begin{bmatrix} 1/E_1 & -\nu_{12}/E_1 & 0 \\ -\nu_{12}/E_1 & 1/E_2 & 0 \\ 0 & 0 & 1/G_{12}\end{bmatrix}, \qquad \frac{\nu_{12}}{E_1} = \frac{\nu_{21}}{E_2} \]</div>
      <p class="eqn">Eq. 3.49, 3.51</p>
      <p>Loaded at an angle \(\theta\) to the fibers, the apparent modulus is</p>
      <div class="eq">\[ \frac{1}{E_x} = \frac{\cos^4\theta}{E_1} + \Big(\frac{1}{G_{12}} - \frac{2\nu_{12}}{E_1}\Big)\sin^2\theta\cos^2\theta + \frac{\sin^4\theta}{E_2} \]</div>
      <p class="eqn">obtained by rotating \(\underline{S}\) with the transformation of Sec. 3.1.2</p></div>`,

/* Eigenvalues/vectors of a symmetric 3×3 matrix. Returns values sorted σ1 ≥ σ2 ≥ σ3 with unit vectors (right-handed set). */
function eigSym3(A0) {
  const A = A0.map(r => r.slice()), V = [[1, 0, 0], [0, 1, 0], [0, 0, 1]];
  for (let sweep = 0; sweep < 60; sweep++) {
    let off = 0; for (let i = 0; i < 3; i++) for (let j = i + 1; j < 3; j++) off += A[i][j] * A[i][j];
    if (off < 1e-30 * (1 + A[0][0] ** 2 + A[1][1] ** 2 + A[2][2] ** 2)) break;
    for (let p = 0; p < 2; p++) for (let q = p + 1; q < 3; q++) {
      if (Math.abs(A[p][q]) < 1e-300) continue;
      const th = (A[q][q] - A[p][p]) / (2 * A[p][q]);
      const t = Math.sign(th || 1) / (Math.abs(th) + Math.sqrt(th * th + 1)), c = 1 / Math.sqrt(t * t + 1), s = t * c;
      for (let k = 0; k < 3; k++) { const akp = A[k][p], akq = A[k][q]; A[k][p] = c * akp - s * akq; A[k][q] = s * akp + c * akq; }
      for (let k = 0; k < 3; k++) { const apk = A[p][k], aqk = A[q][k]; A[p][k] = c * apk - s * aqk; A[q][k] = s * apk + c * aqk; }
      for (let k = 0; k < 3; k++) { const vkp = V[k][p], vkq = V[k][q]; V[k][p] = c * vkp - s * vkq; V[k][q] = s * vkp + c * vkq; }
    }
  }
  const idx = [0, 1, 2].sort((a, b) => A[b][b] - A[a][a]);
  const vals = idx.map(i => A[i][i]);
  const vecs = idx.map(i => { let v = [V[0][i], V[1][i], V[2][i]]; const big = v.reduce((m, x, k) => Math.abs(x) > Math.abs(v[m]) ? k : m, 0); if (v[big] < 0) v = v.map(x => -x); return v; });
  const cr = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
  vecs[2] = cr(vecs[0], vecs[1]);                                // keep the triad right-handed
  return { vals, vecs };
}
function stressInvariants(T) {
  const [[a, d, f], [, b, e], [, , c]] = T;
  return { I1: a + b + c, I2: a * b + b * c + c * a - d * d - e * e - f * f, I3: a * (b * c - e * e) - d * (d * c - e * f) + f * (d * e - b * f) };
}

function drawStressCubes(el, T, E, view) {
  const W = Math.max(300, el.clientWidth || 600), wide = W >= 560, s = Plot.s;
  const C = { ink: cv('--ink'), muted: cv('--muted'), acc: cv('--accent'), surf: cv('--surface'), face: cv('--surface-2'), ten: cv('--c4'), com: cv('--c5'), sh: cv('--c3'), p: [cv('--c4'), cv('--c2'), cv('--c5')] };
  const cellW = wide ? W / 2 : W, cellH = 300, H = wide ? cellH : 2 * cellH;
  const svg = s('svg', { viewBox: `0 0 ${W} ${H}`, width: W, height: H, role: 'img', 'aria-label': 'Stress cube on x, y, z axes and on principal axes', 'font-family': 'IBM Plex Mono, Menlo, monospace' });
  s('rect', { x: 0, y: 0, width: W, height: H, fill: C.surf }, svg);
  const defs = s('defs', {}, svg);
  const mk = (id, col) => { const m = s('marker', { id, viewBox: '0 0 10 10', refX: 9, refY: 5, markerWidth: 6, markerHeight: 6, orient: 'auto' }, defs); s('path', { d: 'M0,0 L10,5 L0,10 z', fill: col }, m); };
  mk('c3T', C.ten); mk('c3C', C.com); mk('c3S', C.sh); mk('c3A', C.acc); C.p.forEach((c, i) => mk('c3P' + i, c));
  const ph = view.az * Math.PI / 180, ev = view.el * Math.PI / 180;
  const rot = ([x, y, z]) => { const xr = x * Math.cos(ph) - y * Math.sin(ph), yr = x * Math.sin(ph) + y * Math.cos(ph); return [xr, yr, z]; };
  const cam = [0, -Math.cos(ev), Math.sin(ev)], up = [0, Math.sin(ev), Math.cos(ev)];
  const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
  const maxAbs = Math.max(...T.flat().map(Math.abs), ...E.vals.map(Math.abs), 1e-12);
  const half = Math.min(cellW, cellH) * 0.24;
  const cube = (cx, cy, axes, faces, title) => {
    const P = v => { const r = rot(v); return [cx + half * r[0], cy - half * dot(r, up)]; };
    const add = (...vs) => vs.reduce((a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]]);
    const sc = (v, k) => v.map(x => x * k);
    const line = (a, b, col, id, w = 2) => { const p0 = P(a), p1 = P(b); s('line', { x1: p0[0].toFixed(1), y1: p0[1].toFixed(1), x2: p1[0].toFixed(1), y2: p1[1].toFixed(1), stroke: col, 'stroke-width': w, 'marker-end': id ? `url(#${id})` : null }, svg); };
    const txt = (v, str, col, size = 11) => { const p = P(v); const t = s('text', { x: p[0].toFixed(1), y: (p[1] + 4).toFixed(1), 'text-anchor': 'middle', 'font-size': size, fill: col }, svg); t.textContent = str; };
    // faces, back to front
    const fl = [];
    for (let i = 0; i < 3; i++) for (const sg of [1, -1]) {
      const n = sc(axes[i], sg), u = axes[(i + 1) % 3], w = axes[(i + 2) % 3];
      const corners = [[1, 1], [-1, 1], [-1, -1], [1, -1]].map(([a, b]) => add(n, sc(u, a), sc(w, b)));
      fl.push({ i, sg, n, corners, depth: dot(rot(n), cam) });
    }
    fl.sort((a, b) => a.depth - b.depth);
    for (const f of fl) {
      const vis = f.depth > 0;
      s('path', { d: 'M' + f.corners.map(P).map(q => q.map(v => v.toFixed(1)).join(',')).join('L') + 'Z', fill: vis ? C.face : 'none', 'fill-opacity': vis ? 0.92 : 0, stroke: C.ink, 'stroke-width': vis ? 1.3 : 0.6, 'stroke-dasharray': vis ? null : '3 3', opacity: vis ? 1 : 0.5 }, svg);
    }
    // tractions on the visible faces
    for (const f of fl) {
      if (f.depth <= 0) continue;
      for (const tr of faces(f.i, f.sg)) {
        if (Math.abs(tr.v) < 1e-9 * maxAbs) continue;
        const L = 0.25 + 0.75 * Math.abs(tr.v) / maxAbs;
        if (tr.kind === 'n') {

          if (tr.v > 0) line(a, b, C.ten, 'c3T'); else line(b, a, C.com, 'c3C');
          if (tr.lab) txt(sc(f.n, 1.06 + L + 0.22), tr.lab, tr.v > 0 ? C.ten : C.com);
        } else {
          const base = sc(f.n, 1.0), d = sc(tr.dir, Math.sign(tr.v) * Math.min(L, 0.85));

    }

    for (let i = 0; i < 3; i++) {
      const r = rot(axes[i]), ex = kx + 22 * r[0], ey = ky - 22 * dot(r, up);
      s('line', { x1: kx, y1: ky, x2: ex.toFixed(1), y2: ey.toFixed(1), stroke: C.acc, 'stroke-width': 1.4, 'marker-end': 'url(#c3A)' }, svg);
      const lt = s('text', { x: (kx + 32 * r[0]).toFixed(1), y: (ky - 32 * dot(r, up) + 4).toFixed(1), 'text-anchor': 'middle', 'font-size': 10.5, fill: C.acc }, svg); lt.textContent = title.ax[i];
    }
    const t = s('text', { x: cx, y: 18 + (cy - cellH / 2), 'text-anchor': 'middle', 'font-size': 12.5, 'font-weight': 600, fill: C.ink, 'font-family': 'IBM Plex Sans, Segoe UI, Arial, sans-serif' }, svg); t.textContent = title.t;
  };
  const X = [[1, 0, 0], [0, 1, 0], [0, 0, 1]], nm = ['x', 'y', 'z'];
  cube(wide ? W / 4 : W / 2, cellH / 2 + 8, X, (i, sg) => {
    const out = [{ kind: 'n', v: T[i][i], lab: sg > 0 ? `σ${nm[i]}${nm[i]}` : null }];
    for (let j = 0; j < 3; j++) if (j !== i) out.push({ kind: 's', v: T[i][j], dir: X[j].map(v => v * sg) });
    return out;
  }, { t: 'Element on x, y, z', ax: nm });
  cube(wide ? 3 * W / 4 : W / 2, (wide ? 0 : cellH) + cellH / 2 + 8, E.vecs, (i, sg) => [{ kind: 'n', v: E.vals[i], lab: sg > 0 ? `σ${i + 1}` : null }], { t: 'Element on principal axes (no shear)', ax: ['1', '2', '3'] });
  el.replaceChildren(svg);
}

  theory: String.raw`
    <div><p>Nine components describe the stress on three faces of a cube (Eq. 3.1). Moment equilibrium of the cube forces \(\sigma_{xy} = \sigma_{yx}\) and so on, leaving six (Eq. 3.3):</p>
      <div class="eq">\[ \underline{\sigma} = \begin{bmatrix} \sigma_{xx} & \sigma_{xy} & \sigma_{xz} \\ \sigma_{xy} & \sigma_{yy} & \sigma_{yz} \\ \sigma_{xz} & \sigma_{yz} & \sigma_{zz} \end{bmatrix} \]</div>
      <p>Force equilibrium of a small cube, with no body force, gives three differential equations every stress field must satisfy:</p>
      <div class="eq">\[ \frac{\partial\sigma_{xx}}{\partial x} + \frac{\partial\sigma_{xy}}{\partial y} + \frac{\partial\sigma_{xz}}{\partial z} = 0 \quad (+\,b_x \text{ with a body force}) \]</div>

/* Module: Photoelasticity (Notes App. B; stress-optic law)
   Fringe order N = t(σ1 − σ2)/fσ. Fields: diametrally loaded disk, plate with a hole (Kirsch), beam in 4-point bending. */

const PHOTO_MATS = {
  pc: { label: 'Polycarbonate', fs: 7.0 },
  epoxy: { label: 'Epoxy', fs: 11.0 },
  urethane: { label: 'Urethane rubber (very sensitive)', fs: 0.2 },
  pmma: { label: 'PMMA (acrylic, weak)', fs: 130 },
};
const LAMBDA0 = 546;   // nm, green mercury line; fσ is quoted at this wavelength

/* White-balanced RGB weight of each wavelength, from analytic fits to the CIE 1931 colour-matching functions. */
const SPECTRUM = (() => {
  const g = (l, m, a, b) => Math.exp(-0.5 * ((l - m) / (l < m ? a : b)) ** 2);
  const L = []; for (let l = 400; l <= 700; l += 6) L.push(l);
  const toRGB = ([X, Y, Z]) => [3.2406 * X - 1.5372 * Y - 0.4986 * Z, -0.9689 * X + 1.8758 * Y + 0.0415 * Z, 0.0557 * X - 0.2040 * Y + 1.0570 * Z];
  const rows = L.map(l => toRGB([
    1.056 * g(l, 599.8, 37.9, 31.0) + 0.362 * g(l, 442.0, 16.0, 26.7) - 0.065 * g(l, 501.1, 20.4, 26.2),
    0.821 * g(l, 568.8, 46.9, 40.5) + 0.286 * g(l, 530.9, 16.3, 31.1),
    1.217 * g(l, 437.0, 11.8, 36.0) + 0.681 * g(l, 459.0, 26.0, 13.8)]));
  const tot = [0, 1, 2].map(c => rows.reduce((s, r) => s + r[c], 0));
  return { L, w: rows.map(r => r.map((v, c) => v / tot[c])) };
})();

/* Stress field of each specimen. Coordinates in mm (y up). Returns σ1 − σ2 (MPa) and the σ1 direction (rad), or null outside. */
function photoField(S) {
  if (S.spec === 'disk') {
    const R = S.D / 2, k = 2 * S.P / (Math.PI * S.t);
    return {
      box: [-R, R, -R, R], inside: (x, y) => x * x + y * y <= R * R,
      at(x, y) {
        const r1 = x * x + (R - y) ** 2, r2 = x * x + (R + y) ** 2;
        if (r1 < 1e-9 || r2 < 1e-9) return null;
        const sx = -k * ((R - y) * x * x / (r1 * r1) + (R + y) * x * x / (r2 * r2) - 1 / (2 * R));
        const sy = -k * ((R - y) ** 3 / (r1 * r1) + (R + y) ** 3 / (r2 * r2) - 1 / (2 * R));
        const txy = k * ((R - y) ** 2 * x / (r1 * r1) - (R + y) ** 2 * x / (r2 * r2));
        return { sx, sy, txy };
      },
    };
  }
  if (S.spec === 'hole') {
    const a = S.a, s0 = S.P / (S.W * S.t), X = 4 * a, Y = 3 * a;
    return {
      box: [-X, X, -Y, Y], inside: (x, y) => x * x + y * y >= a * a, s0,
      at(x, y) {
        const r2 = x * x + y * y, q = a * a / r2, th = Math.atan2(y, x), c2 = Math.cos(2 * th), s2 = Math.sin(2 * th);
        const srr = s0 / 2 * (1 - q) + s0 / 2 * (1 - 4 * q + 3 * q * q) * c2;
        const stt = s0 / 2 * (1 + q) - s0 / 2 * (1 + 3 * q * q) * c2;
        const trt = -s0 / 2 * (1 + 2 * q - 3 * q * q) * s2;
        const c = Math.cos(th), s = Math.sin(th);
        return { sx: srr * c * c + stt * s * s - 2 * trt * s * c, sy: srr * s * s + stt * c * c + 2 * trt * s * c, txy: (srr - stt) * s * c + trt * (c * c - s * s) };
      },
    };
  }
  const R = beamSolve({ case: '4pt', L: S.L, P: S.P, aL: S.aL, sec: 'rect', b: S.t, h: S.h }, 1);
  return {
    box: [0, S.L, -S.h / 2, S.h / 2], inside: () => true, beam: R,
    at(x, y) { const M = R.M(x), V = R.V(x); return { sx: -M * y / R.I, sy: 0, txy: V * (S.h * S.h / 4 - y * y) / (2 * R.I) }; },
  };
}
const photoN = (st, S) => { const d = Math.sqrt((st.sx - st.sy) ** 2 + 4 * st.txy * st.txy); return { d, N: S.t * d / S.fs, th: 0.5 * Math.atan2(2 * st.txy, st.sx - st.sy) }; };

function drawPhoto(el, S, F) {
  const Wd = Math.max(280, el.clientWidth || 560);
  const [x0, x1, y0, y1] = F.box, aspect = (y1 - y0) / (x1 - x0);
  const res = Math.min(S.light === 'white' ? 420 : 560, Math.round(Wd));
  const pw = res, ph = Math.max(Math.round(res * 0.32), Math.round(res * aspect));   // very slender specimens are stretched vertically
  const cvs = h('canvas', { width: pw, height: ph, class: 'field', style: { width: '100%', height: 'auto', display: 'block', borderRadius: '4px', background: '#000', touchAction: 'none' }, 'aria-label': 'Simulated photoelastic fringe pattern' });
  const ctx = cvs.getContext('2d'), img = ctx.createImageData(pw, ph), D = img.data;
  const alpha = S.alpha * Math.PI / 180, white = S.light === 'white', SL = SPECTRUM.L, SW = SPECTRUM.w;
  const inten = (N, ang, lam) => {
    const ph2 = Math.sin(Math.PI * N * LAMBDA0 / lam) ** 2;
    if (S.pol === 'dark') return ph2;
    if (S.pol === 'light') return 1 - ph2;
    return Math.sin(2 * (ang - alpha)) ** 2 * ph2;          // crossed plane polariscope: isochromatics × isoclinics
  };
  const gam = v => { v = Math.max(0, Math.min(1, v)); return 255 * (v <= 0.0031308 ? 12.92 * v : 1.055 * v ** (1 / 2.4) - 0.055); };
  const bg = inten(0, 0, LAMBDA0);
  for (let j = 0; j < ph; j++) {
    const y = y1 - (j + 0.5) / ph * (y1 - y0);
    for (let i = 0; i < pw; i++) {
      const x = x0 + (i + 0.5) / pw * (x1 - x0), o = 4 * (j * pw + i);
      let r, g, b;
      const st = F.inside(x, y) ? F.at(x, y) : null;
      if (!st) { const v = bg * 0.85; r = g = b = 0; if (white) { r = g = b = gam(v * 0.8); } else { g = gam(v * 0.9); r = gam(v * 0.25); b = gam(v * 0.3); } D[o] = r; D[o + 1] = g; D[o + 2] = b; D[o + 3] = 255; continue; }
      const q = photoN(st, S);
      if (white) {
        if (q.N > 30) { const v = 0.5 * (S.pol === 'plane' ? Math.sin(2 * (q.th - alpha)) ** 2 * 2 : 1); r = g = b = gam(v * 1.25); }
        else {
          let R = 0, G = 0, B = 0;
          for (let k = 0; k < SL.length; k++) { const I = inten(q.N, q.th, SL[k]); R += I * SW[k][0]; G += I * SW[k][1]; B += I * SW[k][2]; }
          r = gam(R * 1.25); g = gam(G * 1.25); b = gam(B * 1.25);
        }
      } else {
        const I = q.N > 60 ? 0.5 : inten(q.N, q.th, LAMBDA0);
        r = gam(I * 0.28); g = gam(I * 0.95); b = gam(I * 0.32);
      }
      D[o] = r; D[o + 1] = g; D[o + 2] = b; D[o + 3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
  // outline and load arrows
  const X = x => (x - x0) / (x1 - x0) * pw, Y = y => (y1 - y) / (y1 - y0) * ph;
  ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 1.2; ctx.fillStyle = 'rgba(255,255,255,.85)'; ctx.font = `${Math.max(10, pw / 45)}px IBM Plex Mono, monospace`;
  if (S.spec === 'disk') { ctx.beginPath(); ctx.arc(X(0), Y(0), X(S.D / 2) - X(0), 0, 2 * Math.PI); ctx.stroke(); ctx.fillText('P ↓', X(0) + 6, 14); ctx.fillText('P ↑', X(0) + 6, ph - 6); }
  else if (S.spec === 'hole') { ctx.beginPath(); ctx.arc(X(0), Y(0), X(S.a) - X(0), 0, 2 * Math.PI); ctx.stroke(); ctx.fillText('← σ0', 6, ph / 2 - 6); ctx.fillText('σ0 →', pw - 52, ph / 2 - 6); }
  else { const a = F.beam.a; for (const xp of [a, S.L - a]) ctx.fillText('↓', X(xp) - 4, 12); ctx.fillText('▲', X(0) + 1, ph - 2); ctx.fillText('▲', X(S.L) - 12, ph - 2); }
  // hover readout
  const tip = h('div', { class: 'tip', hidden: true });
  const wrap = h('div', { class: 'plot', style: { position: 'relative' } }, cvs, tip);
  cvs.addEventListener('pointermove', e => {
    const rc = cvs.getBoundingClientRect(), x = x0 + (e.clientX - rc.left) / rc.width * (x1 - x0), y = y1 - (e.clientY - rc.top) / rc.height * (y1 - y0);
    const st = F.inside(x, y) ? F.at(x, y) : null;
    if (!st) { tip.hidden = true; return; }
    const q = photoN(st, S);
    tip.hidden = false; tip.textContent = `N ${fmt(q.N, 3)} · σ1−σ2 ${fmt(q.d, 3)} MPa · θ1 ${fmt(q.th * 180 / Math.PI, 3)}°`;
    tip.style.left = (e.clientX - rc.left) + 'px'; tip.style.top = (e.clientY - rc.top) + 'px';
  });
  cvs.addEventListener('pointerleave', () => { tip.hidden = true; });
  el.replaceChildren(wrap);
}

defineModule({
  id: 'photo',
  title: 'Photoelasticity',
  eq: 'stress-optic law',
  lede: 'Transparent polymers become birefringent under stress. Between polarizers the stress shows up as colored fringes, one fringe for every fσ/t of principal stress difference. Calibrate the material with a disk, then read the stress concentration at a hole or the bending stress in a beam.',
  theory: String.raw`
    <div><p>Under stress, light polarized along the two principal directions travels at different speeds. Their relative retardation, counted in wavelengths, is the isochromatic fringe order \(N\), set by the stress-optic law:</p>

      <p>A circular polariscope shows only the isochromatics: dark field \(I \propto \sin^2(\pi N)\), light field \(I \propto \cos^2(\pi N)\). A crossed plane polariscope multiplies by \(\sin^2 2(\theta_1 - \alpha)\), adding black isoclinics wherever a principal direction lines up with the polarizer angle \(\alpha\).</p></div>

/* Module: Elastic Constants & Strain Energy (Notes 1.4, Eq. 1.1–1.17) */

const EC_PAIRS = {
  Enu: { label: 'E and ν', keys: ['cE', 'cNu'] }, EG: { label: 'E and G', keys: ['cE', 'cG'] }, EK: { label: 'E and K', keys: ['cE', 'cK'] },
  Gnu: { label: 'G and ν', keys: ['cG', 'cNu'] }, Knu: { label: 'K and ν', keys: ['cK', 'cNu'] }, KG: { label: 'K and G', keys: ['cK', 'cG'] },
  LG: { label: 'λ and G', keys: ['cLam', 'cG'] }, Lnu: { label: 'λ and ν', keys: ['cLam', 'cNu'] },
};
/* Any two isotropic constants (GPa) → E (GPa) and ν. */
function ecToEnu(pair, S) {
  const { cE: E, cG: G, cK: K, cLam: L, cNu: nu } = S;
  switch (pair) {
    case 'Enu': return { E, nu };
    case 'EG': return { E, nu: E / (2 * G) - 1 };
    case 'EK': return { E, nu: (3 * K - E) / (6 * K) };
    case 'Gnu': return { E: 2 * G * (1 + nu), nu };
    case 'Knu': return { E: 3 * K * (1 - 2 * nu), nu };
    case 'KG': return { E: 9 * K * G / (3 * K + G), nu: (3 * K - 2 * G) / (2 * (3 * K + G)) };
    case 'LG': return { E: G * (3 * L + 2 * G) / (L + G), nu: L / (2 * (L + G)) };
    case 'Lnu': return { E: nu === 0 ? NaN : L * (1 + nu) * (1 - 2 * nu) / nu, nu };
  }
}
/* Idealized engineering stress–strain curve from σy, σu, εf and n (for the strain-energy picture only). */
function idealCurve(m) {
  const E = m.E * 1000, sy = m.sy, su = Math.max(m.su || sy, sy), ef = m.ef || su / E;
  const ey = sy / E, pts = [[0, 0]];
  if (m.brittle || ey >= ef * 0.98) { const e1 = Math.min(ef, (m.brittle ? su : sy) / E); pts.push([e1, E * e1]); return { pts, ey: e1, sy: E * e1, ef: e1, elasticOnly: true }; }
  pts.push([ey, sy]);
  const eu = clamp(m.n || 0.15, 2 * ey, 0.85 * ef);
  for (let i = 1; i <= 60; i++) { const x = i / 60, e = ey + (eu - ey) * x; pts.push([e, sy + (su - sy) * (1 - (1 - x) ** 2)]); }
  for (let i = 1; i <= 30; i++) { const e = eu + (ef - eu) * i / 30; pts.push([e, su * (1 - 0.15 * i / 30)]); }
  return { pts, ey, sy, ef, eu };
}
const curveArea = pts => pts.reduce((a, p, i) => i ? a + (p[0] - pts[i - 1][0]) * (p[1] + pts[i - 1][1]) / 2 : 0, 0);

function drawSimpleTests(el, c, load) {
  const W = Math.max(300, el.clientWidth || 600), H = 200, s = Plot.s;
  const C = { ink: cv('--ink'), muted: cv('--muted'), acc: cv('--accent'), surf: cv('--surface'), fill: cv('--accent-soft'), red: cv('--c4') };
  const svg = s('svg', { viewBox: `0 0 ${W} ${H}`, width: W, height: H, role: 'img', 'aria-label': 'Tension, shear and hydrostatic tests', 'font-family': 'IBM Plex Mono, Menlo, monospace' });
  s('rect', { x: 0, y: 0, width: W, height: H, fill: C.surf }, svg);
  const cw = W / 3, a = Math.min(cw * 0.26, 46);
  const eps = load / c.E, epsT = -c.nu * eps, gam = load / c.G, vol = -load / c.K;
  const magOf = v => 0.16 / Math.max(Math.abs(v), 1e-12);            // each sketch exaggerated on its own scale
  const box = (cx, cy, pts, dashed) => s('path', { d: 'M' + pts.map(([x, y]) => `${(cx + x).toFixed(1)},${(cy - y).toFixed(1)}`).join('L') + 'Z', fill: dashed ? 'none' : C.fill, stroke: dashed ? C.muted : C.acc, 'stroke-width': dashed ? 1.2 : 2, 'stroke-dasharray': dashed ? '4 3' : null }, svg);
  const sq = [[a, a], [-a, a], [-a, -a], [a, -a]];
  const txt = (x, y, t, col = C.muted, size = 11) => { const e = s('text', { x, y, 'text-anchor': 'middle', 'font-size': size, fill: col }, svg); e.textContent = t; };
  const cy = 92;
  // tension
  let cx = cw / 2;
  box(cx, cy, sq.map(([x, y]) => [x * (1 + eps * magOf(eps)), y * (1 + epsT * magOf(eps))]));
  box(cx, cy, sq, true);
  txt(cx, 20, 'Tension: E, ν', C.ink, 12);
  txt(cx, 168, `ε = σ/E = ${fmt(eps * 1e6, 3)} µε`); txt(cx, 184, `lateral ${fmt(epsT * 1e6, 3)} µε`);
  // shear
  cx = cw * 1.5;
  box(cx, cy, sq.map(([x, y]) => [x + y * gam * magOf(gam), y]));
  box(cx, cy, sq, true);
  txt(cx, 20, 'Shear: G', C.ink, 12);
  txt(cx, 168, `γ = τ/G = ${fmt(gam * 1e6, 3)} µε`);
  // hydrostatic
  cx = cw * 2.5;
  const k = 1 + vol / 3 * magOf(vol / 3);
  box(cx, cy, sq.map(([x, y]) => [x * k, y * k]));
  box(cx, cy, sq, true);
  txt(cx, 20, 'Pressure: K', C.ink, 12);
  txt(cx, 168, `ΔV/V = −P/K = ${fmt(vol * 1e6, 3)} µε`);
  txt(W / 2, H - 2, `each loaded at ${fmt(load, 3)} MPa · each sketch exaggerated on its own scale`, C.muted, 10);
  el.replaceChildren(svg);
}

defineModule({
  id: 'constants',
  title: 'Elastic Constants & Strain Energy',
  eq: 'Eq. 1.1–1.17',
  lede: 'An isotropic material needs only two elastic constants; all the others follow. Convert between them, see what each one measures, and compare how much energy different materials store before they yield and before they break.',
  theory: String.raw`
    <div><p>Each constant is measured in its own simple test: Young’s modulus in tension, the shear modulus in shear, the bulk modulus under pressure, Poisson’s ratio from the lateral contraction, and the Lamé constant from a laterally confined test:</p>
      <div class="eq">\[ E = \frac{\sigma}{\varepsilon},\quad G = \frac{\tau}{\gamma},\quad K = -V\frac{dP}{dV},\quad \nu = -\frac{\varepsilon_{yy}}{\varepsilon_{xx}},\quad \lambda = \frac{\sigma_{yy}}{\varepsilon_{xx}}\Big|_{\varepsilon_{yy}=0} \]</div>
      <p class="eqn">Eq. 1.8 – 1.12</p>
      <p>For a homogeneous, isotropic material any two determine the rest:</p>
      <div class="eq">\[ G = \frac{E}{2(1+\nu)},\qquad K = \frac{E}{3(1-2\nu)},\qquad \lambda = \frac{E\nu}{(1+\nu)(1-2\nu)} \]</div>
      <p class="eqn">Eq. 1.13 – 1.15 · stability requires \(-1 < \nu < 0.5\)</p></div>
    <div><p>Engineering stress and strain use the original dimensions; true stress and strain follow the current ones:</p>
      <div class="eq">\[ \sigma = \frac{F}{A_o},\quad \sigma_t = \frac{F}{A},\quad \varepsilon = \frac{\Delta L}{L_o} = \lambda - 1,\quad \varepsilon_t = \ln\frac{L}{L_o} = \ln(1+\varepsilon) \]</div>
      <p class="eqn">Eq. 1.1 – 1.6 · with constant volume, \(\sigma_t = \sigma(1+\varepsilon)\)</p>
      <p>The work done per unit volume is the area under the stress–strain curve. Up to yield it is the modulus of resilience; up to fracture, the tensile toughness:</p>
      <div class="eq">\[ U = \int_0^{\varepsilon}\sigma\,d\varepsilon = \tfrac12\sigma\varepsilon\ (\text{elastic}),\qquad U_R = \tfrac12\sigma_y\varepsilon_y = \frac{\sigma_y^2}{2E} \]</div>
      <p class="eqn">Eq. 1.16 – 1.17 · in shear, \(U = \tau^2/2G\); tensile toughness \(U_f\) is not the same as fracture toughness \(K_{Ic}\)</p></div>`,

      h('p', { class: 'concept' }, h('b', null, 'Auxetics (ν < 0). '), 'Try ν = −0.5. Which constant becomes negative, and what does a negative Poisson’s ratio look like in a tension test?'),
      h('p', { class: 'concept' }, h('b', null, 'Springs vs crash structures. '), 'In the library chart, which materials store the most elastic energy per volume, and which absorb the most energy before breaking? Why are those different lists?'),

      p.readouts(p.ro, [
        { k: 'Young’s modulus E', v: E, u: 'GPa', eq: '1.8' }, { k: 'Poisson’s ratio ν', v: nu, eq: '1.11' },
        { k: 'Shear modulus G', v: G, u: 'GPa', eq: '1.13' }, { k: 'Bulk modulus K', v: K, u: 'GPa', eq: '1.14' },
        { k: 'Lamé constant λ', v: L, u: 'GPa', eq: '1.15' }, { k: 'Constrained modulus λ + 2G', v: L + 2 * G, u: 'GPa' },
        { k: 'E / G', v: E / G }, { k: 'K / G', v: K / G },
      ]);
      const step = { Enu: 'Given E and ν directly.', EG: `ν = E/(2G) − 1 = ${f(S.cE)}/(2 × ${f(S.cG)}) − 1 = ${f(nu)}`, EK: `ν = (3K − E)/(6K) = (3 × ${f(S.cK)} − ${f(S.cE)})/(6 × ${f(S.cK)}) = ${f(nu)}`,
        Gnu: `E = 2G(1 + ν) = 2 × ${f(S.cG)} × (1 + ${f(S.cNu)}) = ${f(E)} GPa`, Knu: `E = 3K(1 − 2ν) = 3 × ${f(S.cK)} × (1 − 2 × ${f(S.cNu)}) = ${f(E)} GPa`,
        KG: `E = 9KG/(3K + G) = ${f(E)} GPa,  ν = (3K − 2G)/(2(3K + G)) = ${f(nu)}`, LG: `E = G(3λ + 2G)/(λ + G) = ${f(E)} GPa,  ν = λ/(2(λ + G)) = ${f(nu)}`,
        Lnu: `E = λ(1 + ν)(1 − 2ν)/ν = ${f(E)} GPa` }[S.pair];
      p.steps.replaceChildren(h('div', { class: 'mrow' }, step),
        h('div', { class: 'mrow' }, `G = E/2(1+ν) = ${f(G)} GPa,  K = E/3(1−2ν) = ${f(K)} GPa,  λ = Eν/((1+ν)(1−2ν)) = ${f(L)} GPa`));
      const nus = linspace(-0.98, 0.485, 200);
      Plot.render(p.pR, {
        h: 280, aria: 'Elastic constants relative to E versus Poisson ratio',

          { name: 'K/E', color: 'c1', width: 2.5, data: nus.map(v => [v, 1 / (3 * (1 - 2 * v))]) },

      });
      drawSimpleTests(p.tests, { E: E * 1000, nu, G: G * 1000, K: K * 1000 }, S.load);
    }

    // strain energy of the selected material
    const m = getMat(S.mat), cu = idealCurve(m), Em = m.E * 1000;
    const UR = cu.sy * cu.ey / 2, Uf = curveArea(cu.pts);
    p.readouts(p.roS, [
      { k: 'Yield strain εy = σy/E', v: cu.ey * 100, u: '%' },
      { k: 'Resilience UR = σy²/2E', v: UR, u: 'MJ/m³', eq: '1.17' },

      { k: 'Uf / UR', v: Uf / UR },

      { k: 'Shear U = τ²/2G', v: S.load * S.load / (2 * Em / (2 * (1 + m.nu))), u: 'MJ/m³' },

    const elastic = cu.pts.filter(q => q[0] <= cu.ey + 1e-15);

    const me = lib.find(o => o.x.id === m.id);

      x: { label: 'Resilience UR (MJ/m³)', short: 'UR', log: true }, y: { label: 'Toughness Uf (MJ/m³)', short: 'Uf', log: true },
      series: Object.entries(byCls).map(([cls, os]) => ({ name: cls, type: 'scatter', color: colors[cls], r: 4.5, data: os.map(o => [o.UR, o.Uf]) })),
      marks: me ? [{ t: 'pt', x: me.UR, y: me.Uf, r: 7, hollow: true, color: 'accent', label: m.name, top: true }] : [], legend: 'br',
    });

    // engineering vs true
    const lam = S.lam, e = lam - 1, et = Math.log(lam);
    const ls = linspace(0.3, 3, 200);
    Plot.render(p.pT, {
      h: 240, aria: 'True strain versus engineering strain',
      x: { label: 'Engineering strain ε = λ − 1', short: 'ε', zero: true }, y: { label: 'Strain', short: 'ε', zero: true },
      series: [{ name: 'True strain ln(1 + ε)', color: 'accent', width: 2.5, data: ls.map(l => [l - 1, Math.log(l)]) }, { name: 'Engineering strain (y = x)', color: 'c6', dash: '5 4', data: ls.map(l => [l - 1, l - 1]) }],
      marks: [{ t: 'pt', x: e, y: et, r: 5, color: 'c4', label: `λ = ${fmt(lam, 3)}: ε = ${fmt(e, 3)}, εt = ${fmt(et, 3)}`, anchor: 'start', dx: 10, dy: 18, top: true }],
      legend: 'tl',
    });
  },
});

defineModule({
  id: 'ashby',
  title: 'Ashby Plots',
  eq: 'Figs. 1.14–1.15',
  lede: 'Plot whole families of materials on property charts, with log axes so that metals, polymers, foams and ceramics all fit. Guide lines pick out the best material for a light, stiff or strong part, and for damage tolerance.',
  theory: String.raw`
    <div><p>Material property charts cluster each family of materials as a bubble. Log scales are essential: moduli range over seven orders of magnitude, from foams and elastomers to diamond.</p>
      <p>For a part of fixed size and stiffness, the mass is minimized by maximizing a <i>material index</i>, which depends on how the part is loaded:</p>
      <div class="eq">\[ \text{tie: } \frac{E}{\rho},\qquad \text{beam: } \frac{E^{1/2}}{\rho},\qquad \text{plate: } \frac{E^{1/3}}{\rho} \]</div>
      <p class="eqn">and the same with strength σf in place of E for a part that must not fail: \(\sigma_f/\rho\), \(\sigma_f^{2/3}/\rho\), \(\sigma_f^{1/2}/\rho\)</p></div>
    <div><p>On log–log axes a constant index is a straight line: \(E^{1/n}/\rho = C\) is \(\log E = n\log\rho + n\log C\). Every material on the line performs equally well; materials above it are better.</p>
      <p>On the toughness–strength chart, \(K_{Ic}/\sigma_f\) sets the largest crack that can be tolerated before the material yields, \(a_c \approx \frac{1}{\pi}(K_{Ic}/\sigma_f)^2\), and \(K_{Ic}^2/\sigma_f\) governs leak-before-break of a pressure vessel (Ch. 6).</p>
      <p class="eqn">Bubbles show typical ranges for teaching, not design data</p></div>`,

  build(p) {
    p.group('Chart');
    p.sel('chart', { label: 'Properties', value: 'Erho', options: Object.entries(ASHBY_CHARTS).map(([k, v]) => [k, v.label]) });
    p.sel('index', { label: 'Design index', value: 'tie', options: Object.entries(ASHBY_CHARTS.Erho.idx).map(([k, v]) => [k, v.label]) });
    p.chk('labels', { label: 'Label the families', value: true });
    p.group('Guide line passes through');
    p.material({ help: 'Pick a material: the line runs through it, and everything above the line beats it.' });

    p.chartEl = p.panel('Chart', 'Notes Figs. 1.14–1.15');
    p.ro = p.panel('Selected material', '');
    p.rank = p.panel('Ranking by the design index', '');
    const cc = p.panel('Concept checks');
    cc.append(
      h('p', { class: 'concept' }, h('b', null, 'Same chemistry, far apart (1.3.4). '), 'Find polyethylene and Dyneema on the modulus–density chart. Why do they sit more than two orders of magnitude apart?'),
      h('p', { class: 'concept' }, h('b', null, 'Ties vs beams. '), 'For a light, stiff tie, steel and aluminum are about equal. Switch to the beam index: why does wood now beat both, and why is CFRP best for either?'),
      h('p', { class: 'concept' }, h('b', null, 'Strong but brittle. '), 'On the toughness–strength chart, why do ceramics sit low and to the right? What happens to the critical crack size for a high-strength steel compared with a mild steel?'),
      h('p', { class: 'concept' }, h('b', null, 'Log scales. '), 'Why would a linear scale hide almost every polymer and foam on these charts?'));
  },

  update(p) {
    const S = p.S, ch = ASHBY_CHARTS[S.chart];
    // keep the index menu in step with the chart
    const sel = p.controls.index.el, want = Object.keys(ch.idx);
    if ([...sel.options].map(o => o.value).join() !== want.join()) {
      sel.replaceChildren(...want.map(k => h('option', { value: k }, ch.idx[k].label)));
      if (!want.includes(S.index)) { sel.value = want[0]; p.S.index = want[0]; } else sel.value = S.index;
    }
    const ix = ch.idx[S.index] || ch.idx[want[0]];
    const L = ix.n, xs = ch.xs;
    const indexOf = (x, y) => y ** (1 / L) / (x / xs);
    const logE = (a, b) => [Math.log10(a), Math.log10(b)];
    // family bubbles
    const marks = [];
    for (const f of ASHBY_FAMILIES) {
      const [xr, yr] = ch.fam(f);
      const [lx0, lx1] = logE(...xr), [ly0, ly1] = logE(...yr);
      const cx = (lx0 + lx1) / 2, cy = (ly0 + ly1) / 2, rx = Math.max(0.05, (lx1 - lx0) / 2), ry = Math.max(0.05, (ly1 - ly0) / 2);
      const pts = Array.from({ length: 41 }, (_, i) => { const a = 2 * Math.PI * i / 40; return [10 ** (cx + rx * Math.cos(a)), 10 ** (cy + ry * Math.sin(a))]; });
      const col = ASHBY_COLORS[f.cls];
      marks.push({ t: 'poly', pts, fill: col, color: col, opacity: 0.22, width: 1 });
      if (S.labels) marks.push({ t: 'text', x: 10 ** cx, y: 10 ** cy, text: f.name, color: col, anchor: 'middle', size: 9.5, mono: false, dy: 3 });
    }
    // guide line through the selected material, with the better side shaded
    const mat = getMat(S.mat), mv = ch.lib(mat);
    const haveSel = mv.every(v => v > 0 && Number.isFinite(v));
    if (haveSel) {
      const [x0, y0] = mv, line = x => y0 * (x / x0) ** L;
      const xsL = linspace(Math.log10(ch.xr[0]), Math.log10(ch.xr[1]), 60).map(v => 10 ** v);
      const pts = xsL.map(x => [x, clamp(line(x), ch.yr[0], ch.yr[1])]);
      marks.unshift({ t: 'poly', pts: pts.concat([[ch.xr[1], ch.yr[1]], [ch.xr[0], ch.yr[1]]]), fill: 'accent', stroke: false, opacity: 0.06, skipBounds: true });
      marks.push({ t: 'poly', open: true, pts, color: 'accent', width: 2, dash: '7 5', skipBounds: true, top: true });
    }
    // library materials
    const lib = allMaterials().map(m => ({ m, v: ch.lib(m) })).filter(o => o.v.every(v => v > 0 && Number.isFinite(v)));
    const byCls = {}; lib.forEach(o => (byCls[o.m.cls] = byCls[o.m.cls] || []).push(o));
    const nearRight = haveSel && (Math.log10(mv[0]) - Math.log10(ch.xr[0])) / (Math.log10(ch.xr[1]) - Math.log10(ch.xr[0])) > 0.6;
    if (haveSel) marks.push({ t: 'pt', x: mv[0], y: mv[1], r: 7, hollow: true, color: 'accent', label: mat.name, top: true, anchor: nearRight ? 'end' : 'start', dx: nearRight ? -10 : 10 });
    Plot.render(p.chartEl, {
      h: Math.min(560, Math.max(380, (p.chartEl.clientWidth || 600) * 0.75)), aria: ch.label,
      x: { label: ch.xl, short: 'x', log: true, min: ch.xr[0], max: ch.xr[1] }, y: { label: ch.yl, short: 'y', log: true, min: ch.yr[0], max: ch.yr[1] },
      series: Object.entries(byCls).map(([cls, os]) => ({ name: 'Library: ' + cls, type: 'scatter', color: ASHBY_COLORS[cls] || 'c6', r: 3.5, data: os.map(o => [o.v[0], o.v[1]]) })),
      marks, legend: 'tl',
    });
    p.chartEl.previousElementSibling.firstChild.textContent = ch.label;

    const above = lib.filter(o => indexOf(...o.v) > (haveSel ? indexOf(...mv) * (1 + 1e-9) : Infinity));
    p.readouts(p.ro, haveSel ? [
      { k: 'Material', v: mat.name },
      { k: ch.xl.split(' (')[0], v: mv[0], u: ch.xl.match(/\((.*)\)/)[1] },
      { k: ch.yl.split(' (')[0], v: mv[1], u: ch.yl.match(/\((.*)\)/)[1] },
      { k: `Index ${ix.fmt}`, v: indexOf(...mv) },
      { k: 'Library materials above the line', v: String(above.length) },
    ] : [{ k: 'Material', v: `${mat.name} has no value for this chart`, cls: 'warn' }]);

    const ranked = lib.map(o => ({ ...o, I: indexOf(...o.v) })).sort((a, b) => b.I - a.I);
    const ref = haveSel ? indexOf(...mv) : NaN;
    p.rank.replaceChildren(h('div', { class: 'tscroll' }, h('table', { class: 't' },
      h('thead', null, h('tr', null, ['#', 'Material', 'Class', ix.fmt, 'vs selected'].map((x, i) => h('th', { class: i === 0 || i >= 3 ? 'num' : null, style: { textTransform: 'none', letterSpacing: '0' } }, x)))),
      h('tbody', null, ranked.map((o, i) => h('tr', { class: o.m.id === mat.id ? 'sel' : null, style: { cursor: 'pointer' }, onclick: () => { p.controls.mat.set(o.m.id); App.setMaterial(o.m.id); p.schedule(); } },
        h('td', { class: 'num' }, String(i + 1)), h('td', null, o.m.name), h('td', null, o.m.cls), h('td', { class: 'num' }, fmt(o.I, 3)),
        h('td', { class: 'num' }, Number.isFinite(ref) ? '×' + fmt(o.I / ref, 3) : '—')))))),
      h('p', { class: 'note' }, `Index computed with ${xs === 1000 ? 'ρ in Mg/m³ (= g/cm³)' : 'the chart units'}. Click a row to move the guide line to that material. Only materials with the needed properties are listed.`));
  },
});

const YK = ['mode', 'sx', 'sy', 'txy', 'p1', 'p2', 'p3', 'own', 'syt', 'syc'];
const yieldPreset = k => Object.assign({ mode: 'plane', sx: 0, sy: 0, txy: 0, p1: 0, p2: 0, p3: 0, own: false, syt: 250, syc: 250 }, YIELD_PRESETS[k]);

/* Each criterion as a ratio: < 1 safe, = 1 on the yield surface. All are of degree 1 in stress, so the factor of safety is 1/ratio. */
const YIELD_CRIT = {
  mn: { name: 'Maximum normal stress', eq: '4.1', color: 'c2', f: (a, b, c, Y) => Math.max(Math.max(a, b, c) / Y.t, -Math.min(a, b, c) / Y.c, 0) },
  tr: { name: 'Tresca (max shear)', eq: '4.2–4.3', color: 'c4', f: (a, b, c, Y) => (Math.max(a, b, c) - Math.min(a, b, c)) / Y.t },
  vm: { name: 'von Mises (distortion)', eq: '4.5–4.6', color: 'c1', f: (a, b, c, Y) => Math.sqrt(((a - b) ** 2 + (b - c) ** 2 + (c - a) ** 2) / 2) / Y.t },
};
/* Trace a yield surface in the (σa, σb) plane at fixed σc by marching rays out from a point inside it. */
function yieldLocus(f, c, Y, ctr) {
  const pts = [], big = 6 * Math.max(Y.t, Y.c);
  for (let i = 0; i <= 240; i++) {
    const a = 2 * Math.PI * i / 240, d = [Math.cos(a), Math.sin(a)];
    let lo = 0, hi = big;
    if (f(ctr[0] + d[0] * hi, ctr[1] + d[1] * hi, c, Y) < 1) { pts.push([NaN, NaN]); continue; }
    for (let k = 0; k < 50; k++) { const m = (lo + hi) / 2; if (f(ctr[0] + d[0] * m, ctr[1] + d[1] * m, c, Y) < 1) lo = m; else hi = m; }
    pts.push([ctr[0] + d[0] * lo, ctr[1] + d[1] * lo]);
  }
  return pts;
}

  theory: String.raw`
    <div><p>With principal stresses \(\sigma_1 \ge \sigma_2 \ge \sigma_3\), the three criteria say the material survives if</p>
      <div class="eq">\[ \text{Max normal: } \sigma_{yc} < \sigma_3 \le \sigma_1 < \sigma_{yt} \]</div>
