    p.num('Einf', { label: 'Parallel spring E∞', unit: 'MPa', min: 0.1, max: 10000, step: 0.1, value: 100, log: true });
    p.num('eta', { label: 'Dashpot η', unit: 'MPa·s', min: 0.01, max: 1e6, step: 0.01, value: 1000, log: true });
    p.group('Tests');
    p.num('s0', { label: 'Creep stress σ0', unit: 'MPa', min: 0.1, max: 100, step: 0.1, value: 10 });
    p.num('e0', { label: 'Relaxation strain ε0', unit: '%', min: 0.01, max: 10, step: 0.01, value: 1 });
    p.num('w', { label: 'Frequency ω for the loop', unit: 'rad/s', min: 1e-4, max: 1e4, step: 0.0001, value: 1, log: true });

    p.schem = h('div', { class: 'schem' });
    const two0 = h('div', { class: 'two' });
    p.out.append(two0);
    p.panel('Spring–dashpot model', '', two0).append(p.schem);
    p.ro = p.panel('Results', '', two0);
    const two = h('div', { class: 'two' });
    p.out.append(two);
    p.pC = p.panel('Creep at constant stress', '', two);
    p.pR = p.panel('Relaxation at constant strain', '', two);
    const two2 = h('div', { class: 'two' });

/* Stretch module: Rubber elasticity. Nominal (engineering) stress in MPa versus stretch λ.
   Built-in "test data" come from a three-term Ogden model typical of natural rubber, plus 2% scatter. */
const RUBBER_OGDEN = [[0.63, 1.3], [0.0012, 5.0], [-0.01, -2.0]];   // [μp (MPa), αp]
const RUBBER_MODES = {
  uni: { label: 'Uniaxial tension', lmax: 7.5,
    ogden: l => RUBBER_OGDEN.reduce((s, [m, a]) => s + m * (l ** (a - 1) - l ** (-a / 2 - 1)), 0),
    basis: l => [2 * (l - l ** -2), 2 * (l - l ** -2) / l] },          // P = C10·b0 + C01·b1
  bi: { label: 'Equibiaxial tension', lmax: 4.5,
    ogden: l => RUBBER_OGDEN.reduce((s, [m, a]) => s + m * (l ** (a - 1) - l ** (-2 * a - 1)), 0),
    basis: l => [2 * (l - l ** -5), 2 * (l - l ** -5) * l * l] },
  ps: { label: 'Pure shear', lmax: 5,
    ogden: l => RUBBER_OGDEN.reduce((s, [m, a]) => s + m * (l ** (a - 1) - l ** (-a - 1)), 0),
    basis: l => [2 * (l - l ** -3), 2 * (l - l ** -3)] },
};
const rubberData = (() => {
  const out = {};
  for (const [mode, M] of Object.entries(RUBBER_MODES)) {
    const r = rng(hashStr('rubber-' + mode));
    out[mode] = linspace(1.05, M.lmax, mode === 'uni' ? 22 : 16).map(l => [+l.toFixed(3), +(M.ogden(l) * (1 + 0.02 * randn(r))).toFixed(4)]);
  }
  return out;
})();
/* Least-squares fit of C10 (and C01) to one mode over λ ≤ lmax. */
function rubberFit(data, mode, model, lmax) {
  const pts = data.filter(q => q[0] > 1 && q[0] <= lmax), B = RUBBER_MODES[mode].basis;
  if (pts.length < 2) return null;
  let a = 0, b = 0, c = 0, d = 0, e = 0;
  for (const [l, P] of pts) { const [b0, b1] = B(l); a += b0 * b0; b += b0 * b1; c += b1 * b1; d += b0 * P; e += b1 * P; }
  let C10, C01 = 0;
  if (model === 'neo') C10 = d / a;
  else { const det = a * c - b * b; C10 = (d * c - b * e) / det; C01 = (a * e - b * d) / det; }
  const pred = l => { const [b0, b1] = B(l); return C10 * b0 + C01 * b1; };
  const mean = pts.reduce((s, q) => s + q[1], 0) / pts.length;
  const ssr = pts.reduce((s, q) => s + (q[1] - pred(q[0])) ** 2, 0), sst = pts.reduce((s, q) => s + (q[1] - mean) ** 2, 0);
  return { C10, C01, R2: 1 - ssr / sst, n: pts.length };
}
const rubberModel = (mode, C10, C01) => l => { const [b0, b1] = RUBBER_MODES[mode].basis(l); return C10 * b0 + C01 * b1; };

/* Stretch module: Necking and the Considère criterion. Hollomon σt = K εt^n; stresses MPa. */
/* Strain in the thinner section b of a bar with a small area defect f, given the strain εa in the rest:
   equal force, (1 − f) K εb^n e^(−εb) = K εa^n e^(−εa). Returns NaN once section b can no longer carry the load. */
function neckStrain(ea, n, f) {
  const g = e => (1 - f) * e ** n * Math.exp(-e), target = ea ** n * Math.exp(-ea);
  if (g(n) < target) return NaN;                     // past the load maximum of the weak section: it has necked
  let lo = ea, hi = n;                               // the weak section is always further along, but below its own maximum
  if (lo > hi) return NaN;
  for (let i = 0; i < 80; i++) { const m = (lo + hi) / 2; if (g(m) < target) lo = m; else hi = m; }   // g rises up to e = n
  return (lo + hi) / 2;
}

defineModule({
  id: 'necking',
  title: 'Necking & the Considère Criterion',
  eq: '',
  lede: 'A tensile bar stretches evenly until one section starts to thin faster than the rest. Find where that happens from the hardening curve, see why it sits at the peak of the engineering curve, and watch a tiny flaw in the cross-section pull the strain into one place.',
  theory: String.raw`
    <div><p>In tension the force is \(F = \sigma_t A\). Hardening raises \(\sigma_t\) while the area \(A\) shrinks; at constant volume \(dA/A = -d\varepsilon_t\). The force stops rising, and any section that thins a little more than the rest can no longer be stabilised by hardening, when \(dF = 0\):</p>
      <div class="eq">\[ \frac{d\sigma_t}{d\varepsilon_t} = \sigma_t \]</div>
      <p class="eqn">the Considère criterion: necking starts where the hardening rate falls to the current true stress</p>
      <p>For a Hollomon material \(\sigma_t = K\varepsilon_t^{\,n}\) this gives the uniform true strain directly:</p>
      <div class="eq">\[ \varepsilon_{t,u} = n,\qquad \sigma_{UTS} = K n^n e^{-n} \]</div></div>
    <div><p>In engineering strain \(e\), with \(\sigma_t = \sigma(1 + e)\), the same condition reads \(d\sigma_t/de = \sigma_t/(1 + e)\): the tangent to the true stress curve drawn from the point \(e = -1\) (Considère’s construction). It touches the curve at the maximum of the engineering stress, the UTS.</p>
      <p>Real bars are never perfectly uniform. If one section has an area smaller by a fraction \(f\), it carries the same force at a higher stress, strains more, and reaches its own load maximum first. The rest of the bar then unloads and the strain localises in the neck. A larger \(n\) delays that and spreads the deformation, which is why high-\(n\) metals form well.</p></div>`,

/* Stretch module: Strain-rate and temperature effects. Johnson–Cook flow stress, MPa; temperatures K; rates 1/s.
   Parameter sets are typical published fits, for teaching. */
const JC_SETS = {
  cu: { label: 'OFHC copper', A: 90, B: 292, n: 0.31, C: 0.025, m: 1.09, Tm: 1356 },
  st4340: { label: '4340 steel', A: 792, B: 510, n: 0.26, C: 0.014, m: 1.03, Tm: 1793 },
  al2024: { label: '2024-T351 aluminum', A: 265, B: 426, n: 0.34, C: 0.015, m: 1.0, Tm: 775 },
  ti64: { label: 'Ti-6Al-4V', A: 1098, B: 1092, n: 0.93, C: 0.014, m: 1.1, Tm: 1878 },
};
const JC_TR = 293, JC_RATE0 = 1;   // reference temperature (K) and strain rate (1/s)
function jcStress(P, ep, rate, T) {
  const Ts = clamp((T - JC_TR) / (P.Tm - JC_TR), 0, 1);
  return (P.A + P.B * Math.max(ep, 0) ** P.n) * (1 + P.C * Math.log(Math.max(rate, 1e-12) / JC_RATE0)) * (1 - Ts ** P.m);
}

/* Stretch module: Bauschinger effect. 1D elastoplasticity with mixed linear hardening (return mapping). MPa, strain dimensionless. */
/* Strain-controlled cycles between ±ea (starting in tension). beta = 1 isotropic, 0 kinematic. Returns the σ–ε path. */
function cyclicPath(P, ea, cycles) {
  const E = P.E, H = P.H, beta = P.beta, out = [[0, 0]];
  let eps = 0, ep = 0, alpha = 0, R = 0;
  const targets = [];
  for (let c = 0; c < cycles; c++) targets.push(ea, -ea);
  targets.push(0);
  const step = ea / 120;
  for (const tgt of targets) {
    const dir = Math.sign(tgt - eps) || 1;
    while (dir * (tgt - eps) > 1e-12) {
      eps += dir * Math.min(step, Math.abs(tgt - eps));
      let sig = E * (eps - ep);                                   // trial
      const f = Math.abs(sig - alpha) - (P.sy + R);
      if (f > 0) {
        const dg = f / (E + H), n = Math.sign(sig - alpha);
        ep += dg * n; alpha += (1 - beta) * H * dg * n; R += beta * H * dg;
        sig = E * (eps - ep);
      }
      out.push([eps, sig]);
    }
  }
  return { path: out, alpha, R };
}

defineModule({
  id: 'bauschinger',
  title: 'Bauschinger Effect',
  eq: '',
  lede: 'Pull a metal past yield, then push it back, and it yields in compression sooner than it did at first. Compare isotropic and kinematic hardening, two ways of describing how the yield surface changes, and see which one matches the reverse yield of a real metal.',
  theory: String.raw`
    <div><p>Plastic straining builds up dislocation tangles and internal back-stresses. They resist further flow in the same direction but help flow in the reverse direction, so after a tensile prestrain the compressive yield stress is smaller in magnitude than the tensile one: the <i>Bauschinger effect</i>.</p>
      <p>In one dimension the yield condition is \(|\sigma - \alpha| = \sigma_y + R\), where \(R\) grows the elastic range (isotropic hardening) and the back-stress \(\alpha\) shifts its centre (kinematic hardening). With a plastic modulus \(H\) split by a fraction \(\beta\):</p>
      <div class="eq">\[ dR = \beta H\,|d\varepsilon_p|,\qquad d\alpha = (1 - \beta)H\,d\varepsilon_p \]</div></div>
    <div><p>After loading to a stress \(\sigma_{max}\), the reverse yield stress is</p>
      <div class="eq">\[ \sigma_{rev} = \alpha - (\sigma_y + R) \]</div>
      <ul><li><b>Isotropic</b> (\(\beta = 1\)): the elastic range grows equally both ways, \(\sigma_{rev} = -\sigma_{max}\). No Bauschinger effect.</li>
        <li><b>Kinematic</b> (\(\beta = 0\)): the elastic range keeps its size \(2\sigma_y\) and moves, \(\sigma_{rev} = \sigma_{max} - 2\sigma_y\).</li></ul>
      <p>Most metals sit between the two. Kinematic hardening also lets a cyclic loop stabilise, which matters for low-cycle fatigue and for springback after sheet forming.</p></div>`,

      h('p', { class: 'concept' }, h('b', null, 'Springback. '), 'A bent sheet springs back when released. Why does a model with only isotropic hardening predict the wrong springback after reverse bending?'),
      h('p', { class: 'concept' }, h('b', null, 'Measuring β. '), 'How would you design a test to find the fraction of isotropic hardening of a steel?'));
  },

  update(p) {
    const S = p.S, ea = S.ea / 100, base = { E: S.E * 1000, sy: S.sy, H: S.H };
    const run = beta => cyclicPath(Object.assign({}, base, { beta }), ea, S.cycles);
    const mine = run(S.beta), kin = run(0), iso = run(1);
    Plot.render(p.pL, {
      h: 290, aria: 'Cyclic stress strain loops',
      x: { label: 'Strain (%)', short: 'ε' }, y: { label: 'Stress (MPa)', short: 'σ' },
      series: [{ name: 'kinematic (β = 0)', color: 'c3', width: 1.4, dash: '5 4', data: kin.path.map(q => [100 * q[0], q[1]]) },
        { name: 'isotropic (β = 1)', color: 'c6', width: 1.4, dash: '2 3', data: iso.path.map(q => [100 * q[0], q[1]]) },
        { name: `yours (β = ${fmt(S.beta, 2)})`, color: 'accent', width: 2.6, data: mine.path.map(q => [100 * q[0], q[1]]) }],
      legend: 'tl',

    // after the first tensile branch: stress at reversal and the elastic range

/* Stretch module: Hardness and nanoindentation. Brinell/Vickers in kgf and mm; Oliver–Pharr in mN, nm, GPa. */
const KGF = 9.80665;
const OP = { eps: 0.75, beta: 1.034, Ei: 1141, nui: 0.07, area: 24.5 };   // Berkovich tip: ε, β, diamond E (GPa) and ν, ideal area constant
/* Simulated Berkovich load–unload curve for a material with modulus E (GPa), ν and hardness H (GPa). */
function indentCurve(E, nu, H, Pmax, mExp, noise, seed) {
  const Er = 1 / ((1 - nu * nu) / E + (1 - OP.nui ** 2) / OP.Ei);                // GPa
  const A = Pmax * 1e-3 / (H * 1e9) * 1e18;                                      // nm²  (Pmax in mN)
  const hc = Math.sqrt(A / OP.area), S = 2 * OP.beta * Er * 1e9 * Math.sqrt(A * 1e-18) / Math.sqrt(Math.PI);   // N/m
  const Smn = S * 1e-6;                                                          // N/m → mN/nm
  const hmax = hc + OP.eps * Pmax / Smn, hf = hmax - mExp * Pmax / Smn;
  const r = rng(seed), load = [], unload = [];
  for (const t of linspace(0, 1, 60)) { const hh = hmax * t; load.push([hh, Pmax * t * t * (1 + noise * randn(r) * 0.01)]); }
  for (const t of linspace(1, 0, 60)) { const hh = hf + (hmax - hf) * t; unload.push([hh, Pmax * t ** mExp * (1 + noise * randn(r) * 0.01)]); }
  return { load, unload, hmax, hf, hc, Er };
}
/* Oliver–Pharr analysis: fit P = a (h − hf)^m to the top half of the unloading data by a log-linear scan over hf. */
function oliverPharr(unload, Pmax, hmax, nu) {
  const pts = unload.filter(q => q[1] > 0.5 * Pmax);
  let best = null;
  const hmin = Math.min(...unload.map(q => q[0]));
  for (let i = 0; i <= 400; i++) {
    const hf = hmin - 0.2 * (hmax - hmin) + (hmax - hmin) * 1.1 * i / 400;
    const xy = pts.filter(q => q[0] > hf && q[1] > 0).map(q => [Math.log(q[0] - hf), Math.log(q[1])]);
    if (xy.length < 5) continue;
    const n = xy.length, sx = xy.reduce((s, q) => s + q[0], 0), sy = xy.reduce((s, q) => s + q[1], 0), sxx = xy.reduce((s, q) => s + q[0] * q[0], 0), sxy = xy.reduce((s, q) => s + q[0] * q[1], 0);
    const m = (n * sxy - sx * sy) / (n * sxx - sx * sx), b = (sy - m * sx) / n;
    const res = xy.reduce((s, q) => s + (q[1] - (b + m * q[0])) ** 2, 0);
    if (m > 1 && m < 2.5 && (!best || res < best.res)) best = { hf, m, a: Math.exp(b), res };
  }
  if (!best) return null;
  const S = best.m * best.a * (hmax - best.hf) ** (best.m - 1);          // mN/nm
  const hc = hmax - OP.eps * Pmax / S, A = OP.area * hc * hc;            // nm²
  const H = Pmax / A * 1e6;                                               // mN/nm² → GPa
  const Er = Math.sqrt(Math.PI) / (2 * OP.beta) * S / Math.sqrt(A) * 1e6;    // mN/nm² → GPa
  const E = (1 - nu * nu) / (1 / Er - (1 - OP.nui ** 2) / OP.Ei);
  return { S, hc, A, H, Er, E, fit: best };
}

/* Failure index along a stress state: ≥ 1 means failure. Plane stress (σ1, σ2) in any order. */
const FC_CRIT = {
  tresca: { label: 'Tresca (σy = σt)', color: 'c6', f: (a, b, P) => Math.max(Math.abs(a), Math.abs(b), Math.abs(a - b)) / P.st },
  mc: { label: 'Mohr–Coulomb', color: 'c4', f: (a, b, P) => { const s1 = Math.max(a, b), s3 = Math.min(a, b, 0), s1p = Math.max(s1, 0); return s1p / P.st - s3 / P.sc; } },
  dp: { label: 'Drucker–Prager', color: 'c3', f: (a, b, P) => { const B = (P.sc - P.st) / (Math.sqrt(3) * (P.sc + P.st)), A0 = 2 * P.sc * P.st / (Math.sqrt(3) * (P.sc + P.st));

function fcLambda(fn, a, b, P) {

  lede: 'Yield is the stress at which dislocations move freely. Make them harder to move with smaller grains, particles, or more dislocations, and see how much each adds. Start from a single crystal and Schmid’s law, then build up the yield strength of an alloy.',
  theory: String.raw`
    <div><p>A single crystal slips when the shear stress resolved on a slip plane, in a slip direction, reaches the critical value \(\tau_{CRSS}\). For a tensile stress \(\sigma\) at angle \(\phi\) to the plane normal and \(\lambda\) to the slip direction (Schmid’s law):</p>
      <div class="eq">\[ \tau = \sigma\cos\phi\cos\lambda = m\,\sigma,\qquad \sigma_y = \frac{\tau_{CRSS}}{m_{max}} \]</div>
      <p class="eqn">the Schmid factor m is at most 0.5; in a polycrystal the average is replaced by the Taylor factor, σ = M τ with M ≈ 3.06 for FCC</p></div>
    <div><p>In a polycrystal the obstacles add up. Grain boundaries block slip (Hall–Petch); a network of other dislocations of density \(\rho\) pins them (Taylor hardening); small particles are cut (shearing, which grows with particle size) and large ones must be looped around (Orowan, which falls with spacing):</p>
      <div class="eq">\[ \sigma_y = \sigma_0 + \frac{k}{\sqrt d} + M\alpha Gb\sqrt\rho + \Delta\sigma_p,\qquad \Delta\sigma_{Orowan} = \frac{MGb}{L},\quad L \approx r\sqrt{\frac{2\pi}{3f}} \]</div>
      <p>The particle contribution is the smaller of the cutting and looping stresses, so it peaks at the radius where they cross. That is the peak of an age-hardening curve: under-aged alloys have small particles that are cut, over-aged alloys have large, widely spaced particles that are bypassed.</p></div>`,

  build(p) {
    p.group('Single crystal (FCC)');
    p.num('u', { label: 'Loading axis [u', min: -5, max: 5, step: 1, value: 1 });
    p.num('v', { label: 'v', min: -5, max: 5, step: 1, value: 2 });
    p.num('w', { label: 'w]', min: -5, max: 5, step: 1, value: 3 });
    p.group('Alloy');
    p.sel('preset', { label: 'Base metal', value: 'al', options: [['custom', 'Custom']].concat(Object.entries(STR_PRESETS).map(([k, v]) => [k, v.label])),
      onset: v => { const q = STR_PRESETS[v]; if (!q) return; for (const k of ['s0', 'kHP', 'G', 'b', 'tcrss']) if (!p.locked.has(k)) p.controls[k].set(q[k]); } });
    p.num('s0', { label: 'Friction stress σ0', unit: 'MPa', min: 0, max: 500, step: 1, value: 20 });
    p.num('kHP', { label: 'Hall–Petch k', unit: 'MPa√m', min: 0, max: 2, step: 0.01, value: 0.07 });
    p.num('G', { label: 'Shear modulus G', unit: 'GPa', min: 5, max: 200, step: 1, value: 26 });
    p.num('b', { label: 'Burgers vector b', unit: 'nm', min: 0.1, max: 0.5, step: 0.001, value: 0.286 });
    p.num('tcrss', { label: 'Single-crystal τCRSS', unit: 'MPa', min: 0.1, max: 200, step: 0.1, value: 1, log: true });
    p.group('Microstructure');
    p.num('d', { label: 'Grain size d', unit: 'µm', min: 0.01, max: 1000, step: 0.01, value: 30, log: true });
    p.num('rho', { label: 'Dislocation density ρ', unit: 'm⁻²', min: 1e10, max: 1e16, step: 1e10, value: 1e13, log: true, help: 'Annealed ≈ 10¹⁰–10¹², heavily cold-worked ≈ 10¹⁵–10¹⁶.' });
    p.num('f', { label: 'Particle volume fraction f', unit: '%', min: 0, max: 20, step: 0.1, value: 2 });
    p.num('r', { label: 'Particle radius r', unit: 'nm', min: 0.5, max: 500, step: 0.5, value: 10, log: true });
    p.num('rc', { label: 'Cut-to-bypass radius', unit: 'nm', min: 1, max: 50, step: 0.5, value: 5, help: 'Particles smaller than this are sheared. Sets the cutting curve so the two meet here.' });

    const two = h('div', { class: 'two' });
    p.out.append(two);
    p.ro1 = p.panel('Schmid factors for this axis', '', two);
    p.pB = p.panel('Yield strength, built up', '', two);
    const two2 = h('div', { class: 'two' });
    p.out.append(two2);
    p.pH = p.panel('Hall–Petch: strength vs grain size', '', two2);
    p.pP = p.panel('Particles: cut or bypass (ageing curve)', '', two2);
    p.ro = p.panel('Contributions', '');
    const cc = p.panel('Concept checks');
    cc.append(
      h('p', { class: 'concept' }, h('b', null, 'Easy and hard axes. '), 'Load the crystal along [001], then [111]. Which axis has the larger maximum Schmid factor, and which crystal is stronger?'),
      h('p', { class: 'concept' }, h('b', null, 'Grain refinement. '), 'Halve the grain size of the steel. How much does the yield strength go up? Why is grain refinement the only mechanism that also raises toughness?'),
      h('p', { class: 'concept' }, h('b', null, 'Peak ageing. '), 'Keep f fixed and grow the particles. Why does the strength rise and then fall?'),
      h('p', { class: 'concept' }, h('b', null, 'Cold work. '), 'Raise ρ from 10¹² to 10¹⁵ m⁻². How much stronger is the metal, and what does it cost in ductility?'));
  },

  update(p) {
    const S = p.S;
    const match = Object.entries(STR_PRESETS).find(([, q]) => ['s0', 'kHP', 'G', 'b', 'tcrss'].every(k => Math.abs(q[k] - S[k]) < 1e-9)), want = match ? match[0] : 'custom';
    if (S.preset !== want) p.controls.preset.set(want);
    const axis = [S.u, S.v, S.w], zero = axis.every(x => x === 0);
    const sf = zero ? [] : schmidFactors(axis).sort((a, b) => b.m - a.m), mmax = sf.length ? sf[0].m : NaN;
    const fmtV = v => '[' + v.map(x => x < 0 ? '−' + -x : x).join(' ') + ']', fmtP = v => '(' + v.map(x => x < 0 ? '−' + -x : x).join(' ') + ')';
    p.readouts(p.ro1, zero ? [{ k: 'Loading axis', v: 'enter a non-zero direction', cls: 'bad' }] : [
      { k: 'Highest Schmid factor', v: mmax },
      { k: 'Most stressed system', v: `${fmtP(sf[0].n)} ${fmtV(sf[0].d)}` },
      { k: 'Systems sharing the maximum', v: String(sf.filter(q => Math.abs(q.m - mmax) < 1e-6).length) },
      { k: 'Single-crystal yield τCRSS / m', v: S.tcrss / mmax, u: 'MPa' },
    ]);
    const Gp = S.G * 1000, bm = S.b * 1e-9, M = TAYLOR_M, alpha = 0.3, fr = S.f / 100;
    const sHP = S.kHP / Math.sqrt(S.d * 1e-6), sT = M * alpha * Gp * bm * Math.sqrt(S.rho);
    const orowan = r => fr > 0 ? M * Gp * S.b / (r * Math.sqrt(2 * Math.PI / (3 * fr))) : 0;      // r and b both in nm
    const cutK = fr > 0 ? orowan(S.rc) / Math.sqrt(S.rc) : 0, cut = r => cutK * Math.sqrt(r);      // ∝ √r at fixed f, meets Orowan at rc
    const sP = Math.min(cut(S.r), orowan(S.r)), mode = cut(S.r) < orowan(S.r) ? 'cut (sheared)' : 'bypassed (Orowan)';
    const total = S.s0 + sHP + sT + sP;
    const parts = [['σ0', S.s0, 'c6'], ['grain size', sHP, 'c3'], ['dislocations', sT, 'c2'], ['particles', sP, 'c4']];
    let acc = 0;
    Plot.render(p.pB, {
      h: 270, aria: 'Stacked yield strength contributions',
      x: { label: '', min: 0, max: 3, ticks: [] }, y: { label: 'Yield strength (MPa)', short: 'σy', min: 0, max: total * 1.15 },
      series: [],
      marks: parts.flatMap(([lab, v, col]) => { const y0 = acc; acc += v; return [{ t: 'poly', pts: [[0.8, y0], [2.2, y0], [2.2, acc], [0.8, acc]], fill: col, color: col, opacity: 0.55 }, { t: 'text', x: 2.3, y: (y0 + acc) / 2, dy: 4, label: `${lab}: ${fmt(v, 3)}` }]; })
        .concat([{ t: 'text', x: 1.5, y: total, dy: -8, anchor: 'middle', label: `σy ≈ ${fmt(total, 3)} MPa` }]),
      legend: false,
    });
    const ds = linspace(-2, 3, 120).map(e => 10 ** e);
    Plot.render(p.pH, {
      h: 260, aria: 'Hall-Petch strength versus grain size',
      x: { label: 'd^(−1/2) (µm^(−1/2))', short: 'd⁻½', min: 0 }, y: { label: 'σ0 + k/√d (MPa)', short: 'σ', min: 0 },
      series: [{ name: 'Hall–Petch', color: 'c3', width: 2.5, data: ds.map(d => [1 / Math.sqrt(d), S.s0 + S.kHP / Math.sqrt(d * 1e-6)]) }],
      marks: [{ t: 'pt', x: 1 / Math.sqrt(S.d), y: S.s0 + sHP, r: 5, color: 'c4', label: `d = ${fmt(S.d, 3)} µm`, top: true }],
      legend: false,
    });
    const rs = linspace(-0.3, Math.log10(500), 160).map(e => 10 ** e);
    Plot.render(p.pP, {
      h: 260, aria: 'Particle strengthening versus particle radius',
      x: { label: 'Particle radius r (nm)', log: true, short: 'r' }, y: { label: 'Δσ from particles (MPa)', short: 'Δσ', min: 0, max: Math.max(1, 1.4 * orowan(S.rc)) },
      series: [{ name: 'cutting', color: 'c3', width: 1.4, dash: '5 4', data: rs.map(r => [r, cut(r)]) }, { name: 'Orowan bypass', color: 'c5', width: 1.4, dash: '5 4', data: rs.map(r => [r, orowan(r)]) },
        { name: 'smaller of the two', color: 'c4', width: 2.6, data: rs.map(r => [r, Math.min(cut(r), orowan(r))]) }],
      marks: [{ t: 'pt', x: S.r, y: sP, r: 5, color: 'accent', top: true }, { t: 'vline', x: S.rc, color: 'c2', label: 'peak' }],
      legend: 'tr',
    });
    p.readouts(p.ro, [
      { k: 'Friction stress σ0', v: S.s0, u: 'MPa' }, { k: 'Grain boundaries k/√d', v: sHP, u: 'MPa' },
      { k: 'Dislocations MαGb√ρ (α = 0.3)', v: sT, u: 'MPa' }, { k: `Particles (${fr > 0 ? mode : 'none'})`, v: sP, u: 'MPa' },
      { k: 'Particle spacing L', v: fr > 0 ? S.r * Math.sqrt(2 * Math.PI / (3 * fr)) : '—', u: fr > 0 ? 'nm' : '' },
      { k: 'Estimated yield strength', v: total, u: 'MPa' },
    ]);
  },
});

/* Stretch module: Notches and stress concentration in finite parts. Lengths mm, stresses MPa.
   Kt values are based on the net section. */
/* Shallow notch (elliptical, depth t, root radius r) and deep notch (hyperbolic, net half-width a): Neuber's results for tension,
   combined into one estimate for a flat bar with two opposite U-notches. */
const ktShallow = (t, r) => 1 + 2 * Math.sqrt(t / r);
const ktDeep = (a, r) => { const q = Math.sqrt(a / r); return 2 * (a / r + 1) * q / ((a / r + 1) * Math.atan(q) + q); };
const ktGroove = (t, r, a) => { const s = ktShallow(t, r) - 1, d = ktDeep(a, r) - 1; return 1 + s * d / Math.sqrt(s * s + d * d); };
/* Central hole of diameter dh in a strip of width W, net section (from the gross-section Heywood fit used in the Finite Element Plate module). */
const ktHoleNet = dW => heywoodKt(dW) * (1 - dW);
/* Notch sensitivity for steels: q = 1/(1 + ρ'/r), with the material length ρ' from the tensile strength. */
const notchLength = su => 0.0254 * (2070 / su) ** 1.8;   // mm, empirical fit for steels

defineModule({
  id: 'notch',
  title: 'Notches & Kt Charts',
  eq: '',
  lede: 'Real parts have holes, grooves and shoulders, and their width is finite. Build your own stress-concentration chart for a grooved bar and a plate with a hole, see why a sharp notch hurts less in fatigue than its Kt suggests, and estimate the local stress once the notch root yields.',
  theory: String.raw`
    <div><p>A notch of depth \(t\) and root radius \(r\) behaves like an elliptical hole when it is shallow and like a deep hyperbolic notch when the remaining ligament \(2a\) is narrow. Neuber’s results for the two limits, in tension, combined into one estimate:</p>
      <div class="eq">\[ K_{ts} = 1 + 2\sqrt{\frac{t}{r}},\qquad K_{td} = \frac{2\left(\frac{a}{r} + 1\right)\sqrt{\frac{a}{r}}}{\left(\frac{a}{r} + 1\right)\arctan\sqrt{\frac{a}{r}} + \sqrt{\frac{a}{r}}},\qquad K_t = 1 + \frac{(K_{ts}-1)(K_{td}-1)}{\sqrt{(K_{ts}-1)^2 + (K_{td}-1)^2}} \]</div>
      <p class="eqn">net-section Kt; a classic estimate that follows the trends of standard charts and usually sits somewhat above them, so it errs on the safe side</p>
      <p>For a central hole in a strip, the finite width raises the peak above the infinite-plate value of 3 when it is based on the gross stress, and lowers it below 3 when based on the net stress.</p></div>
    <div><p>In fatigue a very sharp notch does less damage than \(K_t\) predicts, because the high stress acts over a tiny volume. The fatigue notch factor uses a notch sensitivity \(q\) between 0 and 1:</p>
      <div class="eq">\[ K_f = 1 + q(K_t - 1),\qquad q = \frac{1}{1 + \rho'/r} \]</div>
      <p>If the notch root yields, \(\sigma_{loc} = K_tS\) is no longer right. Neuber’s rule keeps the product of local stress and strain equal to its elastic value, and the local state is where that hyperbola meets the stress–strain curve:</p>
      <div class="eq">\[ \sigma_{loc}\,\varepsilon_{loc} = \frac{(K_tS)^2}{E} \]</div></div>`,

  build(p) {
    p.group('Geometry');
    p.seg('geo', { label: 'Feature', value: 'groove', options: [['groove', 'Grooved bar (two U-notches)'], ['hole', 'Plate with a central hole']] });
    p.num('D', { label: 'Full width D (or W)', unit: 'mm', min: 2, max: 500, step: 0.5, value: 50 });
    p.num('dn', { label: 'Net width d (groove)', unit: 'mm', min: 0.5, max: 499, step: 0.5, value: 40 });
    p.num('r', { label: 'Root radius r (or hole radius)', unit: 'mm', min: 0.01, max: 100, step: 0.01, value: 2, log: true });
    p.group('Load and material');
    p.num('S', { label: 'Net-section stress S', unit: 'MPa', min: 1, max: 1000, step: 1, value: 150 });
    p.material({ filter: m => m.cls === 'Metal' });

    const two = h('div', { class: 'two' });
    p.out.append(two);
    p.pK = p.panel('Your Kt chart', '', two);
    p.ro = p.panel('Results', '', two);
    const two2 = h('div', { class: 'two' });
    p.out.append(two2);
    p.pQ = p.panel('Notch sensitivity: Kt vs Kf', '', two2);
    p.pN = p.panel('Neuber’s rule at the notch root', '', two2);
    const cc = p.panel('Concept checks');
    cc.append(
      h('p', { class: 'concept' }, h('b', null, 'Bigger radius. '), 'Double the root radius. How much does Kt drop? Why do designers specify generous fillet radii?'),
      h('p', { class: 'concept' }, h('b', null, 'Sharp but harmless? '), 'Make the radius very small. Kt keeps climbing, but Kf levels off. Why?'),
      h('p', { class: 'concept' }, h('b', null, 'Strong steels. '), 'Compare q for a mild steel and a high-strength steel at the same radius. Which is more notch sensitive?'),
      h('p', { class: 'concept' }, h('b', null, 'After yield. '), 'Raise S until the notch root yields. Is the local stress from Neuber’s rule higher or lower than KtS, and the local strain?'));
  },

  update(p) {
    const S = p.S, m = getMat(S.mat), E = m.E * 1000, groove = S.geo === 'groove';
    p.controls.dn.wrap.hidden = !groove;
    let Kt, note;
    if (groove) { const dn = Math.min(S.dn, S.D - 0.01), t = (S.D - dn) / 2; Kt = ktGroove(t, S.r, dn / 2); note = `t = ${fmt(t, 3)} mm, a = ${fmt(dn / 2, 3)} mm`; }
    else { const dW = Math.min(2 * S.r / S.D, 0.95); Kt = ktHoleNet(dW); note = `d/W = ${fmt(dW, 3)}`; }
    const rho = notchLength(m.su), q = 1 / (1 + rho / S.r), Kf = 1 + q * (Kt - 1);
    // chart: Kt vs r/d for several D/d (groove) or vs d/W (hole)
    if (groove) {
      const dn = Math.min(S.dn, S.D - 0.01), rds = linspace(-2.3, -0.3, 120).map(e => 10 ** e), ratios = [1.05, 1.1, 1.25, 1.5, 2, 3];
      Plot.render(p.pK, {
        h: 280, aria: 'Stress concentration factor for a grooved bar versus root radius',
        x: { label: 'r / d', log: true, short: 'r/d' }, y: { label: 'Kt (net)', short: 'Kt', min: 1 },
        series: ratios.map((R, i) => ({ name: `D/d = ${R}`, color: ['c6', 'c5', 'c3', 'accent', 'c2', 'c4'][i], width: 1.8, data: rds.map(x => [x, ktGroove((R - 1) / 2, x, 0.5)]) })),
        marks: [{ t: 'pt', x: S.r / dn, y: Kt, r: 5.5, color: 'c4', label: 'yours', top: true }],
        legend: 'tr',
      });
    } else {
      const dws = linspace(0.01, 0.8, 120);
      Plot.render(p.pK, {
        h: 280, aria: 'Stress concentration factor for a hole in a strip versus d over W',
        x: { label: 'Hole diameter / width d/W', short: 'd/W', min: 0, max: 0.8 }, y: { label: 'Kt', short: 'Kt', min: 1 },
        series: [{ name: 'gross section', color: 'c5', width: 2, data: dws.map(x => [x, heywoodKt(x)]) }, { name: 'net section', color: 'accent', width: 2.4, data: dws.map(x => [x, ktHoleNet(x)]) }],
        marks: [{ t: 'hline', y: 3, color: 'c6', label: 'infinite plate: 3' }, { t: 'pt', x: Math.min(2 * S.r / S.D, 0.95), y: Kt, r: 5.5, color: 'c4', label: 'yours', top: true }],
        legend: 'tl',
      });
    }
    const rs = linspace(-2, 1.5, 120).map(e => 10 ** e);
    const KtOf = r => groove ? ktGroove((S.D - Math.min(S.dn, S.D - 0.01)) / 2, r, Math.min(S.dn, S.D - 0.01) / 2) : ktHoleNet(Math.min(2 * r / S.D, 0.95));
    Plot.render(p.pQ, {
      h: 260, aria: 'Theoretical and fatigue stress concentration versus root radius',
      x: { label: 'Root radius r (mm)', log: true, short: 'r' }, y: { label: 'Factor', short: 'K', min: 1 },
      series: [{ name: 'Kt', color: 'c6', width: 2, data: rs.map(r => [r, KtOf(r)]) }, { name: 'Kf = 1 + q(Kt − 1)', color: 'c4', width: 2.5, data: rs.map(r => [r, 1 + (KtOf(r) - 1) / (1 + rho / r)]) }],
      marks: [{ t: 'pt', x: S.r, y: Kf, r: 5, color: 'c4', top: true }, { t: 'vline', x: rho, color: 'c2', label: 'ρ′' }],
      legend: 'tr',
    });
    // Neuber: σ ε = (Kt S)²/E with Ramberg–Osgood ε = σ/E + 0.002 (σ/σy)^nRO
    const nRO = 1 / clamp(m.n || 0.15, 0.04, 0.5), eps = s => s / E + 0.002 * (s / m.sy) ** nRO, C = (Kt * S.S) ** 2 / E;
    let lo = 0, hi = Kt * S.S; for (let i = 0; i < 80; i++) { const mid = (lo + hi) / 2; if (mid * eps(mid) < C) lo = mid; else hi = mid; }
    const sN = (lo + hi) / 2, eN = eps(sN), sMax = Math.max(1.3 * Kt * S.S, 1.3 * m.sy);
    const ss = linspace(0, sMax, 200);
    Plot.render(p.pN, {
      h: 260, aria: 'Neuber hyperbola and stress strain curve',
      x: { label: 'Local strain (%)', short: 'ε', min: 0, max: 100 * Math.max(eps(sMax) * 0.6, 1.5 * eN, 1.5 * Kt * S.S / E) }, y: { label: 'Local stress (MPa)', short: 'σ', min: 0, max: sMax },
      series: [{ name: 'stress–strain curve', color: 'accent', width: 2.4, data: ss.map(s => [100 * eps(s), s]) },
        { name: 'Neuber σε = (KtS)²/E', color: 'c4', width: 2, dash: '5 4', data: linspace(Math.log10(C / sMax), Math.log10(C / (sMax / 50)), 120).map(e => [100 * 10 ** e, C / 10 ** e]) },
        { name: 'elastic line', color: 'c6', width: 1.2, dash: '2 3', data: [[0, 0], [100 * sMax / E, sMax]] }],
      marks: [{ t: 'pt', x: 100 * eN, y: sN, r: 5, color: 'c4', label: 'Neuber', top: true }, { t: 'pt', x: 100 * Kt * S.S / E, y: Kt * S.S, r: 4.5, color: 'c6', hollow: true, label: 'KtS (elastic)', top: true }],
      legend: 'br',
    });
    p.readouts(p.ro, [
      { k: 'Kt (net section)', v: Kt, title: note },
      { k: 'Peak elastic stress KtS', v: Kt * S.S, u: 'MPa', cls: Kt * S.S > m.sy ? 'warn' : null },
      { k: 'Material length ρ′ (steels)', v: rho, u: 'mm', title: 'Empirical fit from σult = ' + fmt(m.su, 3) + ' MPa' },
      { k: 'Notch sensitivity q', v: q },
      { k: 'Fatigue notch factor Kf', v: Kf },
      { k: 'Local stress (Neuber)', v: sN, u: 'MPa' },
      { k: 'Local strain (Neuber)', v: 100 * eN, u: '%' },
      { k: 'Notch root', v: Kt * S.S > m.sy ? 'yields' : 'elastic', cls: Kt * S.S > m.sy ? 'warn' : 'ok' },
    ]);
  },
});

/* Stretch module: Thickness effect on fracture toughness. K in MPa√m, lengths mm, stresses MPa. */
/* Apparent toughness of a sheet of thickness B (Irwin's relation): Kc = KIc √(1 + 1.4 β²), β = (KIc/σy)² / B. */
const kcThick = (KIc, sy, Bmm) => { const beta = (KIc / sy) ** 2 * 1000 / Bmm; return KIc * Math.sqrt(1 + 1.4 * beta * beta); };

defineModule({
  id: 'thickness',
  title: 'Thickness Effect on Toughness',
  eq: '',
  lede: 'The same alloy seems much tougher as a thin sheet than as a thick plate. See how the plastic zone at the crack tip changes from plane stress at the surfaces to plane strain in the middle, find the thickness a valid fracture-toughness test needs, and what toughness to design with.',
  theory: String.raw`
    <div><p>Near a crack tip the material is loaded hard in the crack-opening direction. In a thin sheet it can contract freely through the thickness (plane stress); in a thick plate the surrounding material stops that contraction (plane strain), which raises the stress triaxiality and makes yielding harder. The plastic zone is about three times smaller in plane strain:</p>
      <div class="eq">\[ r_p^{\sigma} = \frac{1}{2\pi}\left(\frac{K}{\sigma_y}\right)^2,\qquad r_p^{\varepsilon} = \frac{1}{6\pi}\left(\frac{K}{\sigma_y}\right)^2 \]</div>
      <p>A smaller plastic zone absorbs less energy, so the measured toughness falls with thickness until it reaches a lower limit, the plane-strain fracture toughness \(K_{Ic}\). An empirical fit for the apparent toughness of a sheet of thickness \(B\) is</p>
      <div class="eq">\[ K_c = K_{Ic}\sqrt{1 + 1.4\beta_{Ic}^2},\qquad \beta_{Ic} = \frac{1}{B}\left(\frac{K_{Ic}}{\sigma_y}\right)^2 \]</div></div>
    <div><p>A test gives a valid \(K_{Ic}\) only when the specimen is thick enough for plane strain to dominate. The standard requirement on thickness, crack length and ligament is</p>
      <div class="eq">\[ B,\ a,\ (W - a) \ \ge\ 2.5\left(\frac{K_{Ic}}{\sigma_y}\right)^2 \]</div>

/* Stretch module: CTOD, J-integral and R-curves. K MPa√m, J kJ/m², lengths mm, stresses MPa. */
/* Plane-strain J from K, and the stress at which a crack of length a0 + Δa sits exactly on the R-curve. */
const jFromK = (K, E, nu) => K * K * (1 - nu * nu) / (E * 1000) * 1000;            // MPa√m, GPa → kJ/m²
const kFromJ = (J, E, nu) => Math.sqrt(J / 1000 * E * 1000 / (1 - nu * nu));      // kJ/m² → MPa√m

defineModule({
  id: 'jint',
  title: 'CTOD, J-Integral & R-Curves',
  eq: '',
  lede: 'Tough metals blunt and tear before they break, so a single KIc no longer describes them. Use the J-integral and crack-tip opening to measure toughness with plasticity, follow a crack as it grows stably along its resistance curve, and find the load at which the growth runs away.',
  theory: String.raw`
    <div><p>The J-integral is the energy released per unit crack growth, valid with plasticity at the tip as long as the material is not unloading. In the elastic limit it is the energy release rate, linked to \(K\):</p>
      <div class="eq">\[ J = \frac{K^2(1 - \nu^2)}{E}\ \ (\text{plane strain}),\qquad J = m\,\sigma_y\,\delta \]</div>
      <p>The second relation ties \(J\) to the crack-tip opening displacement (CTOD) \(\delta\), with \(m \approx 1\) in plane stress and about 2 in plane strain. Testing with \(J\) needs far smaller specimens than a valid \(K_{Ic}\) test:</p>
      <div class="eq">\[ B,\ b \ \ge\ 25\,\frac{J_{Ic}}{\sigma_y}\qquad\text{vs}\qquad B,\ a \ \ge\ 2.5\left(\frac{K_{Ic}}{\sigma_y}\right)^2 \]</div></div>
    <div><p>A tough metal does not break when \(J\) first reaches \(J_{Ic}\). The crack grows a little, and the resistance rises with growth \(\Delta a\): the R-curve, often fitted as \(J_R = J_{Ic} + C\,\Delta a^{\,p}\).</p>
      <p>Growth is stable while the applied \(J\) rises more slowly with crack length than the resistance does. Under a fixed load the crack becomes unstable where the applied curve is tangent to the R-curve,</p>
      <div class="eq">\[ J_{app}(\sigma, a_0 + \Delta a) = J_R(\Delta a),\qquad \frac{\partial J_{app}}{\partial a} = \frac{dJ_R}{d\Delta a} \]</div>
      <p class="eqn">which is the maximum load the cracked part can carry; it is higher than the load at which tearing first starts</p></div>`,

  build(p) {
    p.group('Material');
    p.material({ filter: m => m.KIc > 10 && m.cls === 'Metal' });
    p.num('C', { label: 'Tearing resistance C (J at 1 mm growth − JIc)', unit: 'kJ/m²', min: 0, max: 1000, step: 1, value: 20 });
    p.num('pR', { label: 'R-curve exponent p', min: 0.1, max: 1, step: 0.01, value: 0.5 });
    p.num('mC', { label: 'Constraint factor m (J = mσyδ)', min: 1, max: 3, step: 0.1, value: 2 });
    p.group('Cracked part');
    p.num('a0', { label: 'Initial crack length a0', unit: 'mm', min: 0.5, max: 200, step: 0.5, value: 10, log: true });
    p.num('Y', { label: 'Geometry factor Y', min: 0.5, max: 3, step: 0.01, value: 1.12 });
    p.num('sig', { label: 'Applied stress σ', unit: 'MPa', min: 1, max: 1500, step: 1, value: 200 });

    const two = h('div', { class: 'two' });
    p.out.append(two);
    p.pR = p.panel('R-curve and applied J (tangency)', '', two);
    p.ro = p.panel('Results', '', two);
    const cc = p.panel('Concept checks');
    cc.append(
      h('p', { class: 'concept' }, h('b', null, 'Initiation vs instability. '), 'The crack starts to tear at one stress and runs away at a higher one. Which stress should a designer use, and why do many codes use the lower?'),
      h('p', { class: 'concept' }, h('b', null, 'Flat R-curve. '), 'Set C = 0. What happens to the gap between initiation and instability? Which kind of material behaves like that?'),
      h('p', { class: 'concept' }, h('b', null, 'Small specimens. '), 'Compare the specimen size a J test needs with a valid KIc test for the same steel.'),
      h('p', { class: 'concept' }, h('b', null, 'Longer cracks. '), 'Increase a0. Why does the applied J curve become steeper, and what does that do to the stable growth before failure?'));
  },

  update(p) {
    const S = p.S, m = getMat(S.mat), E = m.E, nu = m.nu, sy = m.sy;
    const JIc = jFromK(m.KIc, E, nu), JR = da => JIc + S.C * Math.max(da, 0) ** S.pR;
    const Japp = (sg, a) => jFromK(S.Y * sg * Math.sqrt(Math.PI * a / 1000), E, nu);
    const sigFor = da => kFromJ(JR(da), E, nu) / (S.Y * Math.sqrt(Math.PI * (S.a0 + da) / 1000));   // stress to hold the crack on the R-curve
    const das = linspace(0, Math.max(5, S.a0), 600);
    let best = 0, sInst = 0; for (const da of das) { const sg = sigFor(da); if (sg > sInst) { sInst = sg; best = da; } }
    const sInit = sigFor(0), J0 = Japp(S.sig, S.a0);
    const state = S.sig < sInit ? 'no growth' : S.sig < sInst ? 'stable tearing' : 'unstable: fracture';

    let daNow = 0; if (S.sig >= sInit && S.sig < sInst) { for (const da of das) { if (da > best) break; if (sigFor(da) >= S.sig) { daNow = da; break; } } }

      series: [{ name: 'R-curve JR', color: 'c4', width: 2.8, data: xs.map(d => [d, JR(d)]) },
        { name: `applied, σ = ${fmt(S.sig, 3)} MPa`, color: 'accent', width: 2.2, data: xs.map(d => [d, Japp(S.sig, S.a0 + d)]) },
        { name: `instability, σ = ${fmt(sInst, 3)} MPa`, color: 'c2', width: 1.6, dash: '5 4', data: xs.map(d => [d, Japp(sInst, S.a0 + d)]) },
        { name: `initiation, σ = ${fmt(sInit, 3)} MPa`, color: 'c6', width: 1.4, dash: '2 3', data: xs.map(d => [d, Japp(sInit, S.a0 + d)]) }],
      marks: [{ t: 'pt', x: best, y: JR(best), r: 5, color: 'c2', label: 'tangent', top: true }, { t: 'hline', y: JIc, color: 'c6', label: 'JIc', anchor: 'start' }],
      legend: 'tl',
    });
    p.readouts(p.ro, [
      { k: 'JIc from KIc', v: JIc, u: 'kJ/m²' },
      { k: 'Applied J at a0', v: J0, u: 'kJ/m²' },
      { k: 'CTOD at a0, δ = J/(mσy)', v: J0 / (S.mC * sy) * 1000, u: 'µm' },
      { k: 'Stress to start tearing', v: sInit, u: 'MPa' },
      { k: 'Stress at instability', v: sInst, u: 'MPa', title: 'Maximum load under load control' },
      { k: 'Stable growth before instability', v: best, u: 'mm' },
      { k: 'At your stress', v: state + (daNow > 0 ? `, Δa ≈ ${fmt(daNow, 2)} mm` : ''), cls: state.startsWith('unstable') ? 'bad' : state === 'no growth' ? 'ok' : 'warn' },
      { k: 'Instability vs yield', v: sInst < 0.8 * sy ? 'fracture before yield' : 'near or above σy: the section yields first', cls: sInst < 0.8 * sy ? 'ok' : 'warn', title: 'J here is the elastic estimate; once the remaining section yields, plastic collapse governs instead' },
      { k: 'Specimen size for a J test, 25 JIc/σy', v: 25 * JIc / sy, u: 'mm' },
      { k: 'Specimen size for a KIc test', v: 2.5 * (m.KIc / sy) ** 2 * 1000, u: 'mm' },
    ]);
  },
});

/* Stretch module: Impact testing and the ductile-to-brittle transition. Energies J, temperatures °C. */
const CHARPY_SETS = {
  bcc: { label: 'Structural steel (BCC): illustrative data', US: 180, LS: 6, T0: -15, C: 18, temps: [-80, -60, -50, -40, -30, -20, -10, 0, 10, 20, 40, 60, 80] },
  hsla: { label: 'Fine-grained low-alloy steel (BCC): illustrative', US: 220, LS: 8, T0: -55, C: 15, temps: [-120, -100, -80, -70, -60, -50, -40, -20, 0, 20, 40] },
  fcc: { label: 'Aluminum alloy (FCC): illustrative', US: 30, LS: 26, T0: -60, C: 60, temps: [-150, -100, -60, -20, 20, 60, 100] },
};
const tanhFit = (T, P) => (P.US + P.LS) / 2 + (P.US - P.LS) / 2 * Math.tanh((T - P.T0) / P.C);
const charpyData = key => { const P = CHARPY_SETS[key], r = rng(hashStr('charpy' + key)); return P.temps.flatMap(T => [0, 1, 2].map(() => [T, Math.max(1, tanhFit(T, P) * (1 + 0.08 * randn(r)))])).map(q => [q[0], +q[1].toFixed(1)]); };
/* Least-squares tanh fit: grid over T0 and C, linear solve for the mean and half-range. */
function fitTanh(data) {
  const Ts = data.map(q => q[0]), lo = Math.min(...Ts), hi = Math.max(...Ts);
  let best = null;
  for (let i = 0; i <= 120; i++) for (let j = 1; j <= 60; j++) {
    const T0 = lo + (hi - lo) * i / 120, C = (hi - lo) * j / 120;
    let n = 0, sx = 0, sy = 0, sxx = 0, sxy = 0;
    for (const [T, E] of data) { const x = Math.tanh((T - T0) / C); n++; sx += x; sy += E; sxx += x * x; sxy += x * E; }
    const den = n * sxx - sx * sx; if (Math.abs(den) < 1e-9) continue;
    const B = (n * sxy - sx * sy) / den, A = (sy - B * sx) / n;
    const res = data.reduce((s, [T, E]) => s + (E - A - B * Math.tanh((T - T0) / C)) ** 2, 0);
    if (!best || res < best.res) best = { A, B, T0, C, res };
  }
  return best && { US: best.A + Math.abs(best.B), LS: best.A - Math.abs(best.B), T0: best.T0, C: best.C * Math.sign(best.B || 1), res: best.res };
}

    <div><p>In a Charpy test a pendulum of mass \(m\) and arm \(L\) is released from angle \(\alpha\), breaks a notched specimen and swings up to angle \(\beta\). The energy absorbed is</p>
      <div class="eq">\[ U = mgL(\cos\beta - \cos\alpha) \]</div>
      <p>The test is fast and uses a notch, so it highlights how easily a material changes from ductile to brittle. BCC metals such as ferritic steels lose their ability to flow plastically at low temperature (the yield stress rises steeply as it gets colder) and fail by cleavage instead; FCC metals such as aluminum, copper and austenitic stainless steels do not.</p></div>

const INDENT_SETS = {
  glass: { label: 'Soda-lime glass', E: 70, H: 5.5, Kc: 0.75 },

const indentC = (P, E, H, Kc) => (INDENT_CHI * Math.sqrt(E / H) * P / Kc) ** (2 / 3) * 100;     // µm (P N, K MPa√m: (1e-6)^(2/3) m = 100 µm)

/* Stretch module: Low-cycle fatigue (strain–life). Stresses MPa, E GPa, strains dimensionless. */
const strainLife = (N2, P) => P.sfp / (P.E * 1000) * N2 ** P.b + P.efp * N2 ** P.c;     // total strain amplitude at 2Nf reversals
function lifeFromStrain(ea, P) {
  let lo = 0, hi = 12;                                                                        // log10(2Nf)
  if (strainLife(10 ** lo, P) < ea) return 0.5;
  if (strainLife(10 ** hi, P) > ea) return Infinity;
  for (let i = 0; i < 80; i++) { const m = (lo + hi) / 2; if (strainLife(10 ** m, P) > ea) lo = m; else hi = m; }
  return 10 ** ((lo + hi) / 2) / 2;
}

defineModule({
  id: 'lcf',
  title: 'Low-Cycle Fatigue',
  eq: '',
  lede: 'When every cycle yields the material, as in engine start-ups, thermal cycles or earthquakes, life is better described by strain than by stress. Split the strain into elastic and plastic parts, read the life from the strain–life curve, and draw the stable hysteresis loop.',
  theory: String.raw`
    <div><p>The total strain amplitude is the sum of an elastic part, which follows Basquin’s law, and a plastic part, which follows the Coffin–Manson law. Together (2N<sub>f</sub> is the number of reversals to failure):</p>
      <div class="eq">\[ \frac{\Delta\varepsilon}{2} = \frac{\sigma_f'}{E}(2N_f)^b + \varepsilon_f'(2N_f)^c \]</div>
      <p class="eqn">b ≈ −0.05 to −0.12, c ≈ −0.5 to −0.7; ε′f is roughly the true fracture strain</p>
      <p>At short lives the plastic term dominates and ductility matters; at long lives the elastic term dominates and strength matters. They are equal at the transition life</p>
      <div class="eq">\[ 2N_t = \left(\frac{\varepsilon_f' E}{\sigma_f'}\right)^{1/(b - c)} \]</div></div>
    <div><p>After a few cycles most metals settle into a stable loop described by the cyclic stress–strain curve, consistent with the two laws above:</p>
      <div class="eq">\[ \frac{\Delta\varepsilon}{2} = \frac{\sigma_a}{E} + \left(\frac{\sigma_a}{K'}\right)^{1/n'},\qquad n' = \frac{b}{c},\quad K' = \frac{\sigma_f'}{(\varepsilon_f')^{n'}} \]</div>
      <p>The loop branches have the same shape doubled in size (Masing behaviour). The area inside the loop is the plastic work per cycle, which is what accumulates as damage.</p></div>`,

  build(p) {
    p.group('Material');
    p.material({ filter: m => m.sfp > 0 });
    p.num('efp', { label: 'Fatigue ductility coefficient ε′f', min: 0.05, max: 2, step: 0.01, value: 0.5 });
    p.num('c', { label: 'Fatigue ductility exponent c', min: -0.9, max: -0.3, step: 0.01, value: -0.6 });
    p.group('Loading');
    p.num('ea', { label: 'Strain amplitude Δε/2', unit: '%', min: 0.05, max: 5, step: 0.01, value: 0.8, log: true });

    const two = h('div', { class: 'two' });
    p.out.append(two);
    p.pS = p.panel('Strain–life curve', '', two);
    p.pL = p.panel('Stable hysteresis loop', '', two);
    p.ro = p.panel('Results', '');
    const cc = p.panel('Concept checks');
    cc.append(
      h('p', { class: 'concept' }, h('b', null, 'Strong or ductile? '), 'Compare 4340 steel and 2024 aluminum at a large and a small strain amplitude. Which material wins at each end, and why?'),
      h('p', { class: 'concept' }, h('b', null, 'Transition life. '), 'Raise ε′f. How does the transition life move? What does that say about choosing materials for thermal cycling?'),
      h('p', { class: 'concept' }, h('b', null, 'Loop area. '), 'Double the strain amplitude. How much does the energy per cycle grow, and the life shrink?'),
      h('p', { class: 'concept' }, h('b', null, 'Stress or strain? '), 'Why is a strain-controlled test the natural choice when a part is held between stiff surroundings, like a bolted joint or a turbine disk rim?'));
  },

  update(p) {
    const S = p.S, m = getMat(S.mat), P = { sfp: m.sfp, b: m.b, E: m.E, efp: S.efp, c: S.c };
    const ea = S.ea / 100, Nf = lifeFromStrain(ea, P);
    const N2t = (S.efp * m.E * 1000 / m.sfp) ** (1 / (m.b - S.c)), np = m.b / S.c, Kp = m.sfp / S.efp ** np;
    // stress amplitude on the cyclic curve for this strain amplitude
    const epsOf = sa => sa / (m.E * 1000) + (sa / Kp) ** (1 / np);
    let lo = 0, hi = m.sfp * 2; for (let i = 0; i < 80; i++) { const mid = (lo + hi) / 2; if (epsOf(mid) < ea) lo = mid; else hi = mid; }
    const sa = (lo + hi) / 2, epa = ea - sa / (m.E * 1000);
    const Ns = linspace(0, 8, 160).map(e => 10 ** e);
    Plot.render(p.pS, {
      h: 290, aria: 'Strain amplitude versus reversals to failure',
      x: { label: 'Reversals to failure 2Nf', log: true, short: '2N' }, y: { label: 'Strain amplitude', log: true, short: 'εa' },
      series: [{ name: 'total', color: 'accent', width: 2.8, data: Ns.map(n => [n, strainLife(n, P)]) },
        { name: 'elastic (Basquin)', color: 'c3', width: 1.6, dash: '5 4', data: Ns.map(n => [n, m.sfp / (m.E * 1000) * n ** m.b]) },
        { name: 'plastic (Coffin–Manson)', color: 'c4', width: 1.6, dash: '5 4', data: Ns.map(n => [n, S.efp * n ** S.c]) }],
      marks: [{ t: 'vline', x: N2t, color: 'c2', label: '2Nt' }].concat(Number.isFinite(Nf) ? [{ t: 'pt', x: 2 * Nf, y: ea, r: 5, color: 'c4', top: true }] : []),
      legend: 'bl',
    });
    // Masing loop: branches are the cyclic curve scaled by two
    const branch = (s0, e0, dir) => linspace(0, 2 * sa, 80).map(ds => [100 * (e0 + dir * 2 * epsOf(ds / 2)), s0 + dir * ds]);

    const Wp = 4 * sa * epa * (1 - np) / (1 + np);
    Plot.render(p.pL, {
      h: 290, aria: 'Stable hysteresis loop',
      x: { label: 'Strain (%)', short: 'ε' }, y: { label: 'Stress (MPa)', short: 'σ' },
      series: [{ name: 'loop', color: 'c4', width: 2.4, data: down.concat(up) }, { name: 'cyclic curve', color: 'c6', width: 1.2, dash: '4 3', data: linspace(0, sa, 60).map(s => [100 * epsOf(s), s]) }],
      marks: [{ t: 'poly', pts: down.concat(up), fill: 'c4', stroke: false, opacity: 0.12 }],
      legend: false,
    });
    p.readouts(p.ro, [
      { k: 'Cycles to failure Nf', v: Number.isFinite(Nf) ? Nf : 'very long', u: Number.isFinite(Nf) ? 'cycles' : '' },
      { k: 'Stress amplitude σa', v: sa, u: 'MPa' },
      { k: 'Plastic strain amplitude', v: 100 * epa, u: '%' },
      { k: 'Plastic share of the strain', v: 100 * epa / ea, u: '%', cls: epa / ea > 0.5 ? 'warn' : null },
      { k: 'Transition life Nt', v: N2t / 2, u: 'cycles' },
      { k: 'Cyclic n′ = b/c', v: np }, { k: 'Cyclic K′', v: Kp, u: 'MPa' },
      { k: 'Plastic work per cycle', v: Wp, u: 'MJ/m³' },
    ]);
  },
});

/* Stretch module: Creep. Norton power law referred to a measured point; Monkman–Grant rupture; Larson–Miller parameter.
   Stresses MPa, temperatures °C in the inputs (K inside), times hours. Parameter sets are illustrative. */
const CREEP_SETS = {
  ss316: { label: 'Austenitic stainless steel (illustrative)', r0: 1e-8, s0: 100, T0: 650, n: 6, Q: 330, Tm: 1400, MG: 0.06 },
  crmo: { label: 'Cr–Mo boiler steel (illustrative)', r0: 1e-8, s0: 80, T0: 550, n: 5, Q: 300, Tm: 1480, MG: 0.04 },
  ni: { label: 'Nickel superalloy (illustrative)', r0: 1e-8, s0: 300, T0: 850, n: 7, Q: 400, Tm: 1330, MG: 0.03 },
  pb: { label: 'Lead (illustrative)', r0: 1e-7, s0: 5, T0: 20, n: 4, Q: 100, Tm: 327, MG: 0.1 },
};
const RGAS = 8.314;
const creepRate = (P, s, Tc) => P.r0 * (s / P.s0) ** P.n * Math.exp(-P.Q * 1000 / RGAS * (1 / (Tc + 273.15) - 1 / (P.T0 + 273.15)));   // 1/s
const ruptureHours = (P, s, Tc) => P.MG / creepRate(P, s, Tc) / 3600;                                                                   // Monkman–Grant
const larsonMiller = (Tc, th) => (Tc + 273.15) * (20 + Math.log10(th));

  theory: String.raw`
    <div><p>Under a constant load at high homologous temperature (\(T/T_m \gtrsim 0.4\)) the strain grows with time in three stages: primary creep, where the rate falls as the material hardens; secondary (steady-state) creep, where hardening and recovery balance; and tertiary creep, where voids and necking accelerate it to rupture. The steady rate follows the Norton power law with an Arrhenius temperature term:</p>
      <div class="eq">\[ \dot\varepsilon_{ss} = A\,\sigma^n\exp\!\left(-\frac{Q}{RT}\right) \]</div>
      <p class="eqn">n ≈ 3–8 for dislocation creep, n ≈ 1 for diffusion creep at low stress and small grains; Q is close to the activation energy for self-diffusion</p></div>

/* Stretch module: Superelasticity and shape memory (NiTi-like). 1D piecewise-linear model. Stresses MPa, temperatures °C. */
const SMA_SETS = {
  se: { label: 'Superelastic NiTi wire (illustrative)', EA: 70, EM: 30, eL: 5, Cs: 6.5, Mf: -40, Ms: -20, As: 0, Af: 15, sdet: 120 },
  sm: { label: 'Shape-memory NiTi (illustrative)', EA: 70, EM: 30, eL: 5, Cs: 6.5, Mf: 30, Ms: 45, As: 60, Af: 75, sdet: 120 },
};
/* Load to εmax and unload at temperature T; returns the path, residual strain and recovery on heating. */
function smaCycle(P, T, emax) {
  const EA = P.EA * 1000, EM = P.EM * 1000, eL = P.eL / 100, path = [[0, 0]];
  const mart = T <= P.Mf, mixed = T < P.Ms && !mart;
  // forward: elastic, then transformation (or detwinning) plateau, then elastic martensite
  const sS = mart || mixed ? P.sdet : P.Cs * (T - P.Ms), sF = mart || mixed ? P.sdet * 1.15 : P.Cs * (T - P.Mf);
  const E1 = mart ? EM : EA, e1 = sS / E1, e2 = e1 + eL;
  let peak, xi;                                                 // xi = fraction transformed at the peak
  if (emax <= e1) { path.push([emax, E1 * emax]); peak = [emax, E1 * emax]; xi = 0; }
  else if (emax <= e2) { xi = (emax - e1) / eL; const s = sS + (sF - sS) * xi; path.push([e1, sS], [emax, s]); peak = [emax, s]; }
  else { const s = sF + EM * (emax - e2); path.push([e1, sS], [e2, sF], [emax, s]); peak = [emax, s]; xi = 1; }
  // unloading: elastic in the current phase, then reverse transformation if T is above As
  const Eu = xi > 0 ? EM : E1, sRs = P.Cs * (T - P.As), sRf = P.Cs * (T - P.Af), etr = xi * eL;
  let resid = 0;
  if (xi > 0 && sRs > 0 && !mart && !mixed) {
    const eStart = peak[0] - (peak[1] - Math.min(sRs, peak[1])) / Eu, sStart = Math.min(sRs, peak[1]);
    path.push([eStart, sStart]);
    if (sRf >= 0) { path.push([sRf / EA, sRf], [0, 0]); resid = 0; }      // reverse plateau ends on the austenite elastic line
    else { const fr = sStart / (sStart - sRf), eZero = eStart - etr * fr; path.push([eZero, 0]); resid = eZero; }
  } else { const e0 = peak[0] - peak[1] / Eu; path.push([e0, 0]); resid = e0; }
  return { path, resid, xi, sS, sF, sRs, sRf, peak, recoverable: Math.min(resid, etr) };
}

defineModule({
  id: 'sma',
  title: 'Superelasticity & Shape Memory',
  eq: '',
  lede: 'Nickel–titanium can stretch by several percent and spring back, or stay bent and recover its shape when warmed. Both come from a reversible change of crystal structure. Load a wire at different temperatures, follow the stress plateaus and the hysteresis loop, and see where in the stress–temperature diagram each behaviour lives.',
  theory: String.raw`
    <div><p>Shape-memory alloys switch between a high-temperature phase, austenite, and a low-temperature phase, martensite. Cooling transforms austenite to martensite between \(M_s\) and \(M_f\); heating transforms it back between \(A_s\) and \(A_f\). Stress favours martensite too, raising the transformation temperatures along nearly straight lines (Clausius–Clapeyron):</p>
      <div class="eq">\[ \frac{d\sigma}{dT} = C \approx 5\text{–}8\ \text{MPa/K for NiTi},\qquad \sigma_{A\to M}(T) = C\,(T - M_s) \]</div>
      <p>The transformation shears the crystal and gives a large strain \(\varepsilon_L\) (about 4–8%) at almost constant stress: a plateau.</p></div>

        <li><b>Superelasticity</b> (above \(A_f\)): loading turns austenite into martensite on the upper plateau; unloading turns it back on a lower plateau. The strain recovers fully and the loop area is energy dissipated, useful in stents, eyeglass frames and dampers.</li>

    p.num('eL', { label: 'Transformation strain εL', unit: '%', min: 1, max: 10, step: 0.1, value: 5 });
    p.num('Cs', { label: 'Clausius–Clapeyron slope C', unit: 'MPa/K', min: 2, max: 15, step: 0.1, value: 6.5 });
    p.num('Mf', { label: 'Mf', unit: '°C', min: -150, max: 150, step: 1, value: -40 });
    p.num('Ms', { label: 'Ms', unit: '°C', min: -150, max: 150, step: 1, value: -20 });
    p.num('As', { label: 'As', unit: '°C', min: -150, max: 150, step: 1, value: 0 });
    p.num('Af', { label: 'Af', unit: '°C', min: -150, max: 150, step: 1, value: 15 });
    p.num('sdet', { label: 'Detwinning stress', unit: 'MPa', min: 20, max: 400, step: 1, value: 120 });
    p.group('Test');
    p.num('T', { label: 'Test temperature', unit: '°C', min: -100, max: 150, step: 1, value: 37 });
    p.num('emax', { label: 'Maximum strain', unit: '%', min: 0.2, max: 10, step: 0.1, value: 6 });

    const two = h('div', { class: 'two' });
    p.out.append(two);
    p.pS = p.panel('Load and unload at the test temperature', '', two);
    p.pP = p.panel('Stress–temperature diagram', '', two);
    p.ro = p.panel('Results', '');
    const cc = p.panel('Concept checks');
    cc.append(
      h('p', { class: 'concept' }, h('b', null, 'Body temperature. '), 'Why is a superelastic stent made from an alloy with Af below 37 °C? What would happen with Af = 45 °C?'),
      h('p', { class: 'concept' }, h('b', null, 'Plateaus rise with T. '), 'Raise the test temperature by 20 °C. How much do the plateaus move, and why does the alloy eventually yield instead of transforming?'),
      h('p', { class: 'concept' }, h('b', null, 'Shape memory. '), 'Choose the shape-memory alloy and test it at room temperature. What strain is left after unloading, and what happens on heating past Af?'),
      h('p', { class: 'concept' }, h('b', null, 'Damping. '), 'The loop area is energy lost per cycle. How could superelastic wires protect a building in an earthquake?'));
  },

  update(p) {
    const S = p.S;
    const keys = ['EA', 'EM', 'eL', 'Cs', 'Mf', 'Ms', 'As', 'Af', 'sdet'];
    const match = Object.entries(SMA_SETS).find(([, q]) => keys.every(k => Math.abs(q[k] - S[k]) < 1e-9)), want = match ? match[0] : 'custom';
    if (S.set !== want) p.controls.set.set(want);
    const order = S.Mf < S.Ms && S.Ms <= S.As && S.As < S.Af;
    const P = { EA: S.EA, EM: S.EM, eL: S.eL, Cs: S.Cs, Mf: S.Mf, Ms: S.Ms, As: S.As, Af: S.Af, sdet: S.sdet };
    const R = smaCycle(P, S.T, S.emax / 100);
    const regime = S.T >= S.Af ? 'superelastic' : S.T <= S.As ? 'shape memory (strain stays until heated)' : 'partly superelastic';
    // dissipated energy: area of the closed polygon if the loop closes, else area under load minus area under unload
    const pts = R.path; let area = 0; for (let i = 0; i < pts.length; i++) { const [x1, y1] = pts[i], [x2, y2] = pts[(i + 1) % pts.length]; area += x1 * y2 - x2 * y1; }
    Plot.render(p.pS, {
      h: 290, aria: 'Stress versus strain on loading and unloading',
      x: { label: 'Strain (%)', short: 'ε', min: 0 }, y: { label: 'Stress (MPa)', short: 'σ', min: 0 },
      series: [{ name: 'load–unload', color: 'accent', width: 2.6, data: R.path.map(q => [100 * q[0], q[1]]) }],
      marks: [{ t: 'poly', pts: R.path.map(q => [100 * q[0], q[1]]), fill: 'c4', stroke: false, opacity: 0.12 }].concat(R.resid > 1e-6 ? [{ t: 'pt', x: 100 * R.resid, y: 0, r: 5, color: 'c4', label: 'residual: recovers on heating', top: true }] : []),
      legend: false,
    });
    const Ts = linspace(Math.min(S.Mf, S.T) - 30, Math.max(S.Af, S.T) + 40, 2), line = (T0, name, color, dash) => ({ name, color, width: 2, dash, data: Ts.map(T => [T, Math.max(0, S.Cs * (T - T0))]) });
    Plot.render(p.pP, {
      h: 290, aria: 'Transformation stress versus temperature',
      x: { label: 'Temperature (°C)', short: 'T' }, y: { label: 'Stress (MPa)', short: 'σ', min: 0, max: Math.max(R.peak[1] * 1.3, 200) },
      series: [line(S.Ms, 'Ms: A → M starts', 'c4'), line(S.Mf, 'Mf: A → M ends', 'c4', '5 4'), line(S.As, 'As: M → A starts', 'c3'), line(S.Af, 'Af: M → A ends', 'c3', '5 4')],
      marks: [{ t: 'vline', x: S.T, color: 'accent', label: 'test T' }, { t: 'pt', x: S.T, y: R.peak[1], r: 5, color: 'accent', top: true }],
      legend: 'tl',
    });
    p.readouts(p.ro, [
      { k: 'Regime at the test temperature', v: order ? regime : 'check: need Mf < Ms ≤ As < Af', cls: order ? null : 'bad' },
      { k: 'Upper plateau (start)', v: R.sS, u: 'MPa' },
      { k: 'Lower plateau (start of reverse)', v: R.sRs > 0 && S.T > S.As ? R.sRs : '—', u: R.sRs > 0 && S.T > S.As ? 'MPa' : '' },
      { k: 'Fraction transformed at peak', v: 100 * R.xi, u: '%' },
      { k: 'Peak stress', v: R.peak[1], u: 'MPa' },
      { k: 'Residual strain after unloading', v: 100 * R.resid, u: '%', cls: R.resid > 1e-4 ? 'warn' : 'ok' },
      { k: 'Recovered on heating above Af', v: 100 * R.recoverable, u: '%' },
      { k: R.resid > 1e-4 ? 'Energy absorbed (area under load minus unload)' : 'Energy dissipated (loop area)', v: Math.abs(area) / 2, u: 'MJ/m³' },
    ]);
  },
});

boot();
</script>
</body>
</html>
