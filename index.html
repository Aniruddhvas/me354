<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ME 354 Mechanics Lab</title>
<meta name="description" content="Interactive tools for ME 354 Mechanics of Materials at the University of Washington.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout concept: a test-lab console. Deep purple instrument band on top, graph-paper plots,
   controls docked left like a load frame panel, results read out in mono like a data acquisition screen. */
:root {
  --bg: #f4f3f7;
  --surface: #ffffff;
  --surface-2: #eeecf3;
  --ink: #1c1824;
  --muted: #5f5969;
  --line: #d9d5e1;
  --grid: #e9e6ef;
  --accent: #4b2e83;
  --accent-ink: #ffffff;
  --accent-soft: #e7e1f3;
  --gold: #85691c;
  --gold-soft: #f1e9cf;
  --band: #2b1a50;
  --band-ink: #f3effa;
  --band-muted: #b9add3;
  --c1: #4b2e83; --c2: #b07d12; --c3: #19807a; --c4: #c2412d; --c5: #3d6fb6; --c6: #77707f;
  --ok: #2f7d4f; --warn: #9a6200; --bad: #b3261e;
  --ok-soft: #e1f1e7; --warn-soft: #f6ebd5; --bad-soft: #f7e1df;
  --f-display: "Archivo", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r: 6px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121017; --surface: #1a1721; --surface-2: #231e2b; --ink: #ece8f3; --muted: #a59eb1;
    --line: #383241; --grid: #27222f; --accent: #b9a3ef; --accent-ink: #160f22; --accent-soft: #2e2542;
    --gold: #d9bf72; --gold-soft: #3a321c; --band: #1d1233; --band-ink: #f3effa; --band-muted: #a99cc6;
    --c1: #b9a3ef; --c2: #e0b854; --c3: #4cc2b8; --c4: #f07a62; --c5: #7fa8ee; --c6: #9c97a5;
    --ok: #5cc58a; --warn: #e5a83a; --bad: #f2786b;
    --ok-soft: #173325; --warn-soft: #3a2c12; --bad-soft: #3d1a17;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121017; --surface: #1a1721; --surface-2: #231e2b; --ink: #ece8f3; --muted: #a59eb1;
  --line: #383241; --grid: #27222f; --accent: #b9a3ef; --accent-ink: #160f22; --accent-soft: #2e2542;
  --gold: #d9bf72; --gold-soft: #3a321c; --band: #1d1233; --band-ink: #f3effa; --band-muted: #a99cc6;
  --c1: #b9a3ef; --c2: #e0b854; --c3: #4cc2b8; --c4: #f07a62; --c5: #7fa8ee; --c6: #9c97a5;
  --ok: #5cc58a; --warn: #e5a83a; --bad: #f2786b;
  --ok-soft: #173325; --warn-soft: #3a2c12; --bad-soft: #3d1a17;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.55 var(--f-body);
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--band); }
a { color: var(--accent); }
h1, h2, h3, h4 { font-family: var(--f-display); text-wrap: balance; margin: 0; line-height: 1.15; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono, .num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 1320px; margin: 0 auto; }

/* ---------- Top band ---------- */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--band); color: var(--band-ink); }
.topbar .wrap { display: flex; align-items: center; gap: 18px; min-height: 56px; flex-wrap: wrap; padding-block: 6px; }
.brand { display: flex; align-items: baseline; gap: 10px; text-decoration: none; color: inherit; flex: none; }
.brand b { font-family: var(--f-display); font-stretch: 125%; font-weight: 800; font-size: 22px; letter-spacing: .02em; }
.brand span { font-size: 12.5px; color: var(--band-muted); letter-spacing: .04em; text-transform: uppercase; }
.nav { display: flex; gap: 2px; flex-wrap: wrap; flex: 1; min-width: 0; }
.nav > .dd { position: relative; }
.nav button.navbtn, .nav a.navlink {
  background: none; border: 0; color: var(--band-ink); padding: 8px 11px; border-radius: 4px; cursor: pointer;
  font-size: 14px; text-decoration: none; display: inline-flex; align-items: center; gap: 5px;
}
.nav button.navbtn:hover, .nav a.navlink:hover, .nav .open > button.navbtn { background: rgba(255,255,255,.1); }
.nav a.navlink.active, .nav .dd.active > button.navbtn { box-shadow: inset 0 -2px 0 var(--gold-soft); }
.nav .caret { font-size: 10px; opacity: .7; }
.menu {
  position: absolute; top: calc(100% + 4px); left: 0; min-width: 270px; background: var(--surface); color: var(--ink);
  border: 1px solid var(--line); border-radius: var(--r); box-shadow: 0 10px 30px rgba(20,10,40,.18); padding: 6px; z-index: 40;
}
.menu { max-height: min(78vh, 640px); overflow-y: auto; }
@media (min-width: 901px) { .nav > .dd:nth-last-child(-n+3) .menu { left: auto; right: 0; } }
.menu a { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 7px 10px; border-radius: 4px; text-decoration: none; color: var(--ink); }
.menu a:hover, .menu a:focus-visible { background: var(--accent-soft); }
.menu a small { grid-column: 1 / -1; color: var(--muted); font-size: 12.5px; }
.menu a .tag { font-family: var(--f-mono); font-size: 11.5px; color: var(--muted); }
.menu a.soon { opacity: .55; }
.menu .mhead { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 8px 10px 4px; }
.themebtn { background: none; border: 1px solid rgba(255,255,255,.18); color: var(--band-ink); border-radius: 4px; padding: 5px 8px; cursor: pointer; font-size: 13px; }

/* ---------- Page ---------- */
main { padding-block: 22px 60px; }
.view[hidden] { display: none !important; }
.eyebrow { font-family: var(--f-mono); font-size: 12px; letter-spacing: .06em; color: var(--gold); text-transform: uppercase; }
.lede { color: var(--muted); max-width: 70ch; margin: 6px 0 0; }

/* Home */
.hero { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 28px; align-items: center; padding-block: 18px 30px; }
.hero h1 { font-size: clamp(34px, 5.2vw, 60px); font-stretch: 118%; font-weight: 800; letter-spacing: -.01em; }
.hero h1 em { font-style: normal; color: var(--accent); }
.hero p { font-size: 17px; max-width: 54ch; color: var(--muted); }
.hero .ctas { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; }
.herofig { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; min-width: 0; }
.herofig figcaption { font-size: 13px; color: var(--muted); margin-top: 8px; }
.arc { display: grid; gap: 26px; margin-top: 10px; }
.arc h2 { font-size: 20px; font-stretch: 110%; display: flex; align-items: baseline; gap: 12px; }
.arc h2 .eyebrow { font-size: 12px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; margin-top: 10px; }
.mcard {
  display: grid; grid-template-rows: auto auto 1fr auto; gap: 4px; padding: 14px 16px; background: var(--surface);
  border: 1px solid var(--line); border-radius: var(--r); text-decoration: none; color: var(--ink); min-width: 0;
}
.mcard:hover { border-color: var(--accent); }
.mcard .k { display: flex; justify-content: space-between; gap: 8px; font-family: var(--f-mono); font-size: 11.5px; color: var(--muted); }
.mcard h3 { font-size: 17px; font-stretch: 105%; }
.mcard p { margin: 0; font-size: 13.5px; color: var(--muted); }
.mcard .st { font-size: 12px; font-weight: 600; color: var(--accent); margin-top: 6px; }
.mcard.soon { background: transparent; border-style: dashed; }
.mcard.soon .st { color: var(--muted); font-weight: 500; }

/* Module page */
.mhd { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 14px; }
.mhd h1 { font-size: clamp(26px, 3.4vw, 36px); font-stretch: 112%; font-weight: 750; }
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; }
.btn {
  border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 5px; padding: 7px 12px;
  cursor: pointer; font-size: 13.5px; display: inline-flex; align-items: center; gap: 6px; text-decoration: none; line-height: 1.2;
}
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.small { padding: 4px 9px; font-size: 12.5px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.banner { border: 1px solid var(--gold); background: var(--gold-soft); border-radius: var(--r); padding: 10px 14px; margin-bottom: 14px; font-size: 14px; }
.banner b { font-family: var(--f-display); }
.theory { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); margin-bottom: 16px; }
.theory > summary { cursor: pointer; padding: 10px 14px; font-weight: 600; font-size: 14px; list-style: none; display: flex; justify-content: space-between; gap: 10px; }
.theory > summary::-webkit-details-marker { display: none; }
.theory > summary::after { content: "Show"; font-weight: 500; color: var(--accent); font-size: 13px; }
.theory[open] > summary::after { content: "Hide"; }
.theory .tbody { padding: 0 16px 14px; display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 6px 26px; overflow-x: auto; }
.theory .tbody p { margin: 6px 0; font-size: 14px; max-width: 68ch; }
.theory .eq { overflow-x: auto; padding: 2px 0; }
.eqn { font-family: var(--f-mono); font-size: 11.5px; color: var(--muted); }

.mgrid { display: grid; grid-template-columns: minmax(250px, 310px) minmax(0, 1fr); gap: 18px; align-items: start; }
.controls {
  position: sticky; top: calc(env(safe-area-inset-top, 0px) + 70px); max-height: calc(100vh - 90px); overflow: auto;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 4px 14px 14px;
}
.cgroup { border-top: 1px solid var(--line); padding-top: 10px; margin-top: 10px; display: grid; gap: 10px; }
.cgroup:first-child { border-top: 0; margin-top: 4px; }
.cgroup > h4 { font-family: var(--f-body); font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.ctl { display: grid; gap: 4px; }
.ctl .lab { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 13.5px; }
.ctl .lab .u { color: var(--muted); font-size: 12px; font-family: var(--f-mono); }
.ctl .row { display: grid; grid-template-columns: minmax(0, 1fr) 84px; gap: 8px; align-items: center; }
.ctl input[type=range] { width: 100%; accent-color: var(--accent); }
.ctl input[type=number], .ctl select, .field input, .field select, .field textarea {
  width: 100%; background: var(--surface-2); border: 1px solid var(--line); border-radius: 4px; padding: 5px 7px; font-size: 13.5px;
}
.ctl input[type=number] { font-family: var(--f-mono); text-align: right; }
.ctl.locked { opacity: .6; }
.ctl.locked .lab::after { content: "locked"; font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--gold); }
.ctl .help { font-size: 12px; color: var(--muted); }
.seg { display: flex; flex-wrap: wrap; gap: 0; border: 1px solid var(--line); border-radius: 5px; overflow: hidden; }
.seg button { flex: 1 1 auto; border: 0; background: var(--surface-2); padding: 6px 8px; font-size: 12.5px; cursor: pointer; border-right: 1px solid var(--line); }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed=true] { background: var(--accent); color: var(--accent-ink); }
.chk { display: flex; align-items: center; gap: 8px; font-size: 13.5px; }
.chk input { accent-color: var(--accent); }

.outputs { display: grid; gap: 16px; min-width: 0; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px 14px; min-width: 0; }
.panel > h3 { font-size: 15px; font-stretch: 105%; margin-bottom: 8px; display: flex; justify-content: space-between; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.panel > h3 .eqn { font-weight: 400; }
.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
.readouts { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); border-top: 1px solid var(--line); border-left: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.ro { background: var(--surface); padding: 9px 12px; min-width: 0; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.ro .k { font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; gap: 6px; }
.ro .v { font-family: var(--f-mono); font-variant-numeric: tabular-nums; font-size: 18px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ro .v small { font-size: 12px; color: var(--muted); font-weight: 400; margin-left: 3px; }
.ro.ok { background: var(--ok-soft); } .ro.ok .v { color: var(--ok); }
.ro.warn { background: var(--warn-soft); } .ro.warn .v { color: var(--warn); }
.ro.bad { background: var(--bad-soft); } .ro.bad .v { color: var(--bad); }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; padding: 3px 9px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface-2); }
.pill.ok { color: var(--ok); border-color: currentColor; background: var(--ok-soft); }
.pill.warn { color: var(--warn); border-color: currentColor; background: var(--warn-soft); }
.pill.bad { color: var(--bad); border-color: currentColor; background: var(--bad-soft); }
.concept { border-left: 3px solid var(--gold); padding: 6px 12px; background: var(--gold-soft); font-size: 14px; border-radius: 0 var(--r) var(--r) 0; }
.concept b { font-family: var(--f-display); }
.note { font-size: 13px; color: var(--muted); }

/* Plots */
.plot { position: relative; width: 100%; min-width: 0; }
.plot svg { display: block; width: 100%; height: auto; overflow: visible; }
.plot .tip {
  position: absolute; pointer-events: none; background: var(--ink); color: var(--bg); font: 12px/1.35 var(--f-mono);
  padding: 4px 7px; border-radius: 4px; white-space: nowrap; transform: translate(-50%, calc(-100% - 10px)); z-index: 5;
}
.schem { width: 100%; }
.schem svg { display: block; width: 100%; height: auto; }

/* Tables */
.tscroll { overflow-x: auto; }
table.t { border-collapse: collapse; width: 100%; font-size: 14px; }
table.t th, table.t td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.t th { font-size: 12px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); font-weight: 600; background: var(--surface-2); }
table.t td.num, table.t th.num { text-align: right; font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
table.t tr.sel td { background: var(--accent-soft); }
table.t tr.hl td { background: var(--gold-soft); }
table.t a.chip { display: inline-block; font-size: 12px; padding: 1px 7px; border-radius: 99px; border: 1px solid var(--line); text-decoration: none; margin: 2px 4px 2px 0; }
table.t a.chip.live { border-color: var(--accent); color: var(--accent); }
table.t a.chip.soon { color: var(--muted); }

/* Dialog */
.dlg-back { position: fixed; inset: 0; background: rgba(15, 8, 30, .45); z-index: 50; display: grid; place-items: center; padding: 16px; }
.dlg { background: var(--surface); color: var(--ink); border-radius: 8px; border: 1px solid var(--line); width: min(560px, 100%); max-height: 90vh; overflow: auto; padding: 18px 20px; display: grid; gap: 12px; }
.dlg h3 { font-size: 19px; }
.field { display: grid; gap: 4px; font-size: 13.5px; }
.field textarea { font-family: var(--f-mono); font-size: 12.5px; min-height: 90px; }
.dlg .acts { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
.toast { position: fixed; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 6px; font-size: 14px; z-index: 60; }

/* Stretch modules (beyond the course notes) */
.stag { display: inline-block; font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--gold); border: 1px solid currentColor; border-radius: 99px; padding: 0 7px; margin-right: 8px; line-height: 1.6; }
.mcard.stretch { border-left: 3px solid var(--gold); }
.mcard.stretch .st { color: var(--gold); }
.mcard.stretch.soon { border-left-style: solid; }
.subh { font-family: var(--f-body); font-size: 13px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--gold); margin-top: 16px; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.subh span { text-transform: none; letter-spacing: 0; font-weight: 400; color: var(--muted); }
.menu .mhead.stretch { color: var(--gold); border-top: 1px solid var(--line); margin-top: 4px; padding-top: 10px; }
.nav .chn { font-family: var(--f-mono); font-size: 11.5px; color: var(--band-muted); }
.kv { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 2px 18px; font-size: 13.5px; }
.kv div { display: flex; justify-content: space-between; gap: 10px; border-bottom: 1px dotted var(--line); padding: 3px 0; }
.kv span:last-child { font-family: var(--f-mono); text-align: right; }

footer.foot { border-top: 1px solid var(--line); color: var(--muted); font-size: 13px; padding-block: 18px 30px; }
footer.foot .wrap { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }

/* Real-world case panel */
.theory.case { border-left: 3px solid var(--c4); }
.theory.case > summary { color: var(--ink); }
.casebody { padding: 0 16px 14px; display: grid; gap: 10px; min-width: 0; }
.casebody > .schem { overflow-x: auto; -webkit-overflow-scrolling: touch; }
@media (max-width: 600px) { .casebody > .schem > svg { min-width: 720px; } }   /* on phones the figure scrolls sideways instead of shrinking past legibility */
.casetext p { margin: 6px 0; font-size: 14px; max-width: 80ch; }
.casetext .facts { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 4px 18px; font-size: 13px; color: var(--muted); margin-top: 6px; }
.casetext .facts b { color: var(--ink); font-weight: 600; }

/* Small matrices and worked steps (Mohr's circle eigenvalue panel) */
.mrow { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 8px 0; font-family: var(--f-mono); font-size: 13.5px; }
.mat { display: inline-grid; gap: 2px 16px; padding: 3px 9px; border-left: 2px solid var(--ink); border-right: 2px solid var(--ink); border-radius: 5px; font-family: var(--f-mono); font-variant-numeric: tabular-nums; text-align: right; }
.btnrow { display: flex; gap: 6px; flex-wrap: wrap; }

/* Embed mode: one module, no chrome */
body.embed .topbar, body.embed footer.foot { display: none; }
body.embed main { padding-block: 12px 20px; }
body.embed .controls { top: 12px; max-height: none; }

@media (max-width: 900px) {
  .topbar { position: static; }
  .topbar .wrap { gap: 6px 12px; }
  .nav { order: 3; flex-basis: 100%; position: relative; margin-left: -8px; }
  .nav > .dd { position: static; }
  .menu { left: 0; right: 0; min-width: 0; max-width: 420px; }
  .nav button.navbtn, .nav a.navlink { padding: 6px 8px; font-size: 13.5px; }
  .themebtn { margin-left: auto; }
  .hero { grid-template-columns: minmax(0, 1fr); }
  .mgrid { grid-template-columns: minmax(0, 1fr); }
  .controls { position: static; max-height: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<header class="topbar gutter">
  <div class="wrap">
    <a class="brand" href="#home"><b>ME&nbsp;354</b><span>Mechanics Lab</span></a>
    <nav class="nav" id="nav" aria-label="Chapters"></nav>
    <button class="themebtn" id="themeBtn" type="button" title="Switch light or dark theme">Theme</button>
  </div>
</header>
<main class="gutter"><div class="wrap" id="app"></div></main>
<footer class="foot gutter">
  <div class="wrap">
    <span>ME 354 Mechanics of Materials · University of Washington · Prof. Aniruddh Vashisth</span>
    <span><a href="#about">About &amp; credits</a> · v2.2</span>
  </div>
</footer>

<script>

/* ---------------- app state ---------------- */

/* ---------------- module page builder ----------------
   def: { id, title, eq (header equation range), lede, theory (HTML with TeX), build(page), update(page) } */
function buildModulePage(def) {
  const cat = catById(def.id) || {};
  const page = { def, S: {}, controls: {}, locked: new Set(), readoutData: [], _raf: 0 };
  const root = h('section', { class: 'view', id: 'v-' + def.id, hidden: true });
  page.root = root;

  const banner = h('div', { class: 'banner', hidden: true });
  page.banner = banner;
  const tb = h('div', { class: 'toolbar' },
    h('button', { class: 'btn', type: 'button', onclick: () => setupDialog(page) }, 'Setup code'),
    h('button', { class: 'btn', type: 'button', onclick: () => resetPage(page) }, 'Reset'),
  );
  root.append(
    h('div', { class: 'mhd' },
      h('div', null,
        h('div', { class: 'eyebrow' }, cat.s ? h('span', { class: 'stag' }, 'Stretch') : null, `Ch. ${cat.g}${srcTag(cat) ? ' · ' + srcTag(cat) : ''}${def.eq ? ' · ' + def.eq : ''}`),
        h('h1', null, def.title || cat.t),
        def.lede ? h('p', { class: 'lede' }, def.lede) : null),
      tb),
    banner);
  if (def.theory) {
    const det = h('details', { class: 'theory', open: store.get('theory.' + def.id, window.innerWidth > 900) },
      h('summary', null, 'Theory and key equations'), h('div', { class: 'tbody', html: def.theory }));
    det.addEventListener('toggle', () => store.set('theory.' + def.id, det.open));
    root.append(det);
  }
  if (def.caseStudy) {
    const cs = def.caseStudy;
    page.caseFig = h('div', { class: 'schem' });
    page.caseBtns = h('div', { class: 'btnrow', style: { marginTop: '8px' } });
    const det = h('details', { class: 'theory case', open: store.get('case.' + def.id, true) },
      h('summary', null, 'Real-world case: ' + cs.title),
      h('div', { class: 'casebody' }, page.caseFig, h('div', { class: 'casetext', html: cs.html }), page.caseBtns));
    det.addEventListener('toggle', () => store.set('case.' + def.id, det.open));
    root.append(det);
  }
  const controls = h('aside', { class: 'controls', 'aria-label': 'Inputs' });
  const outputs = h('div', { class: 'outputs' });
  root.append(h('div', { class: 'mgrid' }, controls, outputs));
  page.controlsEl = controls; page.out = outputs; page._grp = controls;

  page.schedule = () => { cancelAnimationFrame(page._raf); page._raf = requestAnimationFrame(() => page.run()); };
  page.run = () => { try { def.update(page); if (def.caseStudy && page.caseFig) def.caseStudy.draw(page.caseFig, page); } catch (e) { console.error(e); } };

  page.group = (title) => { const g = h('div', { class: 'cgroup' }, title ? h('h4', null, title) : null); controls.append(g); page._grp = g; return g; };

  page.num = (key, o) => {
    const v0 = o.value;
    page.S[key] = v0;
    const id = `${def.id}-${key}`;
    const range = h('input', { type: 'range', min: o.min, max: o.max, step: o.step ?? 'any', 'aria-label': o.label });
    const num = h('input', { type: 'number', id, min: o.min, max: o.max, step: o.step ?? 'any' });
    const toR = v => o.log ? Math.log10(v) : v, fromR = r => o.log ? 10 ** r : r;
    if (o.log) { range.min = Math.log10(o.min); range.max = Math.log10(o.max); range.step = 'any'; }
    const wrap = h('div', { class: 'ctl' },
      h('label', { class: 'lab', for: id }, h('span', null, o.label), o.unit ? h('span', { class: 'u' }, o.unit) : null),
      h('div', { class: 'row' }, range, num), o.help ? h('div', { class: 'help' }, o.help) : null);
    const set = (v, src) => {
      if (!Number.isFinite(v)) return;
      page.S[key] = v;
      if (src !== 'range') range.value = toR(clamp(v, o.min, o.max));
      if (src !== 'num') num.value = fmtPlain(v, 5);
    };
    range.addEventListener('input', () => { let v = fromR(+range.value); if (o.step && !o.log) v = Math.round(v / o.step) * o.step; set(+v.toPrecision(6), 'range'); page.schedule(); });
    num.addEventListener('input', () => { const v = parseFloat(num.value); if (Number.isFinite(v)) { set(v, 'num'); page.schedule(); } });
    num.addEventListener('change', () => set(page.S[key]));
    set(v0);
    page._grp.append(wrap);
    page.controls[key] = { label: o.label, unit: o.unit, wrap, set: v => set(+v), disable: b => { range.disabled = num.disabled = b; wrap.classList.toggle('locked', b); }, fmt: () => fmtPlain(page.S[key], 5), def: v0 };
    return wrap;
  };

  page.seg = (key, o) => {
    page.S[key] = o.value;
    const btns = o.options.map(([v, lab]) => h('button', { type: 'button', 'aria-pressed': String(v === o.value), onclick: () => { set(v); page.schedule(); } }, lab));
    const set = v => { page.S[key] = v; btns.forEach((b, i) => b.setAttribute('aria-pressed', String(o.options[i][0] === v))); o.onset && o.onset(v); };
    const wrap = h('div', { class: 'ctl' }, o.label ? h('div', { class: 'lab' }, h('span', null, o.label)) : null, h('div', { class: 'seg', role: 'group', 'aria-label': o.label || key }, btns));
    page._grp.append(wrap);
    page.controls[key] = { label: o.label || key, wrap, set, disable: b => { btns.forEach(x => x.disabled = b); wrap.classList.toggle('locked', b); }, fmt: () => (o.options.find(x => x[0] === page.S[key]) || [, page.S[key]])[1], def: o.value };
    return wrap;
  };

  page.sel = (key, o) => {
    page.S[key] = o.value;
    const id = `${def.id}-${key}`;
    const s = h('select', { id }, o.options.map(([v, lab]) => h('option', { value: v }, lab)));
    s.value = o.value;
    s.addEventListener('change', () => { page.S[key] = s.value; o.onset && o.onset(s.value); page.schedule(); });
    const wrap = h('div', { class: 'ctl' }, h('label', { class: 'lab', for: id }, h('span', null, o.label)), s, o.help ? h('div', { class: 'help' }, o.help) : null);
    page._grp.append(wrap);
    page.controls[key] = { label: o.label, wrap, set: v => { s.value = v; page.S[key] = s.value; }, disable: b => { s.disabled = b; wrap.classList.toggle('locked', b); }, fmt: () => s.options[s.selectedIndex]?.text ?? '', def: o.value, el: s };
    return wrap;
  };

  page.chk = (key, o) => {
    page.S[key] = !!o.value;
    const id = `${def.id}-${key}`;
    const c = h('input', { type: 'checkbox', id });
    c.checked = !!o.value;
    c.addEventListener('change', () => { page.S[key] = c.checked; page.schedule(); });
    const wrap = h('div', { class: 'ctl' }, h('label', { class: 'chk', for: id }, c, o.label));
    page._grp.append(wrap);
    page.controls[key] = { label: o.label, wrap, set: v => { c.checked = !!v; page.S[key] = !!v; }, disable: b => { c.disabled = b; wrap.classList.toggle('locked', b); }, fmt: () => page.S[key] ? 'yes' : 'no', def: !!o.value };
    return wrap;
  };

  /* Material picker, shared across modules (filter optional). */
  page.material = (o = {}) => {
    const mats = allMaterials().filter(o.filter || (() => true));
    const w = page.sel('mat', { label: 'Material', value: mats.some(m => m.id === App.mat) ? App.mat : mats[0].id, options: mats.map(m => [m.id, m.name]), onset: v => App.setMaterial(v), help: o.help });
    page.matFilter = o.filter;
    page.controls.mat.refresh = () => {
      const s = page.controls.mat.el, cur = s.value;
      s.replaceChildren(...allMaterials().filter(page.matFilter || (() => true)).map(m => h('option', { value: m.id }, m.name)));
      s.value = cur; if (!s.value) s.selectedIndex = 0; page.S.mat = s.value;
    };
    return w;
  };

  page.panel = (title, eq, parent = outputs) => {
    const body = h('div');
    const p = h('div', { class: 'panel' }, title ? h('h3', null, h('span', null, title), eq ? h('span', { class: 'eqn' }, eq) : null) : null, body);
    parent.append(p);
    return body;
  };

  /* items: [{k, v, u, sig, cls, eq}] */
  page.readouts = (el, items) => {
    page.readoutData = items;
    el.replaceChildren(h('div', { class: 'readouts' }, items.map(it =>
      h('div', { class: 'ro' + (it.cls ? ' ' + it.cls : ''), title: it.title || '' },
        h('div', { class: 'k' }, h('span', null, it.k), it.eq ? h('span', { class: 'eqn' }, it.eq) : null),
        h('div', { class: 'v' }, typeof it.v === 'string' ? it.v : fmt(it.v, it.sig || 3), it.u ? h('small', null, it.u) : null)))));
  };

  def.build(page);
  if (def.caseStudy && def.caseStudy.buttons) page.caseBtns.append(...def.caseStudy.buttons(page));
  page.defaults = JSON.parse(JSON.stringify(page.S));
  return page;
}

function resetPage(page) {
  for (const [k, c] of Object.entries(page.controls)) if (!page.locked.has(k)) c.set(page.defaults[k]);
  if (page.controls.mat && !page.locked.has('mat')) App.setMaterial(page.S.mat);
  page.def.onreset && page.def.onreset(page);
  page.schedule();
}

/* ---------------- setup codes & assignment presets ----------------
   A setup code is the module id + all inputs (+ optional title, note and locked inputs), base64 encoded.
   Instructors post a code on Canvas; students paste it in "Setup code" → Load. */
function encodeSetup(obj) {
  const bytes = new TextEncoder().encode(JSON.stringify(obj));
  let bin = ''; bytes.forEach(b => bin += String.fromCharCode(b));
  return 'ME354-' + btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function decodeSetup(code) {
  let s = String(code).trim();
  if (s.startsWith('{')) return JSON.parse(s);
  s = s.replace(/^ME354-/, '').replace(/-/g, '+').replace(/_/g, '/');
  const bin = atob(s);
  return JSON.parse(new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0))));
}
function currentSetup(page, extra = {}) { return Object.assign({ v: 1, m: page.def.id, s: page.S }, extra); }

function applySetup(obj) {
  if (!obj || !obj.m || !App.modules[obj.m]) throw new Error('That code is not for a module on this site.');
  const page = ensurePage(obj.m);
  page.locked = new Set(obj.lock || []);
  for (const [k, c] of Object.entries(page.controls)) {
    if (obj.s && k in obj.s) c.set(obj.s[k]);
    c.disable(page.locked.has(k));
  }
  if (obj.s && obj.s.mat) App.setMaterial(obj.s.mat);
  if (obj.title || obj.note) {
    page.banner.hidden = false;
    page.banner.replaceChildren(h('b', null, obj.title || 'Assignment setup'), obj.note ? h('div', null, obj.note) : null,
      page.locked.size ? h('div', { class: 'note' }, `Locked inputs: ${[...page.locked].map(k => page.controls[k]?.label || k).join(', ')}`) : null);
  } else page.banner.hidden = true;
  page.preset = obj.title ? { title: obj.title, note: obj.note } : null;
  go(obj.m);
  page.schedule();
}

          h('button', { class: 'btn small', type: 'button', onclick: () => asgOut.value && copyText(asgOut.value, asgOut) }, 'Copy'),

/* ---------------- navigation & routing ---------------- */
function buildNav() {
  const nav = $('#nav');
  nav.replaceChildren();
  for (const g of GROUPS) {
    const item = c => c.live
      ? h('a', { href: '#' + c.id, role: 'menuitem' }, h('span', null, c.t), h('span', { class: 'tag' }, c.ch), h('small', null, c.d))
      : h('a', { class: 'soon', role: 'menuitem', 'aria-disabled': 'true', tabindex: '-1' }, h('span', null, c.t), h('span', { class: 'tag' }, 'coming'), h('small', null, c.d));
    const core = CATALOG.filter(c => c.g === g.id && !c.s), stretch = CATALOG.filter(c => c.g === g.id && c.s);
    const menu = h('div', { class: 'menu', hidden: true, role: 'menu' },
      h('div', { class: 'mhead' }, `Ch. ${g.id} · ${g.name}`), core.map(item),
      stretch.length ? h('div', { class: 'mhead stretch' }, 'Stretch topics') : null, stretch.map(item));
    const btn = h('button', { class: 'navbtn', type: 'button', 'aria-haspopup': 'true', 'aria-expanded': 'false' }, h('span', { class: 'chn' }, g.id), g.short, h('span', { class: 'caret' }, '▾'));
    const dd = h('div', { class: 'dd', 'data-group': g.id }, btn, menu);
    btn.addEventListener('click', e => { e.stopPropagation(); const open = menu.hidden; closeMenus(); if (open) { menu.hidden = false; dd.classList.add('open'); btn.setAttribute('aria-expanded', 'true'); } });
    menu.addEventListener('click', e => { if (e.target.closest('a.soon')) e.preventDefault(); else closeMenus(); });
    nav.append(dd);

}
function closeMenus() { $$('.nav .menu').forEach(m => m.hidden = true); $$('.nav .dd').forEach(d => { d.classList.remove('open'); $('button', d).setAttribute('aria-expanded', 'false'); }); }
document.addEventListener('click', closeMenus);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeMenus(); });

const STATIC_VIEWS = {};   // id -> render function for non-module pages
function ensurePage(id) {
  if (!App.pages[id]) {
    const page = buildModulePage(App.modules[id]);
    App.pages[id] = page;
    App.views[id] = page.root;
    $('#app').append(page.root);
    typeset(page.root);
  }
  return App.pages[id];
}
function go(id) { if (location.hash !== '#' + id) location.hash = id; else route(); }
function route() {
  let id = decodeURIComponent(location.hash.slice(1)) || 'home';
  if (id.startsWith('embed-')) { id = id.slice(6); document.body.classList.add('embed'); }
  if (!App.modules[id] && !STATIC_VIEWS[id]) id = 'home';
  for (const v of Object.values(App.views)) v.hidden = true;
  if (App.modules[id]) {
    const page = ensurePage(id);
    if (page.controls.mat && !page.locked.has('mat')) { page.controls.mat.refresh(); page.controls.mat.set(App.mat); if (!page.controls.mat.el.value) page.controls.mat.refresh(); }
    page.root.hidden = false;
    App.current = page;
    page.run();
  } else {
    if (!App.views[id]) { const v = h('section', { class: 'view', id: 'v-' + id }); App.views[id] = v; $('#app').append(v); }
    App.views[id].hidden = false;
    STATIC_VIEWS[id](App.views[id]);
    typeset(App.views[id]);
    App.current = null;
  }
  $$('.nav a.navlink').forEach(a => a.classList.toggle('active', a.dataset.id === id));
  const cat = catById(id);
  $$('.nav .dd').forEach(d => d.classList.toggle('active', !!cat && d.dataset.group === cat.g));
  document.title = (App.modules[id] ? (App.modules[id].title || cat.t) + ' · ' : '') + 'ME 354 Mechanics Lab';
  if (!document.body.classList.contains('embed')) window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);
let _rz;
window.addEventListener('resize', () => { clearTimeout(_rz); _rz = setTimeout(() => { if (App.current) App.current.run(); else if (STATIC_VIEWS.home && App.views.home && !App.views.home.hidden) STATIC_VIEWS.home(App.views.home); }, 120); });

/* ---------------- theme ---------------- */
function initChrome() {
  const order = ['system', 'light', 'dark'];
  let th = store.get('theme', 'system');
  const apply = () => {
    if (th === 'system') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', th);
    $('#themeBtn').textContent = 'Theme: ' + th;
  };
  $('#themeBtn').addEventListener('click', () => { th = order[(order.indexOf(th) + 1) % 3]; store.set('theme', th); apply(); if (App.current) App.current.run(); else route(); });
  apply();
  if (new URLSearchParams(location.search).has('embed')) document.body.classList.add('embed');
  matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', () => { if (App.current) App.current.run(); });
}

function boot() {
  initChrome();
  buildNav();
  route();
}

/* Small SVG plotting library. Colors are resolved to literal values at draw time,
   so a plot copied into a report keeps its look outside the page. */
const Plot = (() => {
  const NS = 'http://www.w3.org/2000/svg';
  const FONT_MONO = "IBM Plex Mono, Menlo, Consolas, monospace";
  const FONT_BODY = "IBM Plex Sans, Segoe UI, Arial, sans-serif";
  const s = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) if (attrs[k] != null) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
  const col = c => { if (!c) return cv('--c1'); if (c[0] === '#' || c.startsWith('rgb') || c === 'none') return c; return cv('--' + c); };

  function niceStep(range, n) { const raw = range / Math.max(1, n); const p = 10 ** Math.floor(Math.log10(raw)); const f = raw / p; return (f < 1.5 ? 1 : f < 3 ? 2 : f < 7 ? 5 : 10) * p; }
  function ticksLin(a, b, n) { const st = niceStep(b - a, n); const t = []; for (let v = Math.ceil(a / st - 1e-9) * st; v <= b + st * 1e-9; v += st) t.push(Math.abs(v) < st * 1e-9 ? 0 : +v.toPrecision(12)); return t; }
  function ticksLog(a, b) {
    const lo = Math.floor(Math.log10(a)), hi = Math.ceil(Math.log10(b)), dec = hi - lo, t = [];
    const mult = dec <= 1 ? [1, 2, 3, 5] : dec <= 3 ? [1, 2, 5] : [1];
    const stepE = dec > 8 ? Math.ceil(dec / 6) : 1;
    for (let e = lo; e <= hi; e += stepE) for (const m of mult) { const v = m * 10 ** e; if (v >= a * 0.999 && v <= b * 1.001) t.push(v); }
    return t;
  }
  function tickLabel(v, log) {
    if (v === 0) return '0';
    const a = Math.abs(v);
    if (log) { const e = Math.log10(a); if (Math.abs(e - Math.round(e)) < 1e-9 && (a >= 1e4 || a < 1e-2)) return '10' + sup(Math.round(e)); }
    if (a >= 1e5 || a < 1e-3) { const e = Math.floor(Math.log10(a)); const m = +(v / 10 ** e).toPrecision(2); return (m === 1 ? '' : m + '×') + '10' + sup(e); }
    return String(+v.toPrecision(4)).replace('-', '−');
  }

  function bounds(series, marks, key) {
    let lo = Infinity, hi = -Infinity;
    const take = v => { if (Number.isFinite(v)) { lo = Math.min(lo, v); hi = Math.max(hi, v); } };
    for (const se of series) if (!se.skipBounds) for (const p of se.data) take(p[key]);
    for (const m of marks || []) {

/* Hero figure: the library on a modulus–density chart (log–log), the classic Ch. 1.5 view. */
function drawHeroAshby(el) {
  const mats = allMaterials();
  const byCls = {};
  mats.forEach(m => (byCls[m.cls] = byCls[m.cls] || []).push(m));
  const colors = { Metal: 'c1', Polymer: 'c3', Ceramic: 'c4', Glass: 'c5', Composite: 'c2', Elastomer: 'c6', Natural: 'c2' };
  const cur = App.material();
  Plot.render(el, {
    h: 300, aria: 'Young’s modulus versus density for the material library',
    x: { label: 'Density ρ (kg/m³)', log: true, min: 300, max: 2e4, short: 'ρ' },
    y: { label: 'Young’s modulus E (GPa)', log: true, min: 1e-3, max: 1e3, short: 'E' },
    series: Object.entries(byCls).map(([cls, ms]) => ({ name: cls, type: 'scatter', color: colors[cls], r: 4.5, data: ms.map(m => [m.rho, m.E]) })),
    marks: [
      { t: 'poly', open: true, pts: [[300, 300 * 1e-2], [2e4, 2e4 * 1e-2]], color: 'muted', dash: '2 4', width: 1, stroke: true },
      { t: 'text', x: 600, y: 600 * 1e-2 / 2.2, text: 'E/ρ = const', anchor: 'start', size: 10.5 },
      { t: 'pt', x: cur.rho, y: cur.E, r: 7, hollow: true, color: 'accent', label: cur.name, top: true },
    ],
    legend: 'br',
  });
}

    fields.map(([k, l, t]) => { const i = h('input', { type: t || 'number', step: 'any', id: 'mf-' + k }); i.value = k === 'name' ? base.name + ' (custom)' : (base[k] ?? ''); inputs[k] = i; return h('label', { class: 'field', for: 'mf-' + k }, l, i); }));
