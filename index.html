/* Module: Beam Bending (Notes Ch. 2, Eq. 2.1–2.21; strain gauges App. A) */

/** Euler–Bernoulli solution for the three cases in the notes.
 *  Inputs in mm, N, GPa. Returns functions of x (mm) and maxima. w > 0 in the load direction (down). */
function beamSolve(S, E_GPa) {
  const L = S.L, P = S.P, E = E_GPa * 1000;                     // E in MPa = N/mm²
  let I, A, c;
  if (S.sec === 'rect') { I = S.b * S.h ** 3 / 12; A = S.b * S.h; c = S.h / 2; }
  else { const r = S.d / 2; I = Math.PI * r ** 4 / 4; A = Math.PI * r * r; c = r; }
  const EI = E * I;
  const a = clamp(S.aL, 0.02, 0.48) * L;
  let V, M, w, wmax, Mmax, Vmax, loads, jumps;
  if (S.case === 'cant') {
    V = () => P;
    M = x => -P * (L - x);
    w = x => P * x * x * (3 * L - x) / (6 * EI);                  // Eq. 2.15
    wmax = P * L ** 3 / (3 * EI); Mmax = P * L; Vmax = P;
    loads = [{ x: L, P, lab: 'P' }]; jumps = [];
  } else if (S.case === '3pt') {
    V = x => x < L / 2 ? P / 2 : -P / 2;                           // Eq. 2.16
    M = x => x < L / 2 ? P * x / 2 : P * (L - x) / 2;              // Eq. 2.17
    const w1 = x => P / (48 * EI) * (3 * L * L * x - 4 * x ** 3); // Eq. 2.18
    w = x => x <= L / 2 ? w1(x) : w1(L - x);
    wmax = P * L ** 3 / (48 * EI); Mmax = P * L / 4; Vmax = P / 2;
    loads = [{ x: L / 2, P, lab: 'P' }]; jumps = [L / 2];
  } else {
    V = x => x < a ? P / 2 : x <= L - a ? 0 : -P / 2;              // Eq. 2.19
    M = x => x < a ? P * x / 2 : x <= L - a ? P * a / 2 : P * (L - x) / 2;   // Eq. 2.20
    const wl = x => x < a ? P * x / (12 * EI) * (3 * a * L - x * x - 3 * a * a)
      : P * a / (12 * EI) * (3 * L * x - a * a - 3 * x * x);        // Eq. 2.21
    w = x => x <= L / 2 ? wl(x) : wl(L - x);
    wmax = P * a * (3 * L * L - 4 * a * a) / (48 * EI); Mmax = P * a / 2; Vmax = P / 2;
    loads = [{ x: a, P: P / 2, lab: 'P/2' }, { x: L - a, P: P / 2, lab: 'P/2' }]; jumps = [a, L - a];
  }
  const sigmax = Mmax * c / I;                                     // Eq. 2.8
  const taumax = S.sec === 'rect' ? 1.5 * Vmax / A : 4 * Vmax / (3 * A);  // Eq. 2.9 (rect), 4V/3A (circle)
  const tauZ = (Vx, z) => S.sec === 'rect' ? Vx / (2 * I) * (S.h * S.h / 4 - z * z) : Vx * (c * c - z * z) / (3 * I);
  return { L, P, E, I, A, c, EI, a, V, M, w, wmax, Mmax, Vmax, sigmax, taumax, tauZ, loads, jumps };
}

function drawBeamSchematic(el, S, R) {
  const W = Math.max(300, el.clientWidth || 600), H = 196;
  const xa = 46, xb = W - 34, yb = 78, th = 12;
  const X = x => xa + x / R.L * (xb - xa);
  const C = { ink: cv('--ink'), muted: cv('--muted'), acc: cv('--accent'), gold: cv('--c2'), surf: cv('--surface'), beam: cv('--surface-2'), line: cv('--line'), bad: cv('--c4') };
  const s = Plot.s;
  const svg = s('svg', { viewBox: `0 0 ${W} ${H}`, width: W, height: H, role: 'img', 'aria-label': 'Beam schematic', 'font-family': 'IBM Plex Mono, Menlo, monospace' });
  s('rect', { x: 0, y: 0, width: W, height: H, fill: C.surf }, svg);
  const defs = s('defs', {}, svg);
  const mk = s('marker', { id: 'bmArr', viewBox: '0 0 10 10', refX: 9, refY: 5, markerWidth: 6, markerHeight: 6, orient: 'auto-start-reverse' }, defs);
  s('path', { d: 'M0,0 L10,5 L0,10 z', fill: C.ink }, mk);
  const mkA = s('marker', { id: 'bmArrA', viewBox: '0 0 10 10', refX: 9, refY: 5, markerWidth: 7, markerHeight: 7, orient: 'auto' }, defs);
  s('path', { d: 'M0,0 L10,5 L0,10 z', fill: C.acc }, mkA);

  // supports
  if (S.case === 'cant') {
    s('rect', { x: xa - 16, y: yb - 34, width: 16, height: 68, fill: C.beam, stroke: C.muted }, svg);
    for (let i = 0; i < 7; i++) s('line', { x1: xa - 16, y1: yb - 30 + i * 10, x2: xa - 4, y2: yb - 40 + i * 10, stroke: C.muted }, svg);
  } else {
    const tri = (x, roller) => {
      s('path', { d: `M${x},${yb + th / 2} l-10,16 h20 z`, fill: C.beam, stroke: C.ink, 'stroke-width': 1.2 }, svg);
      if (roller) { s('circle', { cx: x - 5, cy: yb + th / 2 + 20, r: 3.5, fill: 'none', stroke: C.ink }, svg); s('circle', { cx: x + 5, cy: yb + th / 2 + 20, r: 3.5, fill: 'none', stroke: C.ink }, svg); }
      s('line', { x1: x - 14, x2: x + 14, y1: yb + th / 2 + (roller ? 25 : 17), y2: yb + th / 2 + (roller ? 25 : 17), stroke: C.ink }, svg);
    };
    tri(X(0), false); tri(X(R.L), true);
  }
  // deflected shape (exaggerated)
  const N = 80, scale = R.wmax > 0 ? 30 / R.wmax : 0;
  let d = '';
  for (let i = 0; i <= N; i++) { const x = R.L * i / N; d += (i ? 'L' : 'M') + X(x).toFixed(1) + ',' + (yb + R.w(x) * scale).toFixed(1); }
  // undeformed beam
  s('rect', { x: X(0), y: yb - th / 2, width: X(R.L) - X(0), height: th, fill: C.beam, stroke: C.ink, 'stroke-width': 1.2 }, svg);
  s('path', { d, fill: 'none', stroke: C.acc, 'stroke-width': 2, 'stroke-dasharray': '6 4' }, svg);
  // loads
  for (const ld of R.loads) {
    const x = X(ld.x);
    s('line', { x1: x, y1: yb - th / 2 - 46, x2: x, y2: yb - th / 2 - 2, stroke: C.ink, 'stroke-width': 2, 'marker-end': 'url(#bmArr)' }, svg);
    const t = s('text', { x: x + 6, y: yb - th / 2 - 36, 'font-size': 12, fill: C.ink }, svg); t.textContent = ld.lab;
  }
  // probe section & gauge
  const xp = X(S.xp * R.L);
  s('line', { x1: xp, y1: yb - 30, x2: xp, y2: yb + 32, stroke: C.gold, 'stroke-width': 1.4, 'stroke-dasharray': '3 3' }, svg);
  s('rect', { x: xp - 7, y: S.gauge === 'top' ? yb - th / 2 - 4 : yb + th / 2, width: 14, height: 4, fill: C.gold }, svg);
  const tp = s('text', { x: xp + 5, y: yb + 44, 'font-size': 11, fill: C.gold }, svg); tp.textContent = `x = ${fmt(S.xp * R.L, 3)} mm`;
  // dimensions
  const yd = H - 18;
  s('line', { x1: X(0), x2: X(R.L), y1: yd, y2: yd, stroke: C.muted, 'marker-start': 'url(#bmArr)', 'marker-end': 'url(#bmArr)' }, svg);
  const tl = s('text', { x: (X(0) + X(R.L)) / 2, y: yd - 5, 'font-size': 11.5, fill: C.muted, 'text-anchor': 'middle' }, svg); tl.textContent = `L = ${fmt(R.L, 4)} mm`;
  if (S.case === '4pt') {
    const y2 = yd - 22;
    s('line', { x1: X(0), x2: X(R.a), y1: y2, y2, stroke: C.muted, 'marker-start': 'url(#bmArr)', 'marker-end': 'url(#bmArr)' }, svg);
    const ta = s('text', { x: (X(0) + X(R.a)) / 2, y: y2 - 4, 'font-size': 11, fill: C.muted, 'text-anchor': 'middle' }, svg); ta.textContent = `a = ${fmt(R.a, 3)}`;
  }
  const tx = s('text', { x: W - 8, y: 14, 'font-size': 10.5, fill: C.muted, 'text-anchor': 'end' }, svg);
  tx.textContent = R.wmax > 0 ? `dashed: deflected shape, exaggerated ×${fmt(scale, 2)}` : '';
  el.replaceChildren(svg);
}

defineModule({
  id: 'beam',
  title: 'Beam Bending',
  eq: 'Eq. 2.1–2.21',
  lede: 'Euler–Bernoulli beams in the three loading cases from the notes. Change the geometry, load and material to see the shear, moment and deflection, the stresses through the section, and the strain a gauge would read.',
  theory: String.raw`
    <div><p>Plane sections stay plane and normal to the beam axis, deflections are small and the material is linear elastic. The deflection \(w(x)\) then obeys one equation:</p>
      <div class="eq">\[ EI\,\frac{d^4 w}{dx^4} = q(x) \qquad M = -EI\,\frac{d^2w}{dx^2},\quad Q = -EI\,\frac{d^3w}{dx^3} \]</div>
      <p class="eqn">Eq. 2.2 – 2.4</p>
      <p>Bending stress varies linearly from the neutral axis; transverse shear is parabolic and peaks at the neutral axis.</p>
      <div class="eq">\[ \sigma = \frac{Mz}{I},\quad \tau = \frac{QA'\bar z'}{Ib},\quad \sigma_{max} = \frac{Mh}{2I},\quad \tau_{max} = \frac{3Q}{2bh} \]</div>
      <p class="eqn">Eq. 2.6 – 2.9 · rectangle \(I = bh^3/12\), circle \(I = \pi r^4/4\)</p></div>
    <div><p>Maximum deflection and bending stress for a rectangular beam:</p>
      <div class="eq">\[ \text{Cantilever: } w_{max} = \frac{PL^3}{3EI},\quad \sigma_{max} = \frac{6PL}{bh^2} \]</div>
      <div class="eq">\[ \text{3-point: } w_{max} = \frac{PL^3}{48EI},\quad \sigma_{max} = \frac{3PL}{2bh^2} \]</div>
      <div class="eq">\[ \text{4-point: } w_{max} = \frac{Pa}{48EI}(3L^2-4a^2),\quad \sigma_{max} = \frac{3Pa}{bh^2} \]</div>
      <p class="eqn">Eq. 2.15, 2.18, 2.21 · in 4-point bending each load is \(P/2\)</p>
      <p>A strain gauge on the surface reads \(\varepsilon = \sigma/E\) (App. A). In this module \(z\) points up, so a sagging moment puts the top surface in compression.</p></div>`,

  build(p) {
    p.group('Loading');
    p.seg('case', { label: 'Case', value: '3pt', options: [['cant', 'Cantilever'], ['3pt', '3-point'], ['4pt', '4-point']] });
    p.num('P', { label: 'Total load P', unit: 'N', min: 0, max: 5000, step: 1, value: 200 });
    p.num('aL', { label: 'Load offset a/L (4-point)', min: 0.05, max: 0.45, step: 0.01, value: 0.33 });
    p.group('Geometry');
    p.num('L', { label: 'Span L', unit: 'mm', min: 20, max: 2000, step: 1, value: 300 });
    p.seg('sec', { label: 'Cross-section', value: 'rect', options: [['rect', 'Rectangle'], ['circ', 'Circle']] });
    p.num('b', { label: 'Width b', unit: 'mm', min: 1, max: 200, step: 0.1, value: 25 });
    p.num('h', { label: 'Height h', unit: 'mm', min: 0.5, max: 200, step: 0.1, value: 6 });
    p.num('d', { label: 'Diameter d', unit: 'mm', min: 0.5, max: 200, step: 0.1, value: 10 });
    p.group('Material');
    p.material();
    p.group('Section and strain gauge');
    p.num('xp', { label: 'Section position x/L', min: 0, max: 1, step: 0.01, value: 0.5 });
    p.seg('gauge', { label: 'Gauge surface', value: 'top', options: [['top', 'Top'], ['bot', 'Bottom']] });
    p.chk('cmp', { label: 'Compare with my measured strain', value: false });
    p.num('meas', { label: 'Measured strain', unit: 'µε', min: -5000, max: 5000, step: 1, value: -1400 });

    p.schem = h('div', { class: 'schem' });
    const top = p.panel('Setup');
    p.flags = h('div', { style: { display: 'flex', gap: '8px', flexWrap: 'wrap', marginTop: '8px' } });
    top.append(p.schem, p.flags);
    p.ro = p.panel('Results', 'Eq. 2.8, 2.9, 2.15–2.21');
    const dg = p.panel('Shear, moment and deflection along the beam', 'Eq. 2.16–2.21');
    p.pV = h('div'); p.pM = h('div'); p.pW = h('div');
    dg.append(p.pV, p.pM, p.pW);
    const sec = p.panel('Stresses through the section at x', 'Eq. 2.6–2.7');
    p.pS = h('div'); p.pT = h('div');
    sec.append(h('div', { class: 'two' }, p.pS, p.pT));
    const cc = p.panel('Concept checks');
    cc.append(
      h('p', { class: 'concept' }, h('b', null, 'Plane sections (2.1). '), 'Does assuming plane sections stay plane over-predict or under-predict the stiffness? Shorten the span until L/h drops below 10 and watch the shear stress grow relative to the bending stress.'),
      h('p', { class: 'concept' }, h('b', null, 'Gauge placement. '), 'In 4-point bending the moment is constant between the loads. Move the section between them: why does the gauge reading stop changing, and why is that region used for measuring E?'));
  },

  update(p) {
    const S = p.S, mat = getMat(S.mat);
    const isRect = S.sec === 'rect';
    p.controls.b.wrap.hidden = !isRect; p.controls.h.wrap.hidden = !isRect; p.controls.d.wrap.hidden = isRect;
    p.controls.aL.wrap.hidden = S.case !== '4pt';
    p.controls.meas.wrap.hidden = !S.cmp;
    const R = beamSolve(S, mat.E);
    const xpx = S.xp * R.L;
    const Mx = R.M(xpx), Vx = R.V(xpx);
    const zc = S.gauge === 'top' ? R.c : -R.c;
    const epsG = -Mx * zc / R.I / R.E * 1e6;           // µε, z up: σ = −Mz/I
    const fos = mat.sy / R.sigmax;
    const Py = R.P > 0 ? R.P * fos : NaN;
    const depth = isRect ? S.h : S.d;

    drawBeamSchematic(p.schem, S, R);
    const flags = [];
    if (fos < 1) flags.push(h('span', { class: 'pill bad' }, `Yields: σmax exceeds ${mat.brittle ? 'the strength' : 'σy'} of ${mat.name}; the elastic results no longer apply`));
    else flags.push(h('span', { class: 'pill ' + (fos >= 2 ? 'ok' : 'warn') }, `Elastic, factor of safety ${fmt(fos, 3)} on ${mat.brittle ? 'strength' : 'yield'}`));
    if (R.L / depth < 10) flags.push(h('span', { class: 'pill warn' }, `Short beam: L/${isRect ? 'h' : 'd'} = ${fmt(R.L / depth, 3)} < 10, shear deformation matters (Timoshenko)`));
    if (R.wmax / R.L > 0.05) flags.push(h('span', { class: 'pill warn' }, `Large deflection: w/L = ${fmt(R.wmax / R.L, 2)}, small-deflection theory is inaccurate`));
    p.flags.replaceChildren(...flags);

    const items = [
      { k: 'Second moment I', v: R.I, u: 'mm⁴' },
      { k: 'Max deflection', v: R.wmax, u: 'mm', eq: S.case === 'cant' ? '2.15' : S.case === '3pt' ? '2.18' : '2.21' },
      { k: 'Max moment', v: R.Mmax / 1000, u: 'N·m' },
      { k: 'Max bending stress', v: R.sigmax, u: 'MPa', eq: '2.8' },
      { k: 'Max shear stress', v: R.taumax, u: 'MPa', eq: '2.9' },
      { k: 'σmax / τmax', v: R.sigmax / R.taumax },
      { k: 'Factor of safety', v: fos, cls: fos < 1 ? 'bad' : fos < 2 ? 'warn' : 'ok', eq: '4.31' },
      { k: 'Load at first yield', v: Py, u: 'N' },
      { k: 'Stiffness P/w', v: R.P / R.wmax, u: 'N/mm' },
      { k: `Gauge strain (${S.gauge === 'top' ? 'top' : 'bottom'})`, v: epsG, u: 'µε' },
    ];
    if (S.cmp) {
      const err = (S.meas - epsG) / Math.abs(epsG) * 100;
      items.push({ k: 'Measured vs theory', v: (err >= 0 ? '+' : '') + fmt(err, 3), u: '%', cls: Math.abs(err) < 5 ? 'ok' : Math.abs(err) < 15 ? 'warn' : 'bad' });
    }
    p.readouts(p.ro, items);

    // diagrams
    const xs = [];
    const n = 240;
    for (let i = 0; i <= n; i++) xs.push(R.L * i / n);
    for (const j of R.jumps) xs.push(j - 1e-9 * R.L, j + 1e-9 * R.L);
    xs.sort((a, b) => a - b);
    const probe = { t: 'vline', x: xpx, color: 'c2', dash: '3 3' };
    Plot.render(p.pV, { h: 160, x: { label: '', short: 'x' }, y: { label: 'Q (N)', short: 'Q', zero: true }, series: [{ type: 'area', color: 'c3', data: xs.map(x => [x, R.V(x)]) }], marks: [probe], mb: 22 });
    Plot.render(p.pM, { h: 160, x: { label: '', short: 'x' }, y: { label: 'M (N·m)', short: 'M', zero: true }, series: [{ type: 'area', color: 'c1', data: xs.map(x => [x, R.M(x) / 1000]) }], marks: [probe], mb: 22 });
    Plot.render(p.pW, { h: 180, x: { label: 'x (mm)', short: 'x' }, y: { label: 'w (mm), down', short: 'w', invert: true, min: -0.08 * R.wmax, max: 1.35 * R.wmax || 1 }, series: [{ color: 'accent', width: 2.5, data: xs.map(x => [x, R.w(x)]) }], marks: [probe, { t: 'pt', x: S.case === 'cant' ? R.L : R.L / 2, y: R.wmax, label: `w max ${fmt(R.wmax, 3)} mm`, color: 'accent', anchor: S.case === 'cant' ? 'end' : 'start', dx: S.case === 'cant' ? -8 : 8, dy: 16 }] });

    // section stresses
    const zs = linspace(-R.c, R.c, 81);
    const sig = zs.map(z => [-Mx * z / R.I, z]);
    const tau = zs.map(z => [R.tauZ(Vx, z), z]);
    const ylab = { label: 'z (mm), up', short: 'z', pad: 0.04 };
    Plot.render(p.pS, { h: 230, title: `Bending stress σ at x = ${fmt(xpx, 3)} mm`, x: { label: 'σ (MPa)', short: 'σ', zero: true }, y: ylab, series: [{ type: 'line', color: 'c1', width: 2.5, data: sig }], marks: [{ t: 'poly', pts: [[0, -R.c]].concat(sig, [[0, R.c]]), fill: 'c1', stroke: false, opacity: .15 }] });
    Plot.render(p.pT, { h: 230, title: `Transverse shear τ at x = ${fmt(xpx, 3)} mm`, x: { label: 'τ (MPa)', short: 'τ', zero: true }, y: ylab, series: [{ type: 'line', color: 'c3', width: 2.5, data: tau }], marks: [{ t: 'poly', pts: [[0, -R.c]].concat(tau, [[0, R.c]]), fill: 'c3', stroke: false, opacity: .15 }] });
  },
});

/* Module: Mohr's Circle for Stress (Notes 3.1.2–3.1.4, Eq. 3.5–3.16)
   Convention from the notes: θ is measured counterclockwise from x to x′; a positive σxy acts in +y on the +x face. */

const MOHR_PRESETS = {
  notes: { label: 'Notes example (3.1.4)', sx: 16, sy: 10, txy: 4 },
  shear: { label: 'Pure shear (3.1.4)', sx: 0, sy: 0, txy: 50 },
  uni: { label: 'Uniaxial tension', sx: 100, sy: 0, txy: 0 },
  biax: { label: 'Equal biaxial tension', sx: 100, sy: 100, txy: 0 },
  vessel: { label: 'Pressure vessel wall (σhoop = 2σaxial)', sx: 50, sy: 100, txy: 0 },
  shaft: { label: 'Shaft in tension + torsion', sx: 80, sy: 0, txy: 60 },
};
const wrap90 = d => { let x = ((d + 90) % 180 + 180) % 180 - 90; return x === -90 ? 90 : x; };

function mohrSolve(sx, sy, txy, thDeg) {
  const C = (sx + sy) / 2, a = (sx - sy) / 2, R = Math.hypot(a, txy);
  const th = thDeg * Math.PI / 180, c2 = Math.cos(2 * th), s2 = Math.sin(2 * th);
  const sxp = C + a * c2 + txy * s2;                 // Eq. 3.8 (same as 3.5)
  const syp = C - a * c2 - txy * s2;                 // Eq. 3.6
  const txyp = txy * c2 - a * s2;                    // Eq. 3.9 (same as 3.7)
  const tol = 1e-9 * Math.max(Math.abs(sx), Math.abs(sy), Math.abs(txy), 1e-12);
  const hydro = R <= tol;
  const thp = hydro ? NaN : 0.5 * Math.atan2(2 * txy, sx - sy) * 180 / Math.PI;   // Eq. 3.14, direction of σ1
  const ths = hydro ? NaN : wrap90(thp - 45);        // face carrying +τmax
  const pr = [C + R, C - R, 0];
  const tauAbs = (Math.max(...pr) - Math.min(...pr)) / 2;
  return { C, a, R, sxp, syp, txyp, s1: C + R, s2: C - R, thp, ths, tauAbs, hydro, phiX: Math.atan2(txy, a) };
}

/* Eigen-decomposition of the 2D stress matrix (Eq. 3.15–3.16), done the long way so students can follow it. */
function mohrEigen(sx, sy, txy) {
  const tr = sx + sy, det = sx * sy - txy * txy;
  const disc = Math.sqrt(Math.max(0, tr * tr / 4 - det));
  const l1 = tr / 2 + disc, l2 = tr / 2 - disc;
  const vec = l => {
    let v;
    if (Math.abs(txy) > 1e-12 * Math.max(1, Math.abs(sx), Math.abs(sy))) v = [txy, l - sx];
    else v = (Math.abs(l - sx) <= Math.abs(l - sy)) ? [1, 0] : [0, 1];
    const n = Math.hypot(v[0], v[1]); v = [v[0] / n, v[1] / n];
    if (v[0] < 0 || (v[0] === 0 && v[1] < 0)) v = [-v[0], -v[1]];
    return v;
  };
  const v1 = vec(l1), v2 = vec(l2);
  if (disc === 0) { v1[0] = 1; v1[1] = 0; v2[0] = 0; v2[1] = 1; }
  const ang = v => wrap90(Math.atan2(v[1], v[0]) * 180 / Math.PI);
  return { tr, det, l1, l2, v1, v2, a1: ang(v1), a2: ang(v2) };
}

/* Shared Mohr's-circle plots. The same math serves stress (σ, τ) and strain (ε, γ/2 = εxy, Eq. 3.22–3.24). */
const MOHR_STRESS = { unit: 'MPa', n: 'σ', s: 'τ', nLabel: 'Normal stress σ', sLabel: 'Shear τ', yLabel: 'Stress', p1: 'σ1', p2: 'σ2', smax: 'τmax', xp: 'σx′', yp: 'σy′', sp: 'τx′y′' };
const MOHR_STRAIN = { unit: 'µε', n: 'ε', s: 'γ/2', nLabel: 'Normal strain ε', sLabel: 'Half shear strain γ/2', yLabel: 'Strain', p1: 'ε1', p2: 'ε2', smax: 'γmax/2', xp: 'εx′', yp: 'εy′', sp: 'γx′y′/2' };
const mohrDirNote = (down, s) => down
  ? `${s} is plotted positive downward, so turning the element counterclockwise by θ turns the x′ point counterclockwise by 2θ.`
  : `${s} is plotted positive upward, so turning the element counterclockwise by θ turns the x′ point clockwise by 2θ.`;

/* o: { x, y, xy, th, M (from mohrSolve), down, show3d, gauges: [{lab, ang}], ...MOHR_STRESS or MOHR_STRAIN } */
function mohrCirclePlot(el, o) {
  const M = o.M, down = o.down;
  const circ = (c, r, n = 180) => Array.from({ length: n + 1 }, (_, i) => { const f = 2 * Math.PI * i / n; return [c + r * Math.cos(f), r * Math.sin(f)]; });
  const series = [{ name: 'In-plane circle', color: 'accent', width: 2.5, data: circ(M.C, M.R) }];
  if (o.show3d) {
    const [a, b, c] = [M.s1, M.s2, 0].sort((x, y) => y - x);
    series.push({ name: `3D circles (${o.n}z = 0)`, color: 'c6', width: 1.5, dash: '5 4', data: circ((a + c) / 2, (a - c) / 2) });
    series.push({ color: 'c6', width: 1.5, dash: '5 4', data: circ((a + b) / 2, (a - b) / 2) });
    series.push({ color: 'c6', width: 1.5, dash: '5 4', data: circ((b + c) / 2, (b - c) / 2) });
  }
  if (!o.gauges) {
    series.push({ name: 'x, y faces', color: 'c6', width: 1.5, data: [[o.x, o.xy], [o.y, -o.xy]], hover: false });
    series.push({ name: 'x′, y′ faces', color: 'c4', width: 2, data: [[M.sxp, M.txyp], [M.syp, -M.txyp]], hover: false });
  }
  const marks = [{ t: 'pt', x: M.C, y: 0, r: 3, color: 'muted', label: 'C', dy: down ? -7 : 14, dx: 4 }];
  if (o.gauges) {
    for (const g of o.gauges) {
      const q = mohrSolve(o.x, o.y, o.xy, g.ang);
      marks.push({ t: 'poly', open: true, pts: [[M.C, 0], [q.sxp, q.txyp]], color: 'c5', width: 1.2, dash: '3 3', skipBounds: true },
        { t: 'pt', x: q.sxp, y: q.txyp, r: 5, color: 'c5', label: `${g.lab} (${fmt(g.ang, 3)}°)`, top: true });
    }
  } else {
    marks.push(
      { t: 'pt', x: o.x, y: o.xy, r: 4.5, color: 'c6', label: 'x', top: true },
      { t: 'pt', x: o.y, y: -o.xy, r: 4.5, color: 'c6', hollow: true, label: 'y', top: true },
      { t: 'pt', x: M.sxp, y: M.txyp, r: 5.5, color: 'c4', label: 'x′', top: true },
      { t: 'pt', x: M.syp, y: -M.txyp, r: 5.5, color: 'c4', hollow: true, label: 'y′', top: true });
  }
  if (!M.hydro) {
    marks.push(
      { t: 'pt', x: M.s1, y: 0, r: 4, color: 'c2', label: o.p1, dy: down ? -8 : 16, dx: 7, top: true },
      { t: 'pt', x: M.s2, y: 0, r: 4, color: 'c2', label: o.p2, dy: down ? -8 : 16, anchor: 'end', dx: -7, top: true },
      { t: 'pt', x: M.C, y: M.R, r: 3.5, color: 'c3', label: o.smax, dx: 6 },
      { t: 'pt', x: M.C, y: -M.R, r: 3.5, color: 'c3' });
    if (!o.gauges && Math.abs(o.th) > 0.05) {
      const arcR = 0.32 * M.R, f0 = M.phiX, f1 = M.phiX - 2 * o.th * Math.PI / 180, fm = (f0 + f1) / 2;
      const arc = Array.from({ length: 41 }, (_, i) => { const f = f0 + (f1 - f0) * i / 40; return [M.C + arcR * Math.cos(f), arcR * Math.sin(f)]; });
      marks.push({ t: 'poly', open: true, pts: arc, color: 'c2', width: 1.5, skipBounds: true },
        { t: 'text', x: M.C + arcR * 1.35 * Math.cos(fm), y: arcR * 1.35 * Math.sin(fm), text: '2θ', color: 'c2', anchor: 'middle', dy: 4 });
    }
  }
  Plot.render(el, {
    h: 330, equal: true, aria: "Mohr's circle",
    x: { label: `${o.nLabel} (${o.unit})`, short: o.n, zero: true, pad: 0.12 },
    y: { label: `${o.sLabel} (${o.unit}), positive ${down ? 'down' : 'up'}`, short: o.s, zero: true, invert: down, pad: 0.12 },
    series, marks, legend: 'tl',
  });
}

/* Rotated-face quantities over −90…90°, with θ, θp and θs marked. o.gauges adds the gauge angles. */
function mohrAnglePlot(el, o) {
  const M = o.M;
  const T = linspace(-90, 90, 181).map(t => [t, mohrSolve(o.x, o.y, o.xy, t)]);
  const am = [];
  if (o.th != null) am.push({ t: 'vline', x: o.th, color: 'c4', dash: '', width: 1.5, label: 'θ' });
  if (!M.hydro) am.push({ t: 'vline', x: M.thp, color: 'c2', label: 'θp', dy: 14 }, { t: 'vline', x: M.ths, color: 'c3', label: 'θs', dy: 28 });
  for (const g of o.gauges || []) {
    const q = mohrSolve(o.x, o.y, o.xy, g.ang);
    am.push({ t: 'pt', x: wrap90(g.ang), y: q.sxp, r: 5, color: 'c5', label: g.lab, top: true });
  }
  Plot.render(el, {
    h: 330, aria: 'Rotated quantities versus angle',
    x: { label: 'θ (degrees)', short: 'θ', min: -90, max: 90, ticks: [-90, -45, 0, 45, 90] },
    y: { label: `${o.yLabel} (${o.unit})`, short: o.n, zero: true },
    series: [
      { name: o.xp, color: 'c1', width: 2.5, data: T.map(([t, m]) => [t, m.sxp]) },
      { name: o.yp, color: 'c5', width: 2, dash: '6 4', data: T.map(([t, m]) => [t, m.syp]) },
      { name: o.sp, color: 'c3', width: 2.5, data: T.map(([t, m]) => [t, m.txyp]) },
    ],
    marks: am, legend: 'br',
  });
}

/* Small helpers for the worked-matrix panels */
const matEl = (rows, f = v => fmt(v, 4)) => h('span', { class: 'mat', style: { gridTemplateColumns: `repeat(${rows[0].length}, auto)` } }, rows.flat().map(v => h('span', null, typeof v === 'string' ? v : f(v))));
const signTerm = (v, suffix, f = v => fmt(v, 4)) => (v < 0 ? ' − ' : ' + ') + f(Math.abs(v)) + suffix;

function drawStressElements(el, S, M) {
  const W = Math.max(300, el.clientWidth || 600);
  const wide = W >= 560;
  const s = Plot.s;
  const C = { ink: cv('--ink'), muted: cv('--muted'), acc: cv('--accent'), surf: cv('--surface'), fill: cv('--surface-2'), ten: cv('--c4'), com: cv('--c5'), sh: cv('--c3'), gold: cv('--c2') };
  const half = Math.max(30, Math.min(wide ? W / 4 : W / 2, 150) * 0.3);
  const reach = half + 14 + 8 + 30 + 16;           // face + gap + longest arrow + label
  const cellH = 2 * reach + 48;
  const H = wide ? cellH : 2 * cellH;
  const svg = s('svg', { viewBox: `0 0 ${W} ${H}`, width: W, height: H, role: 'img', 'aria-label': 'Stress element on x–y axes and rotated by θ', 'font-family': 'IBM Plex Mono, Menlo, monospace' });
  s('rect', { x: 0, y: 0, width: W, height: H, fill: C.surf }, svg);
  const defs = s('defs', {}, svg);
  const mk = (id, col) => { const m = s('marker', { id, viewBox: '0 0 10 10', refX: 9, refY: 5, markerWidth: 6, markerHeight: 6, orient: 'auto' }, defs); s('path', { d: 'M0,0 L10,5 L0,10 z', fill: col }, m); };
  mk('mhT', C.ten); mk('mhC', C.com); mk('mhS', C.sh); mk('mhA', C.acc); mk('mhM', C.muted);
  const maxAbs = Math.max(Math.abs(S.sx), Math.abs(S.sy), Math.abs(S.txy), Math.abs(M.s1), Math.abs(M.s2), 1e-12);
  const tiny = 1e-9 * maxAbs;
  const len = v => 8 + 30 * Math.abs(v) / maxAbs;

  const element = (cx, cy, thD, nx, ny, nxy, title, names) => {
    const t = thD * Math.PI / 180, ex = [Math.cos(t), Math.sin(t)], ey = [-Math.sin(t), Math.cos(t)];
    const P = (x, y) => [cx + x, cy - y];
    const line = (x0, y0, x1, y1, col, id, w = 2.2, dash) => { const a = P(x0, y0), b = P(x1, y1); s('line', { x1: a[0].toFixed(1), y1: a[1].toFixed(1), x2: b[0].toFixed(1), y2: b[1].toFixed(1), stroke: col, 'stroke-width': w, 'marker-end': id ? `url(#${id})` : null, 'stroke-dasharray': dash || null }, svg); };
    const text = (x, y, str, col, anchor = 'middle', size = 11.5) => { const p = P(x, y); const e = s('text', { x: p[0].toFixed(1), y: (p[1] + 4).toFixed(1), fill: col, 'font-size': size, 'text-anchor': anchor }, svg); e.textContent = str; };
    const corners = [[1, 1], [-1, 1], [-1, -1], [1, -1]].map(([u, v]) => P(half * (u * ex[0] + v * ey[0]), half * (u * ex[1] + v * ey[1])));
    s('path', { d: 'M' + corners.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join('L') + 'Z', fill: C.fill, stroke: C.ink, 'stroke-width': 1.4 }, svg);
    // axes drawn inside the element
    const ax = half * 0.55;
    if (Math.abs(thD) > 0.05) {
      line(0, 0, ax, 0, C.muted, 'mhM', 1, '3 3');
      const r = half * 0.38, n = 24, pts = [];
      for (let i = 0; i <= n; i++) { const a = t * i / n; pts.push(P(r * Math.cos(a), r * Math.sin(a))); }
      s('path', { d: 'M' + pts.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join('L'), fill: 'none', stroke: C.gold, 'stroke-width': 1.5 }, svg);
      text(r * 1.25 * Math.cos(t / 2) + 4, r * 1.25 * Math.sin(t / 2), 'θ', C.gold, 'start', 12);
    }
    line(0, 0, ax * ex[0], ax * ex[1], C.acc, 'mhA', 1.5);
    line(0, 0, ax * ey[0], ax * ey[1], C.acc, 'mhA', 1.5);
    text((ax + 9) * ex[0], (ax + 9) * ex[1], names[0], C.acc, 'middle', 11);
    text((ax + 9) * ey[0], (ax + 9) * ey[1], names[1], C.acc, 'middle', 11);
    // tractions on the four faces
    const neg = v => [-v[0], -v[1]];
    const faces = [
      { n: ex, td: ey, sn: nx, ss: nxy, lab: 'σ' + names[0] },
      { n: ey, td: ex, sn: ny, ss: nxy, lab: 'σ' + names[1] },
      { n: neg(ex), td: neg(ey), sn: nx, ss: nxy },
      { n: neg(ey), td: neg(ex), sn: ny, ss: nxy },
    ];
    for (const f of faces) {
      if (Math.abs(f.sn) > tiny) {
        const r0 = half + 14, r1 = r0 + len(f.sn);
        if (f.sn > 0) line(f.n[0] * r0, f.n[1] * r0, f.n[0] * r1, f.n[1] * r1, C.ten, 'mhT');
        else line(f.n[0] * r1, f.n[1] * r1, f.n[0] * r0, f.n[1] * r0, C.com, 'mhC');
        if (f.lab) text(f.n[0] * (r1 + 13), f.n[1] * (r1 + 13), f.lab, f.sn > 0 ? C.ten : C.com);
      }
      if (Math.abs(f.ss) > tiny) {
        const off = half + 5, L = Math.min(len(f.ss), 1.6 * half), d = Math.sign(f.ss);
        const bx = f.n[0] * off, by = f.n[1] * off;
        line(bx - d * f.td[0] * L / 2, by - d * f.td[1] * L / 2, bx + d * f.td[0] * L / 2, by + d * f.td[1] * L / 2, C.sh, 'mhS');
      }
    }
    const tt = s('text', { x: cx, y: cy - reach - 6, 'text-anchor': 'middle', 'font-size': 12.5, 'font-weight': 600, fill: C.ink, 'font-family': 'IBM Plex Sans, Segoe UI, Arial, sans-serif' }, svg); tt.textContent = title;
    const vals = s('text', { x: cx, y: cy + reach + 16, 'text-anchor': 'middle', 'font-size': 11.5, fill: C.muted }, svg);
    vals.textContent = `σ${names[0]} = ${fmt(nx, 4)}   σ${names[1]} = ${fmt(ny, 4)}   τ = ${fmt(nxy, 4)} MPa`;
  };
  const c1 = wide ? [W * 0.25, reach + 26] : [W / 2, reach + 26];
  const c2 = wide ? [W * 0.75, reach + 26] : [W / 2, cellH + reach + 26];
  element(c1[0], c1[1], 0, S.sx, S.sy, S.txy, 'Original axes x, y', ['x', 'y']);
  element(c2[0], c2[1], S.th, M.sxp, M.syp, M.txyp, `Rotated θ = ${fmt(S.th, 4)}°`, ['x′', 'y′']);
  el.replaceChildren(svg);
}

defineModule({
  id: 'mohr',
  title: "Mohr's Circle for Stress",
  eq: 'Eq. 3.5–3.16',
  lede: 'Rotate a 2D stress state and watch the stresses on the rotated face trace out Mohr’s circle. Find the principal stresses and the maximum shear graphically, then check them with the eigenvalue method.',
  theory: String.raw`
    <div><p>Cutting the stressed body on a plane at angle \(\theta\) (counterclockwise from \(x\)) and balancing forces gives the stresses on the rotated axes:</p>
      <div class="eq">\[ \sigma_{x'} = \sigma_x\cos^2\theta + \sigma_y\sin^2\theta + 2\sigma_{xy}\sin\theta\cos\theta \]</div>
      <div class="eq">\[ \sigma_{y'} = \sigma_x\sin^2\theta + \sigma_y\cos^2\theta - 2\sigma_{xy}\sin\theta\cos\theta \]</div>
      <div class="eq">\[ \sigma_{x'y'} = \sigma_{xy}(\cos^2\theta - \sin^2\theta) + (\sigma_y - \sigma_x)\sin\theta\cos\theta \]</div>
      <p class="eqn">Eq. 3.5 – 3.7 · the same result as the change of basis \(\underline{\sigma}' = \underline{R}^T\underline{\sigma}\,\underline{R}\), Eq. 3.11</p>
      <p>Written with double angles, \(\sigma = \tfrac12(\sigma_x+\sigma_y) + \tfrac12(\sigma_x-\sigma_y)\cos 2\theta + \sigma_{xy}\sin 2\theta\) and \(\tau = \sigma_{xy}\cos 2\theta - \tfrac12(\sigma_x-\sigma_y)\sin 2\theta\) (Eq. 3.8–3.9). Eliminating \(\theta\) gives a circle:</p>
      <div class="eq">\[ \Big(\sigma_{x'} - \tfrac{\sigma_x+\sigma_y}{2}\Big)^2 + \sigma_{x'y'}^2 = \Big(\tfrac{\sigma_x-\sigma_y}{2}\Big)^2 + \sigma_{xy}^2 \]</div>
      <p class="eqn">Eq. 3.10 · centre \(C = (\sigma_x+\sigma_y)/2\), radius \(R\)</p></div>
    <div><p>Principal stresses sit where the circle crosses the \(\sigma\) axis, where the shear is zero:</p>
      <div class="eq">\[ \sigma_{1,2} = C \pm R = \frac{\sigma_x+\sigma_y}{2} \pm \sqrt{\Big(\frac{\sigma_x-\sigma_y}{2}\Big)^2 + \sigma_{xy}^2}, \qquad \theta_p = \tfrac12\tan^{-1}\!\frac{2\sigma_{xy}}{\sigma_x-\sigma_y} \]</div>
      <p class="eqn">Eq. 3.13 – 3.14 · the largest in-plane shear is \(R\), on faces at \(\theta_p \pm 45^\circ\)</p>
      <p>The same principal values are the eigenvalues of the stress matrix, and the eigenvectors are the principal directions:</p>
      <div class="eq">\[ (\underline{\sigma} - \lambda \underline{I})\,\underline{v} = \underline{0}, \qquad \det(\underline{\sigma}-\lambda\underline{I}) = (\sigma_x-\lambda)(\sigma_y-\lambda) - \sigma_{xy}^2 = 0 \]</div>
      <p class="eqn">Eq. 3.15 – 3.16</p>
      <p>Sign convention: a positive \(\sigma_{xy}\) acts in \(+y\) on the \(+x\) face. On the circle each face is plotted at \((\sigma, \tau)\) with the \(y\) face at \((\sigma_y, -\sigma_{xy})\), so a rotation \(\theta\) of the element moves the point by \(2\theta\).</p></div>`,

  build(p) {
    p.group('Stress state');
    p.sel('preset', {
      label: 'Example', value: 'notes', options: [['custom', 'Custom']].concat(Object.entries(MOHR_PRESETS).map(([k, v]) => [k, v.label])),
      onset: v => { const pr = MOHR_PRESETS[v]; if (!pr) return; for (const k of ['sx', 'sy', 'txy']) if (!p.locked.has(k)) p.controls[k].set(pr[k]); },
    });
    p.num('sx', { label: 'σx', unit: 'MPa', min: -300, max: 300, step: 0.5, value: 16 });
    p.num('sy', { label: 'σy', unit: 'MPa', min: -300, max: 300, step: 0.5, value: 10 });
    p.num('txy', { label: 'σxy (shear)', unit: 'MPa', min: -300, max: 300, step: 0.5, value: 4, help: 'Positive σxy acts in +y on the +x face.' });
    p.group('Rotation');
    p.num('th', { label: 'Rotation θ (counterclockwise)', unit: 'deg', min: -90, max: 90, step: 0.5, value: 15 });
    const snap = (label, fn) => h('button', { class: 'btn small', type: 'button', onclick: () => { if (p.locked.has('th')) return; const v = fn(); if (Number.isFinite(v)) { p.controls.th.set(+v.toFixed(3)); p.schedule(); } } }, label);
    p._grp.append(h('div', { class: 'btnrow' },
      snap('θ = 0', () => 0),
      snap('To principal', () => mohrSolve(p.S.sx, p.S.sy, p.S.txy, 0).thp),
      snap('To max shear', () => mohrSolve(p.S.sx, p.S.sy, p.S.txy, 0).ths)));
    p.group('Display');
    p.seg('tdir', { label: 'τ axis on the circle', value: 'down', options: [['down', 'Positive down'], ['up', 'Positive up']] });
    p.chk('show3d', { label: 'Show 3D circles (plane stress, σz = 0)', value: false });

    p.schem = h('div', { class: 'schem' });
    p.panel('Stress element', 'Eq. 3.5–3.7').append(p.schem,
      h('p', { class: 'note' }, 'Red arrows are tension, blue are compression, green are shear. Arrow length scales with magnitude.'));
    p.ro = p.panel('Results', 'Eq. 3.13–3.14');
    const two = h('div', { class: 'two' });
    p.out.append(two);
    p.pC = p.panel("Mohr's circle", 'Eq. 3.10', two);
    p.circNote = h('p', { class: 'note' });
    p.pC.after(p.circNote);
    p.pA = p.panel('Stresses on the rotated face vs θ', 'Eq. 3.5–3.7', two);
    p.eig = p.panel('Eigenvalue method and change of basis', 'Eq. 3.11, 3.15–3.16');
    const cc = p.panel('Concept checks');
    cc.append(
      h('p', { class: 'concept' }, h('b', null, 'Pure shear (3.1.4). '), 'Load the pure-shear example. Where is the centre of the circle, and at what angle are the principal stresses? Why does a brittle chalk stick in torsion break on a 45° helix?'),
      h('p', { class: 'concept' }, h('b', null, 'Eigenvalues. '), 'For pure shear, what are the eigenvalues and eigenvectors of the stress matrix? Compare with the eigenvalue panel.'),
      h('p', { class: 'concept' }, h('b', null, 'Invariants. '), 'Rotate the element and watch σx′ + σy′. Why does it never change, and where does it appear on the circle?'),
      h('p', { class: 'concept' }, h('b', null, 'Out-of-plane shear. '), 'Load equal biaxial tension: the in-plane circle shrinks to a point. Turn on the 3D circles. Where is the maximum shear now, and why does it matter for yielding (Ch. 4)?'));
  },

  update(p) {
    const S = p.S, M = mohrSolve(S.sx, S.sy, S.txy, S.th), E = mohrEigen(S.sx, S.sy, S.txy);
    const match = Object.entries(MOHR_PRESETS).find(([, v]) => v.sx === S.sx && v.sy === S.sy && v.txy === S.txy);
    const key = match ? match[0] : 'custom';
    if (S.preset !== key) p.controls.preset.set(key);
    const down = S.tdir === 'down';

    drawStressElements(p.schem, S, M);

    p.readouts(p.ro, [
      { k: 'Centre C', v: M.C, u: 'MPa' },
      { k: 'Radius R', v: M.R, u: 'MPa', eq: '3.10' },
      { k: 'σ1', v: M.s1, u: 'MPa', eq: '3.13' },
      { k: 'σ2', v: M.s2, u: 'MPa', eq: '3.13' },
      { k: 'θp (to σ1)', v: M.hydro ? 'any' : fmt(M.thp, 4), u: M.hydro ? '' : '°', eq: '3.14' },
      { k: 'Max in-plane shear', v: M.R, u: 'MPa' },
      { k: 'θs (face of +τmax)', v: M.hydro ? 'any' : fmt(M.ths, 4), u: M.hydro ? '' : '°' },
      { k: 'Abs. max shear (σz = 0)', v: M.tauAbs, u: 'MPa', cls: M.tauAbs > M.R * (1 + 1e-9) ? 'warn' : null, title: 'With σz = 0 the largest shear can act out of the plane' },
      { k: 'σx′', v: M.sxp, u: 'MPa', eq: '3.5' },
      { k: 'σy′', v: M.syp, u: 'MPa', eq: '3.6' },
      { k: 'τx′y′', v: M.txyp, u: 'MPa', eq: '3.7' },
      { k: 'σx′ + σy′ (invariant)', v: M.sxp + M.syp, u: 'MPa' },
    ]);

    mohrCirclePlot(p.pC, { x: S.sx, y: S.sy, xy: S.txy, th: S.th, M, down, show3d: S.show3d, ...MOHR_STRESS });
    p.circNote.textContent = mohrDirNote(down, 'τ');
    mohrAnglePlot(p.pA, { x: S.sx, y: S.sy, xy: S.txy, th: S.th, M, ...MOHR_STRESS });

    // eigenvalue method & change of basis
    const n = v => fmt(v, 4);
    const mat = rows => h('span', { class: 'mat', style: { gridTemplateColumns: `repeat(${rows[0].length}, auto)` } }, rows.flat().map(v => h('span', null, typeof v === 'string' ? v : n(v))));
    const term = (v, s2) => (v < 0 ? ' − ' : ' + ') + n(Math.abs(v)) + s2;
    const t = S.th * Math.PI / 180, c = Math.cos(t), sn = Math.sin(t);
    const agree = Math.abs(E.l1 - M.s1) + Math.abs(E.l2 - M.s2) <= 1e-9 * Math.max(1, Math.abs(M.s1), Math.abs(M.s2));
    p.eig.replaceChildren(
      h('div', { class: 'two' },
        h('div', null,
          h('div', { class: 'eyebrow' }, 'Eigenvalues, Eq. 3.15–3.16'),
          h('div', { class: 'mrow' }, 'σ =', mat([[S.sx, S.txy], [S.txy, S.sy]])),
          h('div', { class: 'mrow' }, `det(σ − λI) = λ²${term(-E.tr, 'λ')}${term(E.det, '')} = 0`),
          h('div', { class: 'mrow' }, `λ₁ = ${n(E.l1)} MPa,  λ₂ = ${n(E.l2)} MPa`),
          h('div', { class: 'mrow' }, 'v₁ =', mat([[E.v1[0]], [E.v1[1]]]), `→ ${n(E.a1)}°`, h('span', { style: { width: '12px' } }), 'v₂ =', mat([[E.v2[0]], [E.v2[1]]]), `→ ${n(E.a2)}°`),
          h('div', { class: 'mrow' }, h('span', { class: 'pill ' + (agree ? 'ok' : 'bad') }, agree ? 'Same principal stresses as Mohr’s circle' : 'Does not match Mohr’s circle'))),
        h('div', null,
          h('div', { class: 'eyebrow' }, `Change of basis at θ = ${n(S.th)}°, Eq. 3.11`),
          h('div', { class: 'mrow' }, 'R =', mat([[c, -sn], [sn, c]])),
          h('div', { class: 'mrow' }, 'σ′ = Rᵀ σ R =', mat([[M.sxp, M.txyp], [M.txyp, M.syp]])),
          h('p', { class: 'note' }, 'Press “To principal”: σ′ becomes diagonal, and its diagonal holds the eigenvalues.'))));
  },
});

/* Module: Strain Transformation (Notes 3.2, Eq. 3.17–3.24)
   Strains are entered in microstrain. Shear is entered as engineering γxy; the transformation uses εxy = γxy/2 (Eq. 3.18). */

const STRAIN_PRESETS = {
  uni: { label: 'Uniaxial tension (ν = 0.3)', ex: 1000, ey: -300, g: 0 },
  shear: { label: 'Pure shear, γ = 1000 µε', ex: 0, ey: 0, g: 1000 },
  biax: { label: 'Equal biaxial stretch', ex: 600, ey: 600, g: 0 },
  general: { label: 'General state', ex: 600, ey: -200, g: 800 },
};

function drawStrainElements(el, S, M) {
  const W = Math.max(300, el.clientWidth || 600), wide = W >= 560, s = Plot.s;
  const C = { ink: cv('--ink'), muted: cv('--muted'), acc: cv('--accent'), surf: cv('--surface'), fill: cv('--accent-soft'), gold: cv('--c2') };
  const half = Math.max(34, Math.min(wide ? W / 4 : W / 2, 150) * 0.36);
  const reach = half * 1.3 + 14, cellH = 2 * reach + 52, H = (wide ? cellH : 2 * cellH) + 18;
  const svg = s('svg', { viewBox: `0 0 ${W} ${H}`, width: W, height: H, role: 'img', 'aria-label': 'Deformed element on x–y axes and rotated by θ', 'font-family': 'IBM Plex Mono, Menlo, monospace' });
  s('rect', { x: 0, y: 0, width: W, height: H, fill: C.surf }, svg);
  const defs = s('defs', {}, svg);
  const m = s('marker', { id: 'stA', viewBox: '0 0 10 10', refX: 9, refY: 5, markerWidth: 6, markerHeight: 6, orient: 'auto' }, defs); s('path', { d: 'M0,0 L10,5 L0,10 z', fill: C.acc }, m);
  const exy = S.g / 2, epsMax = Math.max(Math.abs(M.s1), Math.abs(M.s2));
  const k = epsMax > 0 ? 0.15 / (epsMax * 1e-6) : 0;          // magnification so the largest strain looks like 15 %
  const E = [[S.ex * 1e-6 * k, exy * 1e-6 * k], [exy * 1e-6 * k, S.ey * 1e-6 * k]];
  const element = (cx, cy, thD, vals, title, names) => {
    const t = thD * Math.PI / 180, ex = [Math.cos(t), Math.sin(t)], ey = [-Math.sin(t), Math.cos(t)];
    const P = (x, y) => [cx + x, cy - y];
    const corners = [[1, 1], [-1, 1], [-1, -1], [1, -1]].map(([u, v]) => [half * (u * ex[0] + v * ey[0]), half * (u * ex[1] + v * ey[1])]);
    const path = pts => 'M' + pts.map(([x, y]) => P(x, y).map(v => v.toFixed(1)).join(',')).join('L') + 'Z';
    const def = corners.map(([x, y]) => [x + E[0][0] * x + E[0][1] * y, y + E[1][0] * x + E[1][1] * y]);
    s('path', { d: path(def), fill: C.fill, stroke: C.acc, 'stroke-width': 2 }, svg);
    s('path', { d: path(corners), fill: 'none', stroke: C.muted, 'stroke-width': 1.2, 'stroke-dasharray': '4 3' }, svg);
    const ax = half * 0.55;
    for (const [d, nm] of [[ex, names[0]], [ey, names[1]]]) {
      const a = P(0, 0), b = P(ax * d[0], ax * d[1]);
      s('line', { x1: a[0], y1: a[1], x2: b[0].toFixed(1), y2: b[1].toFixed(1), stroke: C.acc, 'stroke-width': 1.5, 'marker-end': 'url(#stA)' }, svg);
      const l = P((ax + 10) * d[0], (ax + 10) * d[1]); const tx = s('text', { x: l[0].toFixed(1), y: (l[1] + 4).toFixed(1), 'text-anchor': 'middle', 'font-size': 11, fill: C.acc }, svg); tx.textContent = nm;
    }
    const tt = s('text', { x: cx, y: cy - reach - 6, 'text-anchor': 'middle', 'font-size': 12.5, 'font-weight': 600, fill: C.ink, 'font-family': 'IBM Plex Sans, Segoe UI, Arial, sans-serif' }, svg); tt.textContent = title;
    const vt = s('text', { x: cx, y: cy + reach + 18, 'text-anchor': 'middle', 'font-size': 11.5, fill: C.muted }, svg); vt.textContent = vals;
  };
  const c1 = wide ? [W * 0.25, reach + 26] : [W / 2, reach + 26];
  const c2 = wide ? [W * 0.75, reach + 26] : [W / 2, cellH + reach + 26];
  element(c1[0], c1[1], 0, `εx = ${fmt(S.ex, 4)}  εy = ${fmt(S.ey, 4)}  γxy = ${fmt(S.g, 4)}`, 'Original axes x, y', ['x', 'y']);
  element(c2[0], c2[1], S.th, `εx′ = ${fmt(M.sxp, 4)}  εy′ = ${fmt(M.syp, 4)}  γx′y′ = ${fmt(2 * M.txyp, 4)}`, `Rotated θ = ${fmt(S.th, 4)}°`, ['x′', 'y′']);
  const note = s('text', { x: W / 2, y: H - 6, 'text-anchor': 'middle', 'font-size': 10.5, fill: C.muted }, svg);
  note.textContent = k ? `deformation exaggerated ×${fmt(k, 2)}; values in µε` : 'no deformation';
  el.replaceChildren(svg);
}

defineModule({
  id: 'strain',
  title: 'Strain Transformation',
  eq: 'Eq. 3.17–3.24',
  lede: 'See how a small square deforms, and how the strains change when you measure them on rotated axes. Mohr’s circle works for strain exactly as for stress, once the shear is written as εxy = γxy/2.',
  theory: String.raw`
    <div><p>Strain is the symmetric part of the displacement gradient. Its off-diagonal terms are the tensor shear strains, half of the engineering shear strain \(\gamma\):</p>
      <div class="eq">\[ \underline{\varepsilon} = \tfrac12(\nabla u + \nabla u^T) = \begin{bmatrix} \varepsilon_x & \gamma_{xy}/2 \\ \gamma_{xy}/2 & \varepsilon_y \end{bmatrix}, \qquad \varepsilon_{xy} = \tfrac12\Big(\frac{\partial u_x}{\partial y} + \frac{\partial u_y}{\partial x}\Big) = \frac{\gamma_{xy}}{2} \]</div>
      <p class="eqn">Eq. 3.18 – 3.20 · \(\gamma\) and \(\varepsilon_{xy}\) differ by a factor of 2; mixing them up is the most common error</p>
      <p>Small (infinitesimal) strain drops the \(\nabla u^T\nabla u\) term of the full strain \(\underline{E}\) (Eq. 3.21), which is why everything here is linear in the strains.</p></div>
    <div><p>Rotating the axes by \(\theta\) (counterclockwise) transforms strain with the same equations as stress:</p>
      <div class="eq">\[ \varepsilon_{x'} = \tfrac12(\varepsilon_x+\varepsilon_y) + \tfrac12(\varepsilon_x-\varepsilon_y)\cos 2\theta + \varepsilon_{xy}\sin 2\theta \]</div>
      <div class="eq">\[ \varepsilon_{y'} = \tfrac12(\varepsilon_x+\varepsilon_y) - \tfrac12(\varepsilon_x-\varepsilon_y)\cos 2\theta - \varepsilon_{xy}\sin 2\theta \]</div>
      <div class="eq">\[ \varepsilon_{x'y'} = \varepsilon_{xy}\cos 2\theta - \tfrac12(\varepsilon_x-\varepsilon_y)\sin 2\theta \]</div>
      <p class="eqn">Eq. 3.22 – 3.24 · principal strains \(\varepsilon_{1,2} = C \pm R\), \(\gamma_{max} = 2R\)</p>
      <p>A strain gauge at angle \(\theta\) reads \(\varepsilon_{x'}(\theta)\). That is the basis of the strain gauge rosette (App. A).</p></div>`,

    p.num('g', { label: 'γxy (engineering shear)', unit: 'µε', min: -6000, max: 6000, step: 1, value: 800, help: 'Positive γxy closes the angle between the +x and +y edges.' });
    p.group('Rotation');

    const snap = (label, fn) => h('button', { class: 'btn small', type: 'button', onclick: () => { if (p.locked.has('th')) return; const v = fn(); if (Number.isFinite(v)) { p.controls.th.set(+v.toFixed(3)); p.schedule(); } } }, label);
    p._grp.append(h('div', { class: 'btnrow' },
      snap('θ = 0', () => 0),
      snap('To principal', () => mohrSolve(p.S.ex, p.S.ey, p.S.g / 2, 0).thp),
      snap('To max shear', () => mohrSolve(p.S.ex, p.S.ey, p.S.g / 2, 0).ths)));
    p.group('Display');
    p.seg('tdir', { label: 'γ/2 axis on the circle', value: 'down', options: [['down', 'Positive down'], ['up', 'Positive up']] });

    p.schem = h('div', { class: 'schem' });
    p.panel('Deformed element', 'Eq. 3.18, 3.22–3.24').append(p.schem,
      h('p', { class: 'note' }, 'Dashed: undeformed square. Filled: the same square after straining, greatly exaggerated. At the principal angle the square stretches into a rectangle with no change in its corner angles.'));
    p.ro = p.panel('Results', 'Eq. 3.22–3.24');
    const two = h('div', { class: 'two' });
    p.out.append(two);
    p.pC = p.panel("Mohr's circle for strain", 'ε vs γ/2', two);
    p.circNote = h('p', { class: 'note' }); p.pC.after(p.circNote);
    p.pA = p.panel('Strain read by a gauge at angle θ', 'Eq. 3.22–3.24', two);

    const cc = p.panel('Concept checks');
    cc.append(
      h('p', { class: 'concept' }, h('b', null, 'Engineering vs tensor shear (3.2.1). '), 'The matrix panel shows what happens if you put γxy instead of γxy/2 in the matrix. How large is the error in ε1 for the general example?'),
      h('p', { class: 'concept' }, h('b', null, 'Pure shear. '), 'Load pure shear and rotate to the principal angle. The square becomes a rectangle: one diagonal stretches and the other shortens. By how much, compared with γ?'),

  },

  update(p) {

    ]);
    mohrCirclePlot(p.pC, { x: S.ex, y: S.ey, xy: exy, th: S.th, M, down, ...MOHR_STRAIN });
    p.circNote.textContent = mohrDirNote(down, 'γ/2');
    mohrAnglePlot(p.pA, { x: S.ex, y: S.ey, xy: exy, th: S.th, M, ...MOHR_STRAIN });
    const wrong = mohrSolve(S.ex, S.ey, S.g, 0);
    const errPct = M.s1 !== 0 ? (wrong.s1 - M.s1) / Math.abs(M.s1) * 100 : NaN;
    p.mat.replaceChildren(h('div', { class: 'two' },
      h('div', null,

        h('div', { class: 'mrow' }, `det(ε − λI) = λ²${signTerm(-Eg.tr, 'λ')}${signTerm(Eg.det, '')} = 0`),
        h('div', { class: 'mrow' }, `ε₁ = ${fmt(Eg.l1, 4)},  ε₂ = ${fmt(Eg.l2, 4)} µε  at ${fmt(Eg.a1, 4)}° and ${fmt(Eg.a2, 4)}°`)),
      h('div', null,
        h('div', { class: 'eyebrow' }, 'Common mistake: the full engineering shear off the diagonal'),

        h('div', { class: 'mrow' }, `would give ε₁ = ${fmt(wrong.s1, 4)} µε, ε₂ = ${fmt(wrong.s2, 4)} µε`),
        S.g !== 0 ? h('span', { class: 'pill bad' }, `ε₁ off by ${Number.isFinite(errPct) ? (errPct >= 0 ? '+' : '') + fmt(errPct, 3) + ' %' : 'a lot'}`) : h('span', { class: 'pill ok' }, 'No shear, so no difference here'))));
